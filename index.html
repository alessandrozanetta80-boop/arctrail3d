// sbagliarsi, e un tema nuovo non deve ricordarsi di aggiornarlo.
var m = document.querySelector('meta[name="theme-color"]');
if(m){
var fondo = "";
try{ fondo = window.getComputedStyle(document.body).getPropertyValue("--surface").trim(); }catch(e){}
if(fondo) m.setAttribute("content", fondo);
}
}

// ── LE TRANSIZIONI DI SCHERMATA ──────────────────────────────────────────
// render() svuota e ridisegna tutto: e' semplice e non sbaglia mai uno stato,
// ma visivamente l'app SBATTE da una schermata all'altra come una pagina web
// che si ricarica, invece di rispondere come un oggetto.
// startViewTransition() incarica il browser di dissolvere fra il prima e il
// dopo. Costa cinque righe e non tocca una virgola della logica.
// Due cautele, che sono il punto:
//   1) SOLO quando si cambia davvero schermata o sezione. Sul percorso ogni
//      freccia ridisegna: dissolvere li' vorrebbe dire ritardare la conferma
//      del punteggio, cioe' peggiorare l'unica cosa che conta.
//   2) mai con "riduci movimento" acceso.
// ---------- CONTINUITA' FRA UN DISEGNO E L'ALTRO ----------
// render() svuota #app e lo ricostruisce. E' semplice e non sbaglia mai lo
// stato, ma butta via tre cose che il browser teneva per noi: la posizione di
// scorrimento, il fuoco della tastiera e il punto in cui era il cursore.
// Qui le mettiamo da parte prima di svuotare e le rimettiamo dopo.
//
// Due livelli, di proposito:
//
//   AUTOMATICO - scorrimento, fuoco, cursore. Non possono fare danno: se al
//     ridisegno non ritroviamo il campo che aveva il fuoco, lasciamo perdere
//     in silenzio. Nessuna schermata va toccata perche' funzioni.
//
//   DICHIARATO - il testo non ancora inviato (data-keep) e i riquadri con
//     scorrimento proprio (data-scroll-key) si salvano solo se il markup lo
//     chiede. Indovinare qui vorrebbe dire far ricomparire un messaggio gia'
//     spedito: meglio chiedere che sbagliare.
//
// Tutto vive dentro render(). Le 152 chiamate a render() sparse per il file
// non cambiano di una virgola.

var keepScroll = {};   // chiave schermata -> scrollTop del documento
var keepInner  = {};   // data-scroll-key  -> scrollTop del riquadro, o "end"
var keepDraft  = {};   // data-keep        -> testo non ancora inviato
var keepFocus  = null; // il campo che aveva il fuoco al disegno precedente
var lastMoved  = false;

// La chiave dello scorrimento e' piu' fine di quella delle transizioni: due
// chat diverse sono la stessa schermata per il browser, ma non per chi legge.
// Se nasce un'altra schermata "di dettaglio", il suo identificativo va qui.
function scrollKey(){
var extra = state.dmUid || state.compagniaAttiva || "";
return String(state.screen)+"|"+String(state.tab)+"|"+String(authState)+"|"+String(extra);
}

// Firma di un campo. Se ha un id, quello. Altrimenti la sua posizione
// nell'albero: l'indice fra i fratelli, dal campo fino a #app. Fragile per
// definizione, e va bene cosi': se il disegno e' cambiato non ritroviamo il
// campo e non facciamo niente, invece di dare il fuoco a quello sbagliato.
function fieldPath(node){
if(node.id) return "#"+node.id;
var parts = [], n = node, s, i;
while(n && n.id !== "app" && n.parentNode){
i = 0; s = n;
while((s = s.previousElementSibling)) i++;
parts.push(i);
n = n.parentNode;
}
if(!n || n.id !== "app") return null;
return parts.reverse().join("-");
}

function fieldAt(path){
if(!path) return null;
if(path.charAt(0) === "#") return document.getElementById(path.slice(1));
var n = document.getElementById("app");
var idx = path.split("-");
for(var i=0; i<idx.length && n; i++){ n = n.children[Number(idx[i])]; }
return n || null;
}

function captureContinuity(){
var app = document.getElementById("app");
if(!app) return;

var doc = document.scrollingElement || document.documentElement;
keepScroll[scrollKey()] = doc.scrollTop;

// Riquadri con scorrimento proprio. "In fondo" si ricorda come tale: se
// intanto e' arrivato un messaggio, la chat deve restare in fondo, non
// tornare al pixel di prima.
var boxes = app.querySelectorAll("[data-scroll-key]");
for(var i=0; i<boxes.length; i++){
var b = boxes[i];
var atEnd = (b.scrollHeight - b.scrollTop - b.clientHeight) < 24;
keepInner[b.getAttribute("data-scroll-key")] = atEnd ? "end" : b.scrollTop;
}

var drafts = app.querySelectorAll("[data-keep]");
for(var j=0; j<drafts.length; j++){
keepDraft[drafts[j].getAttribute("data-keep")] = drafts[j].value;
}

keepFocus = null;
var a = document.activeElement;
if(a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){
var path = fieldPath(a);
if(path){
keepFocus = {
key: scrollKey(),
path: path,
tag: a.tagName,
type: a.getAttribute("type") || "",
hint: a.getAttribute("placeholder") || a.getAttribute("name") || "",
start: null,
end: null
};
// selectionStart non esiste su input number/email/date: non e' un errore.
try{ keepFocus.start = a.selectionStart; keepFocus.end = a.selectionEnd; }catch(e){}
}
}
}

function restoreContinuity(sameScreen){
var app = document.getElementById("app");
if(!app) return;

var boxes = app.querySelectorAll("[data-scroll-key]");
for(var i=0; i<boxes.length; i++){ restoreBox(boxes[i]); }

var drafts = app.querySelectorAll("[data-keep]");
for(var j=0; j<drafts.length; j++){
var d = drafts[j];
var v = keepDraft[d.getAttribute("data-keep")];
// Se la schermata ha gia' messo un valore suo, quello vince: lo stato
// salvato e' piu' autorevole di una bozza in memoria.
if(v && !d.value) d.value = v;
}

// Il fuoco torna solo su un ridisegno della stessa schermata. Cambiare
// schermata e trovarsi la tastiera aperta e' un dispetto, non un aiuto.
if(sameScreen && keepFocus && keepFocus.key === scrollKey()){
var f = fieldAt(keepFocus.path);
var same = f && f.tagName === keepFocus.tag
&& (f.getAttribute("type") || "") === keepFocus.type
&& (f.getAttribute("placeholder") || f.getAttribute("name") || "") === keepFocus.hint;
if(same && f !== document.activeElement){
try{ f.focus({ preventScroll:true }); }catch(e){ try{ f.focus(); }catch(e2){} }
if(keepFocus.start !== null && f.setSelectionRange){
try{ f.setSelectionRange(keepFocus.start, keepFocus.end); }catch(e3){}
}
}
}

applyScroll(keepScroll[scrollKey()] || 0);
}

// Rimettere un riquadro dove stava. Chiamabile anche da fuori: le chat si
// riempiono dopo, quando risponde Firestore, e a quel punto il riquadro e'
// ancora vuoto per noi.
// "ripiego" e' dove si va la prima volta, quando non c'e' ancora niente da
// ricordare: per una chat e' il fondo, per un elenco e' l'inizio.
function restoreBox(node, ripiego){
if(!node) return;
var v = keepInner[node.getAttribute("data-scroll-key")];
if(v === undefined) v = (ripiego === undefined) ? 0 : ripiego;
node.scrollTop = (v === "end") ? node.scrollHeight : v;
}

// Sul desktop html ha scroll-behavior:smooth. Rimettere lo scorrimento dove
// stava non e' uno spostamento, e' un ripristino: deve essere istantaneo,
// altrimenti si vede la pagina "risalire" da sola dopo ogni ridisegno.
// Due passate: subito, e al fotogramma dopo, quando l'altezza e' definitiva.
function applyScroll(y){
var doc = document.scrollingElement || document.documentElement;
if(y === 0 && doc.scrollTop === 0) return;
var root = document.documentElement;
root.classList.add("no-smooth");
doc.scrollTop = y;
requestAnimationFrame(function(){
doc.scrollTop = y;
root.classList.remove("no-smooth");
});
}

// Questa navigazione riparte dall'alto: dimentica dove eravamo.
function forgetScroll(){ delete keepScroll[scrollKey()]; }

// Il testo e' stato spedito: la bozza non esiste piu'. Senza questa, il
// messaggio appena inviato tornerebbe nel campo al primo ridisegno.
function forgetDraft(k){ delete keepDraft[k]; }

var vtKey = "";
function render(){
var key = String(state.screen) + "|" + String(state.tab) + "|" + String(authState);
var moved = (vtKey !== "" && key !== vtKey);
vtKey = key;
lastMoved = moved;
captureContinuity();
var still = (typeof window.matchMedia === "function")
&& window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!moved || still || typeof document.startViewTransition !== "function"){ renderNow(); return; }
try{ document.startViewTransition(function(){ renderNow(); }); }
catch(e){ renderNow(); }
}

function renderNow(){
paintScreen();
restoreContinuity(!lastMoved);
}

function paintScreen(){
var app = document.getElementById("app");
app.innerHTML = "";
app.classList.toggle("narrow", !state.lang || authState !== "ready" || !!NARROW_SCREENS[state.screen]);
// La pista e' l'unica schermata che non scorre: #app diventa una colonna
// flessibile perche' la tastiera possa stare in fondo senza posizione fissa.
// LA REGOLA "NON SCORRE" SEGUE LA SCHERMATA CHE SI VEDE, NON LO STATO.
// Con homeOverride lo stato resta "round" ma a schermo c'e' il menu: la
// condizione guardava solo state.screen, quindi il menu ereditava
// height:100dvh + overflow:hidden e RESTAVA BLOCCATO. Si usciva dal giro e la
// pagina non si scorreva piu'. Il bug era li' dal 15/08, prima di tutto il
// resto: nessuno era mai uscito dal giro per guardare il menu.
document.body.classList.toggle("schermo-percorso",
state.screen === "round" && authState === "ready" && !homeOverride);
if(typeof syncNavGuard === "function") syncNavGuard();
if(state.lang){ document.documentElement.lang = state.lang; }
applyTheme(currentTheme());
if(!state.lang){ app.appendChild(setupScreen()); return; }
if(authState === "loading"){ app.appendChild(loadingScreen()); return; }
if(authState === "linkSent"){ app.appendChild(linkSentScreen()); return; }
if(authState === "authError"){ app.appendChild(authErrorScreen()); return; }
if(authState === "firebaseError"){ app.appendChild(firebaseErrorScreen()); return; }
if(authState === "verifyEmail"){ app.appendChild(verifyEmailScreen()); return; }
if(authState === "pendingApproval"){ app.appendChild(pendingApprovalScreen()); return; }
if(!state.profile && !state.profileSkipped){
if(state.screen === "profile-registration"){ app.appendChild(profileRegistrationScreen()); return; }
app.appendChild(welcomeScreen()); return;
}
if(authState === "needLogin"){ app.appendChild(loginScreen()); return; }
if(!state.country || !state.federation || state.screen === "setup"){ app.appendChild(setupScreen()); return; }
// Il segnale vale solo per percorso e classifica: su ogni altra schermata va spento,
// altrimenti la barra resta senza comando di ritorno e non si esce piu'.
if(homeOverride && state.screen !== "round" && state.screen !== "summary"){ homeOverride = false; }
app.appendChild(header());
if(homeOverride && (state.screen === "round" || state.screen === "summary")){ app.appendChild(menuScreen()); appendTabBarTo(app); return; }
switch(state.screen){
case "registration": app.appendChild(registrationScreen()); break;
case "menu": app.appendChild(menuScreen()); break;
case "training-setup": app.appendChild(trainingSetupScreen()); break;
case "gara-setup": app.appendChild(garaSetupScreen()); break;
case "prepara-gara":
// Seconda serratura: se la schermata viene ripresa da uno stato salvato
// da chi non e' (piu') referente, si torna al menu invece di aprirla.
if(pgAccessAllowed() === false){ state.screen = "menu"; save(); app.appendChild(menuScreen()); }
else { app.appendChild(preparaGaraScreen()); }
break;
case "campi": app.appendChild(campiScreen()); break;
case "compagnie": app.appendChild(compagnieScreen()); break;
case "club-space": app.appendChild(clubSpaceScreen()); break;
case "profile-edit": app.appendChild(profileEditScreen()); break;
case "history": app.appendChild(journalScreen()); break;
case "history-detail": app.appendChild(historyDetailScreen()); break;
case "info": app.appendChild(infoScreen()); break;
case "blocked-users": app.appendChild(blockedUsersScreen()); break;
case "account-delete": app.appendChild(accountDeleteScreen()); break;
case "admin": app.appendChild(adminScreen()); break;
case "session-follow": app.appendChild(sessionFollowScreen()); break;
case "open-training-create": app.appendChild(openTrainingCreateScreen()); break;
case "field-report": app.appendChild(fieldReportScreen()); break;
case "notifiche": app.appendChild(notificationsScreen()); break;
case "messaggi": app.appendChild(messagesScreen()); break;
case "dm-chat": app.appendChild(dmChatScreen()); break;
case "ot-chat": app.appendChild(otChatScreen()); break;
case "diario": app.appendChild(journalScreen()); break;
case "round": app.appendChild(roundScreen()); break;
case "summary": app.appendChild(summaryScreen()); break;
default: app.appendChild(registrationScreen());
}
if(currentUser && authState === "ready"){ appendTabBarTo(app); }
if(authState === "ready") maybeShowWelcomeNote();
}

var ov = el('<div id="welcomeNote" style="position:fixed;inset:0;z-index:200;background:rgba(6,12,10,.72);display:flex;align-items:center;justify-content:center;padding:18px;"></div>');

box.appendChild(reportBtn);

welcomeNoteDone = true;
if(ov.parentNode) ov.parentNode.removeChild(ov);
});
box.appendChild(okBtn);

document.body.appendChild(ov);
}

function loginScreen(){
var wrap = el('<div class="splash-wrap"></div>');
var logo = el('<div class="splash-logo"></div>');
logo.innerHTML = logoSVG(150);
wrap.appendChild(logo);
wrap.appendChild(el('<div class="onboard-sub">Accedi con la tua email per continuare</div>'));
var input = el('<input type="email" id="loginEmailInput" placeholder="La tua email" style="max-width:280px;text-align:center;">');
wrap.appendChild(input);
// Il campo dell'accesso e' centrato come quello dell'email sopra: perche'
// il testo resti centrato DAVVERO, l'occhio a destra si compensa con lo
// stesso spazio a sinistra. Un testo centrato in un campo con un tasto solo
// da una parte non e' centrato, e' spostato.
var passBox = campoPassword("loginPasswordInput", "current-password");
passBox.classList.add("in-mezzo");
passBox.querySelector("input").setAttribute("placeholder", t("login_password"));
wrap.appendChild(passBox);
var errorMsg = el('<div style="color:var(--danger);font-size:0.8rem;margin-top:8px;min-height:1.2em;"></div>');
if(authErrorMsg){ errorMsg.textContent = authErrorMsg; }
wrap.appendChild(errorMsg);
var sendBtn = el('<button class="btn btn-primary" style="margin-top:14px;">Accedi \u2192</button>');
wrap.appendChild(sendBtn);
var forgotLink = el('<div style="font-size:0.78rem;color:var(--accent-soft);margin-top:14px;cursor:pointer;text-decoration:underline;">'+t("login_forgot")+'</div>');
wrap.appendChild(forgotLink);

function trySend(){
var email = document.getElementById("loginEmailInput").value.trim();
var password = document.getElementById("loginPasswordInput").value;
if(!email || email.indexOf("@") < 0){
errorMsg.textContent = "Inserisci un'email valida.";
return;
}
if(!password){
errorMsg.textContent = t("login_password");
return;
}
sendBtn.disabled = true;
auth.signInWithEmailAndPassword(email, password).then(function(result){
onAuthReady(result.user);
}).catch(function(err){
sendBtn.disabled = false;
errorMsg.textContent = (err && err.message) ? err.message : "Email o password non corretti.";
});
}
sendBtn.addEventListener("click", trySend);
forgotLink.addEventListener("click", function(){
var email = document.getElementById("loginEmailInput").value.trim();
if(!email || email.indexOf("@") < 0){
errorMsg.textContent = "Inserisci prima la tua email qui sopra.";
return;
}
auth.languageCode = state.lang || "it";
auth.sendPasswordResetEmail(email).then(function(){
errorMsg.style.color = "var(--accent-soft)";
errorMsg.textContent = t("login_reset_sent");
}).catch(function(err){
errorMsg.style.color = "var(--danger)";
errorMsg.textContent = (err && err.message) ? err.message : "Non sono riuscito a inviare l'email, riprova.";
});
});
setTimeout(function(){
input.focus();
passInput.addEventListener("keydown", function(e){ if(e.key === "Enter") trySend(); });
},0);

return wrap;
}

wrap.appendChild(msg);

doneBtn.addEventListener("click", function(){
if(!auth.currentUser){ authState = "needLogin"; render(); return; }
doneBtn.disabled = true;
auth.currentUser.reload().then(function(){
var u = auth.currentUser;
if(u && u.emailVerified){
currentUser = u;
authState = "loading"; render();
onAuthReady(u);
} else {
doneBtn.disabled = false;
msg.textContent = t("verify_not_yet");
}
}).catch(function(){
doneBtn.disabled = false;
msg.textContent = t("verify_not_yet");
});
});

resendBtn.addEventListener("click", function(){
var left = Math.ceil((verifyResendAt - Date.now())/1000);
if(left > 0){ msg.textContent = t("verify_wait",{sec:left}); return; }
if(!auth.currentUser){ authState = "needLogin"; render(); return; }
resendBtn.disabled = true;
try{ auth.languageCode = state.lang || "it"; }catch(e){}
auth.currentUser.sendEmailVerification().then(function(){
verifyResendAt = Date.now() + 60000;
msg.textContent = t("verify_resent");
setTimeout(function(){ resendBtn.disabled = false; }, 60000);
}).catch(function(){
resendBtn.disabled = false;
msg.textContent = t("verify_error");
});
});
wrap.appendChild(resendBtn);
var outBtn = el('<button class="btn btn-ghost" style="margin-top:10px;">Esci</button>');
outBtn.addEventListener("click", function(){
auth.signOut().then(function(){ authState = "needLogin"; currentUser = null; render(); });
});
wrap.appendChild(outBtn);
return wrap;
}

var selLang = el('<select style="'+tendinaStile+'"></select>');
if(!state.lang) selLang.appendChild(el('<option value="" disabled selected>\u2014</option>'));
LANG_ORDER.forEach(function(code){
var meta = LANG_META[code];
var opt = el('<option value="'+code+'">'+meta.flag+'  '+meta.name+'</option>');
if(state.lang === code) opt.setAttribute("selected","selected");
selLang.appendChild(opt);
});
selLang.addEventListener("change", function(){
state.lang = selLang.value;
if(!setupCountry && !state.country) setupCountry = LANG_TO_COUNTRY[state.lang] || null;
save(); render();
});
c1.appendChild(selLang);
wrap.appendChild(c1);

if(!state.lang) return wrap;

// ---- 2. nazione ----
if(setupCountry === null) setupCountry = state.country || LANG_TO_COUNTRY[state.lang] || null;

var c2 = el('<div style="background:#FFFFFF;border:1px solid #DDE2DA;border-radius:14px;padding:16px;margin-bottom:14px;"></div>');

});
selPaese.addEventListener("change", function(){
setupCountry = selPaese.value;
render();
});
c2.appendChild(selPaese);
wrap.appendChild(c2);

// ---- 3. federazioni della nazione scelta ----
if(setupCountry){
var feds = COUNTRY_FEDERATIONS[setupCountry] || [];
var c3 = el('<div style="background:#FFFFFF;border:1px solid #DDE2DA;border-radius:14px;padding:16px;margin-bottom:14px;"></div>');

} else {

var b = el('<button style="width:100%;min-height:56px;display:flex;align-items:center;gap:10px;padding:14px 16px;margin-bottom:10px;border-radius:12px;cursor:pointer;text-align:left;font-family:inherit;font-size:1.05rem;font-weight:700;'+
(scelta
? 'background:#315B35;border:2px solid #315B35;color:#fff;'
: 'background:#FFFFFF;border:2px solid #C9CFC7;color:#1A1D1B;')+'"></button>');
b.innerHTML = '<span style="flex:1;">'+escapeHtml(f.label)+'</span>'+(scelta ? '<span style="font-size:1.2rem;">\u2713</span>' : '');
b.addEventListener("click", function(){
state.country = setupCountry;
state.federation = f.code;
save(); render();
});
c3.appendChild(b);
});
}
wrap.appendChild(c3);
}

// ---- conferma: appare solo quando la scelta e' completa ----
if(state.country && state.federation){
var ok = el('<button class="btn btn-primary btn-block" style="padding:16px;font-size:1.05rem;">'+t("setup_done_btn")+'</button>');
ok.addEventListener("click", function(){
setupCountry = null;
state.screen = "menu";
homeOverride = false;
save(); render();
});
wrap.appendChild(ok);
}

return wrap;
}

function enableNotifications(statusEl, btnEl){
if(!messaging){ statusEl.textContent = t("notif_not_supported"); return; }
if(VAPID_KEY === "INCOLLA_QUI_LA_TUA_VAPID_KEY"){ statusEl.textContent = t("notif_not_configured"); return; }
btnEl.disabled = true;
statusEl.textContent = t("notif_requesting");
Notification.requestPermission().then(function(permission){
if(permission !== "granted"){
statusEl.textContent = t("notif_denied");
btnEl.disabled = false;
return;
}
var getMessagingReg = function(){
return navigator.serviceWorker.getRegistration("firebase-messaging-sw.js").then(function(existing){
var regPromise = existing ? Promise.resolve(existing) : navigator.serviceWorker.register("firebase-messaging-sw.js");
return regPromise.then(function(reg){
if(reg.active){ return reg; }
return new Promise(function(resolve){
var check = function(){
if(reg.active){ resolve(reg); return; }
setTimeout(check, 150);
};
check();
});
});
});
};
getMessagingReg().then(function(reg){
return messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
}).then(function(token){
if(!token){ statusEl.textContent = t("notif_token_error"); btnEl.disabled = false; return; }
db.collection("users").doc(currentUser.uid).update({ fcmToken: token }).then(function(){
pushRegisteredHere = true;
statusEl.textContent = t("notif_enabled");
statusEl.style.color = "var(--accent-soft)";
}).catch(function(err){
statusEl.textContent = t("notif_save_error", {err: err && err.message ? err.message : t("pg_retry")});
btnEl.disabled = false;
});
}).catch(function(err){
statusEl.textContent = t("notif_generic_error", {err: err && err.message ? err.message : t("pg_retry")});
btnEl.disabled = false;
});
});
}

// Struttura sempre uguale: logo a sinistra, nome, comando a destra.

var largo = (typeof window.matchMedia === "function") && window.matchMedia("(min-width: 760px)").matches;

);

// ── Le azioni, in ordine di importanza ────────────────────────────────
// Sul telefono ne restano in vista DUE: le altre scendono nel
// troppo-pieno. E' la regola che tiene in piedi la barra: prima erano
// fino a quattro, e per farcele stare si rimpiccioliva il marchio finche'
// non si tagliava. Si toglie un'azione, non si stringe il titolo.
// L'ordine e' questo perche' e' quello dell'uso: prima si esce, poi si
// segnala un guaio del percorso, poi si leggono le notifiche, poi i
// messaggi; cambiare federazione si fa una volta nella vita.
// L'interruttore del Sole ha provato a stare qui ed e' durato mezz'ora: in
// cima, grigio come gli altri due e grande come un'icona, non lo vedeva
// nessuno. Sta nella riga delle scorciatoie, dove arriva il pollice e dove
// puo' portarsi dietro la parola.
var azioni = [];
if(showHome){
azioni.push({ id:"menu", glifo:"home", testo:t("nav_menu"), conParola:true, vai:function(){
if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; timerRunning = false; timerRemaining = null; timerTargetKey = null; }
if(state.screen === "session-follow"){ stopFollowingSession(); state.followSessionId = null; }

// Un solo tipo di tasto nella barra: 44x44, che e' il minimo su cui un
// dito non sbaglia (Apple ne chiede 44, Material 48). Da computer i
// comandi principali si tengono anche la parola: lo spazio c'e', e una
// parola si legge sempre meglio di un glifo.
function tastoBarra(a, largo){
var conParola = largo && a.conParola;
var classi = conParola
? ("home-btn" + (a.forte ? " small" : "") + (a.pericolo ? " pericolo" : ""))
: ("bar-btn" + (a.pericolo ? " pericolo" : ""));
var b = el('<button type="button" class="'+classi+' no-print"></button>');
b.setAttribute("title", a.titolo || a.testo);
b.setAttribute("aria-label", a.titolo || a.testo);
b.innerHTML = icon(a.glifo, conParola ? 17 : 20);
if(conParola) b.appendChild(document.createTextNode(a.testo));
if(a.conta > 0) b.appendChild(el('<span class="bar-badge">'+(a.conta > 9 ? "9+" : a.conta)+'</span>'));
b.addEventListener("click", a.vai);
return b;
}

// Il troppo-pieno sta sempre nello stesso posto: ultimo tasto a destra.
// Se dentro c'e' qualcosa di non letto porta un pallino, altrimenti
// nascondere la campanella nasconderebbe anche il segnale.
function troppoPieno(azioni){
var wrap = el('<div class="bar-more no-print"></div>');
var b = el('<button type="button" class="bar-btn" aria-haspopup="menu" aria-expanded="false"></button>');
b.setAttribute("title", t("hdr_more"));
b.setAttribute("aria-label", t("hdr_more"));
b.innerHTML = icon("more", 20);
if(azioni.some(function(a){ return a.conta > 0; })) b.appendChild(el('<span class="bar-dot"></span>'));

var menu = el('<div class="bar-menu" role="menu" hidden></div>');
azioni.forEach(function(a){
var v = el('<button type="button" class="bar-menu-item" role="menuitem"></button>');

v.addEventListener("click", function(){ chiudi(); a.vai(); });
menu.appendChild(v);
});

function fuori(e){ if(!wrap.contains(e.target)) chiudi(); }
function daTastiera(e){ if(e.key === "Escape"){ chiudi(); b.focus(); } }
function chiudi(){
menu.hidden = true; b.setAttribute("aria-expanded","false");
document.removeEventListener("click", fuori, true);
document.removeEventListener("keydown", daTastiera);
}
b.addEventListener("click", function(e){
e.stopPropagation();
if(menu.hidden){
menu.hidden = false; b.setAttribute("aria-expanded","true");
document.addEventListener("click", fuori, true);
document.addEventListener("keydown", daTastiera);
} else { chiudi(); }
});
wrap.appendChild(b); wrap.appendChild(menu);
return wrap;
}

if(searchResults){
function loadApprovedUsers(cb){ loadPublicProfiles(cb); }
searchInput = document.getElementById("archerSearchInput");
searchInput.addEventListener("input", function(){
var q = searchInput.value.trim().toLowerCase();
searchResults.innerHTML = "";
if(!q) return;
loadApprovedUsers(function(list){
var already = (state.pendingArchers||[]).map(function(a){ return a.name.toLowerCase(); });
var matches = list.filter(function(u){

}).slice(0,6);

searchResults.appendChild(chip);
});
});
});
}
},0);

function addArcher(){
var input = document.getElementById("archerInput");
var val = input.value.trim();
if(!val) return;
state.pendingArchers = state.pendingArchers || [];
state.pendingArchers.push({ id: uid(), name: val });
input.value = "";
save(); render();
}
return wrap;
}

function pgElencoScreen(){

if(state.pgElenco === null){
d.appendChild(el('<div style="font-size:0.82rem;color:var(--muted);">'+t("pg_loading")+'</div>'));
db.collection("percorsi").where("createdBy","==",currentUser.uid).get().then(function(snap){
var list = [];
snap.forEach(function(doc){ list.push(Object.assign({id:doc.id}, doc.data())); });
list.sort(function(a,b){
var ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
var tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
return tb - ta;
});
state.pgElenco = list;
render();
}).catch(function(err){
state.pgElenco = [];
state.pgElencoError = err && err.message ? err.message : t("pg_load_error_generic");
render();
});
return d;
}
if(state.pgElencoError){
d.appendChild(el('<div style="font-size:0.82rem;color:var(--bark);">'+t("pg_error_loading",{err:escapeHtml(state.pgElencoError)})+'</div>'));
return d;
}

d.appendChild(el('<div style="font-size:0.82rem;color:var(--muted);">'+t("pg_no_routes_saved")+'</div>'));

/* ══════════════════════════════════════════════════════════════════════════
   LA RIGA DELL'ISCRITTO

   Chi e', e i quattro dati che finiranno in classifica. I campi scrivono
   dentro l'oggetto della persona - lo stesso oggetto che sta anche dentro la
   squadra - e NON chiamano render(): un ridisegno a ogni lettera perde il
   fuoco e il cursore, e qui si compilano sessanta righe di fila. La pastiglia
   della divisione si aggiorna da sola, senza rifare la pagina.
   ══════════════════════════════════════════════════════════════════════════ */
function menuSigle(vuoto, voci, valore, aria, cambia){

sel.appendChild(o);

sel.addEventListener("change", function(){ cambia(this.value); save(); });

/* ══════════════════════════════════════════════════════════════════════════
   L'IMPORTAZIONE LEGGE IL SENSO, NON LA POSIZIONE

   Un formato deciso da noi ("cognome, nome, tessera, classe...") obbligherebbe
   l'organizzatore a riordinare a mano cento righe uscite dal suo foglio di
   calcolo: sarebbe lavoro nostro scaricato su di lui. Quindi ogni pezzo si
   riconosce da com'e' fatto, e l'ordine delle colonne non conta:

     solo cifre, almeno quattro      il numero di tessera
     due cifre + quattro lettere     il codice di Compagnia
     sigla nota, tutta maiuscola     Classe o Categoria
     il resto, in ordine             cognome, poi nome

   LA TRAPPOLA: DA e' la sigla di Diversamente Abili ed e' anche l'inizio di
   DA SILVA. Una sigla non viene mai riconosciuta nel primo pezzo della riga,
   che e' sempre il cognome.

   LE RIGHE NON CAPITE NON SI BUTTANO. Una riga senza separatori - dai PDF
   capita - che dentro ha una tessera, o tutte e due le sigle, non e' un
   cognome: e' una riga schiacciata, e finisce fra quelle da ricontrollare.
   Una sola sigla non basta a sospettare, altrimenti DA SILVA sparirebbe dalla
   lista. Un'importazione che perde tre nomi su cento in silenzio e' peggio di
   una che non parte: l'errore si scopre in gara, quando manca una persona.
   ══════════════════════════════════════════════════════════════════════════ */
var RE_TESSERA = /^[0-9]{4,}$/;
var RE_CODICE_COMPAGNIA = /^[0-9]{2}[A-Za-z]{4}$/;
function sigleDentro(riga, sigle){
var parole = riga.split(/[^A-Za-z]+/);
for(var i=0;i<parole.length;i++){ if(parole[i] && sigle.indexOf(parole[i]) !== -1) return true; }
return false;
}
function pgLeggiRiga(riga, tab){
var pezzi = riga.split(/\s*[,;\u00b7|\t]+\s*/).map(function(x){ return x.trim(); }).filter(function(x){ return x.length; });
if(!pezzi.length) return null;
var classi = tab ? sigleDi(tab.classi) : [];
var categorie = tab ? sigleDi(tab.categorie) : [];
if(pezzi.length === 1 && (/[0-9]{4,}/.test(riga) || (sigleDentro(riga, classi) && sigleDentro(riga, categorie)))) return null;
var p = { nome:"", cognome:"" }, parole = [];
pezzi.forEach(function(v, i){
if(!p.tessera && RE_TESSERA.test(v)){ p.tessera = v; return; }
if(!p.compagnia && RE_CODICE_COMPAGNIA.test(v)){ p.compagnia = v.toUpperCase(); return; }
if(i > 0 && v === v.toUpperCase()){
if(!p.classe && classi.indexOf(v) !== -1){ p.classe = v; return; }
if(!p.categoria && categorie.indexOf(v) !== -1){ p.categoria = v; return; }
if(tab && v === tab.ospite) return; // Ospite e' l'assenza della coppia: non si scrive
}
parole.push(v);
});
p.cognome = parole.shift() || "";
p.nome = parole.join(" ");
return p.cognome ? p : null;
}
// L'intestazione di squadra nella lingua in uso, non solo in italiano: un
// olandese scrive "Team 1", e finora quella riga diventava un iscritto.
function pgIntestazioneSquadra(riga){
if(/^squadra\b/i.test(riga)) return true;
if(/^piazzola\s*[:\-]?\s*[0-9]+/i.test(riga)) return true;
var etichetta = String(t("pg_squadra_n")).split("{n}")[0].trim();
return etichetta.length > 1 && riga.toLowerCase().indexOf(etichetta.toLowerCase()) === 0;
}
function pgImporta(testo, tab){
var squadre = [], tutti = [], dubbie = [];
String(testo).split(/\n\s*\n/).forEach(function(blocco){
var membri = [];
blocco.split("\n").forEach(function(riga){
riga = riga.trim();
if(!riga || pgIntestazioneSquadra(riga)) return;
var p = pgLeggiRiga(riga, tab);
if(!p){ dubbie.push(riga); return; }
membri.push(p); tutti.push(p);
});
membri.sort(function(a,b){ return a.cognome.localeCompare(b.cognome) || a.nome.localeCompare(b.nome); });
if(membri.length) squadre.push({ membri:membri });
});
var conti = { iscritti:tutti.length, divisione:0, tessera:0, compagnia:0, dubbie:dubbie };
tutti.forEach(function(p){
if(p.classe && p.categoria) conti.divisione++;
if(p.tessera) conti.tessera++;
// Il codice si confronta con l'elenco vero: uno sbagliato resta nella riga,
// in rosso e correggibile, ma non si fa contare fra quelli buoni.
if(p.compagnia && (compagniaNome(p.compagnia) || !haElencoCompagnie(pgFederazione((state.pgDraft||{}).gara)))) conti.compagnia++;
});
return { squadre:squadre, tutti:tutti, conti:conti };
}

var dubbie = c.dubbie || [];
if(dubbie.length){
box.appendChild(el('<div class="pg-esito-dubbie">'+escapeHtml(t("pg_import_dubbie",{n:dubbie.length}))+'</div>'));
dubbie.forEach(function(riga){

}
return box;
}

// ---------- ALLENAMENTI APERTI: riga singola e sezione ----------
// Iscrizione / annullamento a un allenamento aperto.
// Prima si usava arrayRemove su un oggetto {uid,name}: se il nome mostrato
// cambiava anche di una lettera l'oggetto non combaciava piu' e l'annullamento
// falliva in silenzio. Ora si rilegge il documento e si riscrive l'elenco.
function otSetJoin(otId, join, btn, errEl){
if(!db || !currentUser) return;
var oldLabel = btn.textContent;
btn.disabled = true; btn.textContent = t("ot_join_saving");
if(errEl){ errEl.style.display = "none"; errEl.textContent = ""; }
var ref = db.collection("open_trainings").doc(otId);
var myName = myDisplayName();
ref.get().then(function(snap){
if(!snap.exists) throw new Error("allenamento non trovato");
var d = snap.data() || {};
var uids = (d.participantUids||[]).filter(function(u){ return u !== currentUser.uid; });
var arr = (d.participants||[]).filter(function(p){ return p && p.uid !== currentUser.uid; });
if(join){ uids.push(currentUser.uid); arr.push({ uid: currentUser.uid, name: myName }); }
return ref.update({ participantUids: uids, participants: arr, updatedAt: Date.now() }).then(function(){
if(join && d.ownerUid){
sendPushViaFirestore(d.ownerUid, t("ot_notif_join_title"),
t("ot_notif_join_body", { name: myName, date: d.date||"", field: d.field||"" }));
}
loadOpenTrainings();
});
}).catch(function(e){
btn.disabled = false; btn.textContent = oldLabel;
if(errEl){ errEl.textContent = t("ot_join_error"); errEl.style.display = "block"; }
console.error("OT join error:", e);
});
}

function otRowEl(ot){

// ---------- BARRA DI NAVIGAZIONE IN BASSO ----------
function tabBar(wide){
// Su telefono e' fissa in fondo; su schermo largo diventa una barra in cima,
// perche' in fondo a una pagina alta nel browser non la si vede.
// Da 760px in su non ha piu' un fondo suo: e' dentro la testata, che il
// fondo scuro ce l'ha gia'.
// niente stile in linea per il caso largo: le misure stanno in .tabbar-wide,
// altrimenti lo stile in linea vince sulle media query e la riga non va a capo.
// Niente piu' stile in linea: solo classi. Lo stile in linea vinceva contro
// il foglio di stile, e per riprendersi il controllo servivano catene di
// !important — che sono poi il motivo per cui la sezione aperta finiva verde
// su verde e diventava l'unica illeggibile.
var bar = el('<nav class="tabbar'+(wide?' tabbar-wide':' tabbar-bottom')+'" aria-label="'+t("nav_shoot")+'"></nav>');
[["campi","navfield",t("nav_fields")],
 ["tira","navshoot",t("nav_shoot")],
 ["compagnie","navclub",t("nav_clubs")],
 ["market","navmarket",t("nav_market")],
 ["profilo","navprofile",t("nav_profile")]].forEach(function(tb){
var key = tb[0], on = (state.tab === key);
// La voce attiva ha una pastiglia piena: sul telefono, al sole, il solo
// cambio di colore del testo non si vede.
var b;
if(wide){
// In riga: icona e parola affiancate, e la pastiglia e' il pulsante intero.
// In colonna, dentro una barra alta 40px, non ci starebbero.
b = el('<button class="tabw'+(on?" on":"")+'" aria-current="'+(on?"page":"false")+'">'+
navIcon(tb[1],20,(on?1.9:1.5))+
'<span class="tab-lbl">'+tb[2]+'</span></button>');
} else {
b = el('<button class="tabn'+(on?" on":"")+'" aria-current="'+(on?"page":"false")+'">'+
'<span class="tab-pill">'+navIcon(tb[1],21,(on?1.9:1.5))+'</span>'+
'<span class="tab-lbl">'+tb[2]+'</span></button>');
}
b.addEventListener("click", function(){ state.tab = key; state.screen = "menu"; homeOverride = false; clubShowAll = false; save(); forgetScroll(); render(); });
bar.appendChild(b);
});
return bar;
}

/* ── CHI TIRA, E COME SI TORNA A CAMBIARLO ──
   Dalla schermata degli arcieri si andava avanti e basta: nessun ritorno. Chi
   toccava "Continua" per sbaglio, o si accorgeva dopo di aver dimenticato
   qualcuno, non aveva nessuna strada per rimettere mano alla squadra — se non
   ricominciare da capo. E la squadra e' l'unica cosa che NON si puo' piu'
   cambiare una volta partiti, quindi e' l'ultima che dovrebbe essere
   irreversibile.
   La riga fa due cose con lo stesso pezzo di schermo: dice CHI c'e' (il dato
   che avevi appena inserito e che la schermata dopo nascondeva) e offre la
   strada per tornarci. Un ritorno che mostra anche lo stato non e' un tasto
   indietro: e' una conferma. */
function rigaArcieri(tornaA){
var arcieri = state.pendingArchers || [];
var card = el('<div class="card riga-arcieri"></div>');
var testa = el('<div class="ra-testa"></div>');
testa.appendChild(el('<h2 class="section-title">'+t("team_title")+' \u00b7 '+arcieri.length+'</h2>'));
var mod = el('<button type="button" class="btn btn-ghost btn-sm">'+t("reg_edit_btn")+'</button>');
mod.addEventListener("click", function(){
state.registrationNext = tornaA; state.screen = "registration"; save(); render();
});
testa.appendChild(mod);
card.appendChild(testa);
var nomi = el('<div class="ra-nomi"></div>');
arcieri.forEach(function(a){ nomi.appendChild(el('<span class="ra-nome">'+escapeHtml(a.name)+'</span>')); });
card.appendChild(nomi);
return card;
}

function garaSetupScreen(){
var wrap = el('<div></div>');
wrap.appendChild(rigaArcieri("gara-setup"));
var garaModes = FEDERATIONS[state.federation || "fiarc"].garaModes;
var modeKey = (state.pendingMode && garaModes.indexOf(state.pendingMode) !== -1) ? state.pendingMode : garaModes[0];
var mode = GAME_MODES[modeKey];

var modeCard = el('<div class="card"></div>');
modeCard.appendChild(el('<h2 class="section-title">'+t("gara_type_title")+'</h2>'));
var modeGrid = el('<div class="chip-group" style="flex-wrap:wrap;"></div>');
garaModes.forEach(function(key){
var c = el('<div class="chip" style="min-width:45%;">'+modeLabel(key)+'<span class="chip-sub">'+modeTag(key)+'</span></div>');
if(modeKey === key) c.classList.add("active");
c.addEventListener("click", function(){ state.pendingMode = key; save(); render(); });
modeGrid.appendChild(c);
});
modeCard.appendChild(modeGrid);

var format = mode.formats[0];
var unit = modeUnit(modeKey);
// Il tiro nullo vale per TUTTE le frecce, non solo per l'ultima: non puo' stare
// su una riga staccata in fondo. Se il barème e' identico per tutte le frecce si
// scrive una riga sola (inutile ripetere gli stessi numeri); se cambia da freccia
// a freccia si tengono le righe separate e il nullo si ripete su ognuna.
var arrowKeys = Object.keys(mode.scoring);
function zoneLineFor(s){
return mode.zones.map(function(z){ return t(z.labelKey)+" "+s[z.key]; }).join(" &middot; ") + " &middot; " + t("fuori_sagoma") + " 0";
}
var firstScoring = mode.scoring[arrowKeys[0]];
var sameForAllArrows = arrowKeys.every(function(k){
return mode.zones.every(function(z){ return mode.scoring[k][z.key] === firstScoring[z.key]; });
});
var footerParts = [];
if(sameForAllArrows){
footerParts.push(zoneLineFor(firstScoring));
} else {
arrowKeys.forEach(function(arrowNum){
var unitDisplay = (state.lang === "de") ? unit : unit.toLowerCase();
footerParts.push(t("ordinal_"+arrowNum)+" "+unitDisplay+": "+zoneLineFor(mode.scoring[arrowNum]));
});
}
var provisionalHtml = mode.provisional ? '<br><br><b style="color:var(--danger);">'+t("provisional_note")+'</b>' : '';
modeCard.appendChild(el(
'<div class="rules-panel"><div class="rp-title">'+escapeHtml(modeLabel(modeKey))+' &middot; '+format+' '+t("targets_word")+'</div>'+
modeDesc(modeKey)+'<br><br>'+footerParts.join("<br>")+provisionalHtml+'</div>'
));
wrap.appendChild(modeCard);

var startBtn = el('<button class="btn btn-primary btn-block" style="padding:16px;font-size:1.05rem;">'+t("start_gara_btn")+'</button>');
startBtn.addEventListener("click", function(){ beginRound(modeKey); });
wrap.appendChild(startBtn);


return wrap;
}

function formatDateIt(d){
var parts = String(d).split("-");
if(parts.length !== 3) return d;
return parts[2]+"/"+parts[1]+"/"+parts[0];
}

/* ══════════════════════════════════════════════════════════════════════════
   LE SOCIETA' HANNO UN PAESE, E FINORA ERA SEMPRE L'ITALIA

   L'elenco contiene 663 societa' italiane, ordinate per regione e provincia
   italiane. Il filtro che c'era separava soltanto FITARCO dal resto: quindi
   uno svedese apriva "Klubbar" e trovava il menu delle regioni italiane, con
   il Piemonte in cima. Non era una lista vuota tradotta male: era la lista
   di un altro paese, presentata come se fosse la sua.

   Il paese si legge dal dato, non da un elenco di eccezioni scritto qui: una
   societa' senza `paese` e' italiana, perche' oggi lo sono tutte. Il giorno
   che entra la prima societa' francese le basta `paese:"fr"` e compare, senza
   che nessuno debba ricordarsi di toccare questa funzione.
   ══════════════════════════════════════════════════════════════════════════ */
function compagniaPaese(cod){
var c = (typeof COMPAGNIE !== "undefined") ? COMPAGNIE[cod] : null;
return (c && c.paese) ? c.paese : "it";
}
function compagniaVisibile(cod){
if(state.country && compagniaPaese(cod) !== state.country) return false;
return compagniaFederazioneOk(cod);
}
// Quante se ne vedono in tutto: se sono zero, la schermata non deve mostrare
// nessun menu. Un menu che si apre su un elenco vuoto fa credere di aver
// sbagliato a scegliere, e si riprova.
function compagnieDelPaese(){
if(typeof COMPAGNIE === "undefined") return [];
return Object.keys(COMPAGNIE).filter(compagniaVisibile);
}

// ---------- CAMPI VICINO A TE ----------
// L'elenco completo dei campi nel database e' stato tolto: era una lista lunghissima
// e senza ordine geografico, quindi inutile. Restano due ricerche su Google Maps
// (link esterno, gratuito) e le scorciatoie utili.
function campiScreen(){
var wrap = el('<div></div>');

function apriMaps(query){
var openIt = function(coords){
var url = coords
? "https://www.google.com/maps/search/"+encodeURIComponent(query)+"/@"+coords.latitude+","+coords.longitude+",12z"
: "https://www.google.com/maps/search/"+encodeURIComponent(query);
var a = document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener";
document.body.appendChild(a); a.click(); document.body.removeChild(a);
};
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(function(pos){ openIt(pos.coords); }, function(){ openIt(null); }, { timeout:8000 });
} else { openIt(null); }
}

var locCard = el('<div class="card" style="margin-bottom:14px;"></div>');
locCard.appendChild(el('<h2 class="section-title">'+t("campi_title")+'</h2>'));

var locBtn = el('<button class="btn btn-primary btn-block">'+icon("pin",18)+' '+t("campi_btn")+'</button>');
locBtn.addEventListener("click", function(){
locBtn.innerHTML = t("campi_searching");
// La frase che finisce su Maps era scritta a mano in italiano, per tutte e
// nove le lingue: un olandese cercava "tiro con l'arco campo 3D" in Olanda.
apriMaps(t("campi_maps_query"));
setTimeout(function(){ locBtn.innerHTML = icon("pin",18)+' '+t("campi_btn"); }, 2500);
});
locCard.appendChild(locBtn);
locCard.appendChild(el('<div style="font-size:0.72rem;color:var(--muted);margin:8px 0 14px;">'+t("campi_hint")+'</div>'));

// Le due ricerche separate (campi / compagnie) davano quasi sempre gli stessi
// risultati: in Italia il campo e' della compagnia. Ne resta una sola.
wrap.appendChild(locCard);

// Scorciatoie: annunciare un allenamento e segnalare un problema.
// La scelta del campo avviene dentro i rispettivi moduli, che hanno gia' la ricerca.
if(currentUser){
var actCard = el('<div class="card"></div>');
var annBtn = el('<button class="btn btn-ghost btn-block menu-btn"><span class="menu-icon">'+icon("bow",24)+'</span><span class="menu-txt">'+t("campi_announce_btn")+'<span class="menu-sub">'+t("ot_section_hint")+'</span></span></button>');

var repBtn = el('<button class="btn btn-ghost btn-block menu-btn riga-attenzione"><span class="menu-icon">'+icon("warn",24)+'</span><span class="menu-txt">'+t("fr_report_open_btn")+'<span class="menu-sub">'+t("fr_report_sub")+'</span></span></button>');
repBtn.addEventListener("click", function(){ state.frFrom = "menu"; state.screen = "field-report"; save(); render(); });
actCard.appendChild(repBtn);
wrap.appendChild(actCard);
}

return wrap;
}

// ── Segnalazioni ricevute ────────────────────────────────────────────────
var repCard = el('<div class="card"></div>');

var repList = el('<div><div style="font-size:0.85rem;color:var(--muted);">'+t("admin_loading")+'</div></div>');

body.appendChild(repCard);

var TIPI = { target: t("fr_type_target"), stake: t("fr_type_stake"), path: t("fr_type_path"), other: t("fr_type_other") };

function caricaSegnalazioni(){
if(!db){ repList.innerHTML = ""; return; }
// Niente orderBy insieme al where: eviterebbe un indice composto. Ordino qui.
db.collection("field_reports").where("clubCode","==",codice).limit(80).get().then(function(snap){
var arr = [];
snap.forEach(function(d){ var x = d.data(); x.id = d.id; arr.push(x); });
arr.sort(function(a,b){
var ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
var tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
return tb - ta;
});
repList.innerHTML = "";
// Le risolte restano nascoste: la lista deve mostrare il lavoro da fare.
var chiuse = arr.filter(function(x){ return x.status === "closed"; });
var mostra = state.clubShowClosed ? arr : arr.filter(function(x){ return x.status !== "closed"; });
if(mostra.length === 0){
repList.appendChild(el('<div style="font-size:0.85rem;color:var(--muted);">'+t("club_reports_empty")+'</div>'));
}
mostra.forEach(function(r){
var chiuso = (r.status === "closed");
var row = el('<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;'+(chiuso?'opacity:.55;':'')+'"></div>');
var testa = el('<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px;"></div>');
testa.appendChild(el('<span style="font-size:0.72rem;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;">'+(TIPI[r.type]||TIPI.other)+(r.piazzola ? ' \u00b7 '+t("club_piazzola_word")+' '+r.piazzola : '')+'</span>'));
if(chiuso){ testa.appendChild(el('<span style="font-size:0.7rem;font-weight:700;color:var(--accent-soft);">'+t("club_report_resolved")+'</span>')); }
row.appendChild(testa);
row.appendChild(el('<div style="font-size:0.9rem;line-height:1.35;">'+escapeHtml(r.description||"")+'</div>'));
row.appendChild(el('<div style="font-size:0.72rem;color:var(--muted);margin-top:4px;">'+t("club_report_by",{name:escapeHtml(r.reporterName||"?")})+'</div>'));
if(!chiuso){
var okBtn = el('<button class="btn btn-ghost btn-sm btn-block" style="margin-top:8px;">'+t("club_report_resolve")+'</button>');
okBtn.addEventListener("click", function(){
okBtn.disabled = true;
db.collection("field_reports").doc(r.id).update({ status:"closed" })
.then(caricaSegnalazioni)
.catch(function(){ okBtn.disabled = false; });
});
row.appendChild(okBtn);
}
repList.appendChild(row);
});

// ── Pulizia: le segnalazioni risolte non servono piu' a nessuno ───────────
if(chiuse.length){
var toggleBtn = el('<button class="btn btn-ghost btn-block btn-sm" style="margin-top:10px;">'+t(state.clubShowClosed ? "club_reports_hide_closed" : "club_reports_show_closed")+' ('+chiuse.length+')</button>');
toggleBtn.addEventListener("click", function(){ state.clubShowClosed = !state.clubShowClosed; save(); caricaSegnalazioni(); });
repList.appendChild(toggleBtn);

var pulisciBtn = el('<button class="btn btn-ghost btn-block btn-sm" style="margin-top:8px;color:var(--danger);border-color:var(--danger);">'+t("club_reports_clear")+' ('+chiuse.length+')</button>');
repList.appendChild(pulisciBtn);
armDoubleConfirm(pulisciBtn, t("club_reports_clear_confirm"), function(){
var batch = db.batch();
chiuse.forEach(function(x){ batch.delete(db.collection("field_reports").doc(x.id)); });
batch.commit().then(caricaSegnalazioni).catch(function(e){
repList.appendChild(el('<div style="font-size:0.82rem;color:var(--danger);margin-top:6px;">'+escapeHtml(e && e.message ? e.message : "Errore")+'</div>'));
});
});
}
}).catch(function(err){
repList.innerHTML = '<div style="font-size:0.85rem;color:var(--danger);">'+escapeHtml(err && err.message ? err.message : "Errore")+'</div>';
});
}
caricaSegnalazioni();
});

backBtn.addEventListener("click", function(){ state.screen = "menu"; state.tab = "profilo"; save(); render(); });

return wrap;
}

// ── Elenco utenti: stato della vista ──────────────────────────────────

var ADM_FED_LABEL = {};
try{ PROFILE_FEDERATIONS.forEach(function(f){ ADM_FED_LABEL[f.code] = f.label; }); }catch(e){}

function admIniz(n){
n = String(n || "").trim();
if(!n) return "?";
var p = n.split(/\s+/);
return (p[0].charAt(0) + (p[1] ? p[1].charAt(0) : "")).toUpperCase();
}
function admSi(txt){ return '<span class="adm-si">'+txt+'</span>'; }
function admNo(txt){ return '<span class="adm-no">'+txt+'</span>'; }
function admNd(txt){ return '<span class="adm-nd">'+txt+'</span>'; }
function admBool(v, siTxt, noTxt){
if(v === true)  return admSi(siTxt || "S\u00ec");
if(v === false) return admNo(noTxt || "No");
return admNd("Non registrato");
}
function admDl(coppie){
var h = '<div class="adm-dl">';
coppie.forEach(function(c){ h += '<div class="k">'+c[0]+'</div><div class="v">'+c[1]+'</div>'; });
return h + '</div>';
}
// createdAt esiste solo per chi si e' iscritto da quando lo scriviamo: sui
// vecchi account non c'e' e non si recupera dal telefono, sta in Auth.
function admData(ts){
if(!ts) return admNd("Non registrata");
var dt = null;
try{ dt = ts.toDate ? ts.toDate() : (ts.seconds ? new Date(ts.seconds*1000) : new Date(ts)); }catch(e){ return admNd("?"); }
if(!dt || isNaN(dt.getTime())) return admNd("?");
return ("0"+dt.getDate()).slice(-2)+"/"+("0"+(dt.getMonth()+1)).slice(-2)+"/"+dt.getFullYear();
}
function admFed(list){
if(!list || !list.length) return admNd("Nessuna");
return list.map(function(f){
f = f || {};
var lab = ADM_FED_LABEL[f.code] || String(f.code || "?").toUpperCase();
return escapeHtml(lab) + (f.tessera
? ' <span style="color:var(--muted);">tessera '+escapeHtml(String(f.tessera))+'</span>'
: ' ' + admNd("senza tessera"));
}).join("<br>");
}

// public_profiles non hanno il documento e sparirebbero dall'elenco arcieri
// finche' non riaprono l'app. Va lanciato PRIMA di togliere allow list da
// users nelle regole. Resta poi a disposizione come pulizia.
// Testo in italiano e non con t(): lo vede solo l'admin, tradurlo in nove
// lingue non avrebbe senso.
var ppCard = el('<div class="card" style="margin-top:14px;"></div>');
ppCard.appendChild(el('<h2 class="section-title">Profili pubblici</h2>'));
ppCard.appendChild(el('<div style="font-size:0.8rem;color:var(--muted);margin-bottom:10px;line-height:1.5;">Ricostruisce public_profiles a partire dagli utenti approvati. Da lanciare al passaggio alle nuove regole, poi solo se qualcuno non compare nell\'elenco arcieri.</div>'));
var ppStatus = el('<div style="font-size:0.85rem;min-height:20px;margin-bottom:8px;"></div>');
var ppBtn = el('<button class="btn btn-ghost btn-block btn-sm">Allinea profili pubblici</button>');
ppBtn.addEventListener("click", function(){
ppBtn.disabled = true;
ppStatus.style.color = "var(--muted)";
ppStatus.textContent = "Lettura utenti\u2026";
db.collection("users").get().then(function(snap){
var creati = 0, tolti = 0, saltati = 0;
var batch = db.batch(), inBatch = 0;
var commits = [];
snap.forEach(function(doc){
var d = doc.data() || {};
var ref = db.collection("public_profiles").doc(doc.id);
if(d.approved === true && d.username){
batch.set(ref, publicProfileData(d), { merge:true });
creati++;
} else if(d.approved === true && !d.username){
saltati++;
return;
} else {
// Non approvato: se un documento pubblico esiste va tolto. delete su un
// documento inesistente non da' errore, quindi si puo' fare alla cieca.
batch.delete(ref);
tolti++;
}
inBatch++;
if(inBatch >= 400){ commits.push(batch.commit()); batch = db.batch(); inBatch = 0; }
});
if(inBatch > 0) commits.push(batch.commit());
ppStatus.textContent = "Scrittura\u2026";
return Promise.all(commits).then(function(){
publicProfilesCache = null; archersDirectory = null;
ppStatus.style.color = "var(--accent-soft)";
ppStatus.textContent = "Fatto: " + creati + " pubblicati, " + tolti + " rimossi" + (saltati ? (", " + saltati + " senza nome utente saltati") : "") + ".";
ppBtn.disabled = false;
});
}).catch(function(e){
ppStatus.style.color = "var(--danger)";
ppStatus.textContent = (e && e.message) ? e.message : "Errore";
ppBtn.disabled = false;
});
});

function erFmt(d){
var when = d.at ? new Date(d.at) : null;
var data = when ? (("0"+when.getDate()).slice(-2)+"/"+("0"+(when.getMonth()+1)).slice(-2)+" "+("0"+when.getHours()).slice(-2)+":"+("0"+when.getMinutes()).slice(-2)) : "?";
var box = el('<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;"></div>');
box.appendChild(el('<div style="font-weight:700;color:var(--danger);word-break:break-word;">'+escapeHtml(d.msg || "?")+'</div>'));
box.appendChild(el('<div style="color:var(--muted);">'+escapeHtml(data+" \u00b7 "+(d.dove||"?")+" \u00b7 schermata "+(d.screen||"?")+" \u00b7 "+(d.build||"?"))+'</div>'));
if(d.extra) box.appendChild(el('<div style="color:var(--muted);word-break:break-all;">'+escapeHtml(String(d.extra))+'</div>'));
if(d.stack){
var det = el('<details style="margin-top:4px;"><summary style="cursor:pointer;color:var(--muted);">dettaglio</summary></details>');
det.appendChild(el('<div style="white-space:pre-wrap;word-break:break-all;color:var(--muted);font-size:0.72rem;margin-top:4px;">'+escapeHtml(String(d.stack))+'</div>'));
box.appendChild(det);
}
if(d.ua) box.appendChild(el('<div style="color:var(--muted);font-size:0.7rem;margin-top:4px;word-break:break-all;">'+escapeHtml(String(d.ua))+'</div>'));
return box;
}

/* ══════════════════════════════════════════════════════════════════════════
   QUATTRO NUMERI, E DOVE NON VANNO

   Le decisioni di queste note sono argomentate bene, e queste note sono
   scritte abbastanza bene da far sembrare un argomento una prova. Il ridisegno
   per regioni e' stato provato a banco: il banco pero' misura lo STATO, non la
   percezione. Serviva qualcosa che desse un voto sul campo.

   NON SI SPEDISCONO DA NESSUNA PARTE. Vivono in una chiave di localStorage
   loro, separata dallo stato del giro, e in fondo alla schermata Info le legge
   solo chi tiene il telefono in mano. Non passano da Firestore, non entrano
   nella sessione condivisa, non hanno un identificatore. Un numero che non
   parte non puo' essere frainteso da nessuno.

   Sono quattro perche' quattro sono le domande a cui non si sa rispondere:
     giri finiti / iniziati   il giro arriva in fondo, o si abbandona?
     annulli per giro         quanto spesso si sbaglia a segnare?
     classifiche per giro     quanto pesa quel tasto, l'unico rimasto?
     mediana fra due frecce   quanto e' veloce lo sguardo dopo il tocco?

   IL QUARTO E' CAMBIATO RISPETTO ALLE NOTE, e vale la pena scrivere perche'.
   Era "secondi mediani per piazzola". Ma il tempo di una piazzola e' quasi
   tutto tiro, cammino e attesa degli altri: l'app ci sta dentro per una
   frazione, quindi quel numero non puo' dare un voto al ridisegno. La distanza
   fra due frecce dello STESSO arciere invece e' quasi solo app. I salti oltre
   il minuto si scartano: quello non e' esitare, e' camminare.

   MEDIANA, non media: una pausa pranzo a meta' giro sposta una media e non
   sposta una mediana.
   ══════════════════════════════════════════════════════════════════════════ */
var MISURE_KEY = "arctrail3d_misure_v1";
var MISURE_MAX = 300;          // quanti intervalli si tengono: oltre non aggiungono nulla
var ultimoTocco = null;        // istante dell'ultima freccia segnata, per l'intervallo

function misureLeggi(){
try{ var raw = localStorage.getItem(MISURE_KEY); var m = raw ? JSON.parse(raw) : null; if(!m) throw 0;
m.intervalli = m.intervalli || []; return m; }
catch(e){ return { giriIniziati:0, giriFiniti:0, annulli:0, classifiche:0, intervalli:[] }; }
}
function misura(campo, quanto){
try{
var m = misureLeggi();
if(campo === "intervalli"){
m.intervalli.push(quanto);
if(m.intervalli.length > MISURE_MAX) m.intervalli = m.intervalli.slice(-MISURE_MAX);
} else {
m[campo] = (m[campo] || 0) + (quanto === undefined ? 1 : quanto);
}
localStorage.setItem(MISURE_KEY, JSON.stringify(m));
}catch(e){}
}
// L'intervallo si registra solo fra due frecce dello stesso arciere nella
// stessa piazzola: e' l'unico tratto in cui fra un tocco e l'altro non c'e'
// altro che l'app.
function misuraTocco(stessoTurno){
var ora = Date.now();
if(stessoTurno && ultimoTocco){
var d = (ora - ultimoTocco) / 1000;
if(d > 0.15 && d < 60) misura("intervalli", Math.round(d*10)/10);
}
ultimoTocco = ora;
}
function mediana(v){
if(!v.length) return null;
var a = v.slice().sort(function(x,y){ return x-y; });
var i = Math.floor(a.length/2);
return a.length % 2 ? a[i] : Math.round(((a[i-1]+a[i])/2)*10)/10;
}

function diarioScreen(){
var wrap = el('<div></div>');
var hist = loadHistory();

var mine = [];
hist.forEach(function(h, hIdx){
var res = h.results || [];
var anyMine = res.some(isMyResult);
res.forEach(function(r){
// Se in un giro nessun risultato \u00e8 riconoscibile ed \u00e8 un giro da solo,
// \u00e8 quasi certamente dell'utente: giri vecchi salvati prima di questa modifica.
if(isMyResult(r) || (!anyMine && res.length === 1)){
mine.push({ hi: hIdx, date: h.date, modeLabel: h.modeLabel, modeKey: h.modeKey, format: h.format, total: r.total, perTarget: r.perTarget||[], pos: (res.indexOf(r)+1), tot: res.length });
}
});
});

var head = el('<div class="card"></div>');


if(mine.length === 0){
head.appendChild(el('<div style="font-size:0.85rem;color:var(--muted);line-height:1.5;">'+t("diario_empty")+'</div>'));
wrap.appendChild(head);
} else {
var best = mine[0], sum = 0;
mine.forEach(function(m){ sum += m.total; if(m.total > best.total) best = m; });
var media = Math.round(sum / mine.length);
var roundsCount = mine.length;

// Il riepilogo permanente sopravvive al taglio dello storico: se conosce un record
// pi\u00f9 alto o pi\u00f9 giri di quelli ancora in memoria, vincono i suoi numeri.
var ltAll = loadLifetime();
var ltRounds = 0, ltSum = 0, ltBest = 0, ltBestLabel = "";
Object.keys(ltAll).forEach(function(k){
var e = ltAll[k];
if(!e || !e.name) return;
if(!isMyResult({ name: e.name, ownerUid: e.ownerUid || null, isSelf: e.isSelf === true })) return;
ltRounds += (e.rounds || 0);
ltSum += (e.sum || 0);
if((e.best || 0) > ltBest){ ltBest = e.best; ltBestLabel = e.modeLabel || ""; }
});
if(ltRounds > roundsCount){ roundsCount = ltRounds; }
if(ltRounds > 0 && ltSum > 0 && ltRounds >= mine.length){ media = Math.round(ltSum / ltRounds); }
var bestTotal = best.total, bestLabel = best.modeLabel || "";
if(ltBest > bestTotal){ bestTotal = ltBest; bestLabel = ltBestLabel; }

var last5 = mine.slice(0, 5), prev5 = mine.slice(5, 10);
var trend = "", trendUp = false;
if(prev5.length >= 2){
var a5 = last5.reduce(function(s,m){ return s+m.total; },0)/last5.length;
var b5 = prev5.reduce(function(s,m){ return s+m.total; },0)/prev5.length;
var d = Math.round(((a5-b5)/b5)*100);
if(d !== 0){ trend = t("diario_trend",{d:(d>0?"+":"")+d}); trendUp = (d>0); }
}

// ---------- SESSIONE CONDIVISA (sincronizzazione punteggi tra piu' telefoni) ----------
function hasInvitedArchers(){
return (state.pendingArchers||[]).some(function(a){ return !!a.invitedUid; });
}

function createSharedSession(modeKey, doubleConfirm, archers){
if(DEV_MODE || !db || !currentUser) return null;
var selfName = (state.profile && state.profile.username) || currentUser.email;
var participants = [{ uid: currentUser.uid, name: selfName }];
archers.forEach(function(a){
if(a.invitedUid){ participants.push({ uid: a.invitedUid, name: a.name }); }
});
if(participants.length < 2) return null;
var ref = db.collection("sessions").doc();
ref.set({
ownerUid: currentUser.uid,
ownerName: selfName,
federation: state.federation,
mode: modeKey,
doubleConfirm: !!doubleConfirm,
archerNames: archers.map(function(a){ return { id:a.id, name:a.name }; }),
participants: participants,
participantUids: participants.map(function(p){ return p.uid; }),
// v2: i tiri non sono piu' un elenco per arciere ma una mappa con chiave.
// Vedi sessionShotKey(). "scores" non viene piu' scritto: chi legge lo
// accetta ancora, perche' una sessione aperta prima dell'aggiornamento
// deve restare leggibile fino a che non scade.
v: 2,
shots: {},
confirms: {},
status: "active",
createdAt: firebase.firestore.FieldValue.serverTimestamp(),
updatedAt: firebase.firestore.FieldValue.serverTimestamp()
}).catch(function(){});
return ref.id;
}

// La chiave di un tiro dentro la sessione. E' un pezzo di percorso di campo
// Firestore, quindi deve essere un identificatore valido: uid() puo' cominciare
// con una cifra, e un percorso che comincia con una cifra va citato fra apici
// inversi. La "k" davanti costa un byte ed evita tutta quella classe di guai.
function sessionShotKey(archerId, sid){ return "k" + archerId + "_" + sid; }

// PERCHE' UNA MAPPA E NON PIU' UN ELENCO.
// Prima si scriveva con arrayUnion e non rimuoveva nessuno: era il buco
// dichiarato nelle note. Le due strade per tapparlo erano una transazione
// (che pero' su un percorso non funziona: senza rete non parte, ed e' proprio
// li' che si annulla) e arrayRemove con l'oggetto identico (che fallisce in
// silenzio al primo byte che non combacia — cioe' lo stesso bug di prima, ma
// invisibile). Con una mappa, togliere e' scrivere una cancellazione su una
// chiave: atomico, e messo in coda dall'SDK come qualunque altra scrittura,
// quindi l'annulla fatto sotto gli alberi parte appena c'e' campo.
// Conseguenza gratuita: la riga non viene mai riscritta, quindi la controfirma
// non puo' piu' vivere dentro di essa. Sta in "confirms", con la stessa chiave.
function syncShotToSession(archer, entry){
if(!state.sessionId || DEV_MODE || !db) return;
// sid: l'identita' della riga. Senza, l'unico modo di togliere un tiro dal
// documento e' indovinare quale sia — e "quale" e' esattamente l'informazione
// che serve quando si annulla.
if(!entry.sid) entry.sid = uid();
var update = {};
update["shots." + sessionShotKey(archer.id, entry.sid)] = {
archerId: archer.id,
sid: entry.sid,
target: state.target,
arrows: entry.arrows,
total: entry.total,
needsConfirm: !!state.doubleConfirm,
by: (currentUser && currentUser.uid) || null,
at: Date.now()
};
update.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
db.collection("sessions").doc(state.sessionId).update(update).catch(function(){});
}

// L'annulla propaga. Era il punto 1 della lista, ed era il prerequisito di
// tutto: il giorno in cui a schermo compare "l'hanno confermato", quella frase
// starebbe certificando una riga che sul telefono di chi segna non esiste piu'.
// Una firma su un documento sbagliato e' peggio di nessuna firma.
function unsyncShotFromSession(archer, entry){
if(!state.sessionId || DEV_MODE || !db) return;
// giro aperto da una versione precedente: la riga non ha identita', quindi
// non si puo' togliere quella giusta. Non si tira a indovinare.
if(!archer || !entry || !entry.sid) return;
var k = sessionShotKey(archer.id, entry.sid);
var update = {};
update["shots." + k] = firebase.firestore.FieldValue.delete();
// la firma se ne va insieme al documento che firmava: una controfirma orfana
// certificherebbe un tiro che non c'e' piu'.
update["confirms." + k] = firebase.firestore.FieldValue.delete();
update.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
db.collection("sessions").doc(state.sessionId).update(update).catch(function(){});
}

function closeSharedSession(){
stopOwnSessionListener();
if(!state.sessionId || DEV_MODE || !db) return;
db.collection("sessions").doc(state.sessionId).update({ status:"closed", updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(function(){});
}

// ── LA PASTIGLIA DELLA FIRMA: lo stato del DOCUMENTO, non della macchina ──
// Su un percorso la scheda di carta non serve a ricordare — per quello basta
// un quaderno — serve a testimoniare: gli altri guardano chi scrive, e alla
// fine si firma. Il meccanismo c'era gia' tutto (createSharedSession,
// syncShotToSession, confirmSessionShot) e sulla schermata dove si segna, cioe'
// l'unica che si guarda per due ore, non compariva da nessuna parte.
//
// La scala ha tre gradini e dice sempre il PEGGIORE, non la media: un
// documento con una riga rimasta sul telefono non e' "visto", e' "solo qui".
var firmaStato = { attiva:false, tiri:0, firme:0, inCoda:false, doppia:false };
var ownSessionUnsub = null;
var ownSessionId = null;

function startOwnSessionListener(){
if(DEV_MODE || !db || !state.sessionId) return;
if(ownSessionUnsub && ownSessionId === state.sessionId) return;
stopOwnSessionListener();
ownSessionId = state.sessionId;
// includeMetadataChanges: senza, non arriva l'unico evento che distingue
// "scritto sul telefono" da "arrivato agli altri".
ownSessionUnsub = db.collection("sessions").doc(state.sessionId)
.onSnapshot({ includeMetadataChanges:true }, function(doc){
leggiFirma(doc); dipingiFirma();
}, function(){ firmaStato.attiva = false; dipingiFirma(); });
}

function stopOwnSessionListener(){
if(ownSessionUnsub){ ownSessionUnsub(); ownSessionUnsub = null; }
ownSessionId = null;
firmaStato = { attiva:false, tiri:0, firme:0, inCoda:false, doppia:false };
}

function leggiFirma(doc){
var d = (doc && doc.exists) ? doc.data() : null;
if(!d){ firmaStato.attiva = false; firmaStato.tiri = 0; firmaStato.firme = 0; return; }
var shots = d.shots || {};
var confirms = d.confirms || {};
var tiri = 0, firme = 0;
for(var k in shots){
if(!Object.prototype.hasOwnProperty.call(shots, k)) continue;
tiri++;
var c = confirms[k];
// una firma vale solo se e' di un altro: chi segna non controfirma se stesso.
if(c && c.by && c.by !== ((shots[k] && shots[k].by) || null)) firme++;
}
firmaStato.attiva = (d.status === "active");
firmaStato.doppia = !!d.doubleConfirm;
firmaStato.tiri = tiri;
firmaStato.firme = firme;
// hasPendingWrites: la riga c'e' sul telefono ma non e' ancora salita.
firmaStato.inCoda = !!(doc.metadata && doc.metadata.hasPendingWrites);
}

// La pastiglia compare al PRIMO tiro salito, non all'apertura del giro: prima
// di allora non c'e' nessun documento di cui dire lo stato, e un'etichetta che
// non parla di niente e' l'errore gia' fatto col badge della modalita'.
function firmaVisibile(){
return !!state.sessionId && state.screen === "round" && !homeOverride
&& firmaStato.attiva && firmaStato.tiri > 0;
}

function riempiFirma(p){
var gradino, glifo, testo, titolo;
if(firmaStato.inCoda){
gradino = "solo-qui"; glifo = "soloqui";
testo = t("firma_solo_qui"); titolo = t("firma_solo_qui_nota");
// firme > 0 non e' ridondante: a documento vuoto "0 su 0" e' vero e direbbe
// "firmato" di una scheda su cui non c'e' scritto niente. Oggi non si
// vedrebbe — firmaVisibile() pretende almeno un tiro — ma una regola giusta
// solo grazie a una guardia lontana e' un bug con un timer.
} else if(firmaStato.doppia && firmaStato.firme > 0 && firmaStato.firme >= firmaStato.tiri){
gradino = "firmato"; glifo = "firma";
testo = t("firma_firmato");
titolo = t("firma_firmato_nota", { n:firmaStato.firme, tot:firmaStato.tiri });
} else if(firmaStato.doppia && firmaStato.firme > 0){
gradino = "visto"; glifo = "firma";
testo = t("firma_firmato_n", { n:firmaStato.firme, tot:firmaStato.tiri });
titolo = t("firma_firmato_nota", { n:firmaStato.firme, tot:firmaStato.tiri });
} else {
gradino = "visto"; glifo = "occhio";
testo = t("firma_lo_vedono"); titolo = t("firma_lo_vedono_nota");
}
p.className = "firma-pill " + gradino;
p.setAttribute("role", "status");
p.setAttribute("title", titolo);
p.setAttribute("aria-label", titolo);
p.innerHTML = icon(glifo, 14) + '<span class="firma-testo">' + escapeHtml(testo) + '</span>';
}

// Il ridisegno completo e' il gesto piu' costoso che l'app fa, e qui cambia una
// pastiglia: si tocca quella e basta. E' il primo pezzo, piccolo, del punto 3
// della lista — ridisegnare la sola regione che e' cambiata.
function dipingiFirma(){
var head = document.querySelector("header.top");
if(!head) return;
var n = head.querySelector(".firma-pill");
if(!firmaVisibile()){ if(n && n.parentNode) n.parentNode.removeChild(n); return; }
if(!n){
n = el('<span class="firma-pill"></span>');
var azioni = head.querySelector(".head-actions");
if(azioni) head.insertBefore(n, azioni); else head.appendChild(n);
}
riempiFirma(n);
}

var openTrainings = [];
var OT_MAX_AGE_MS = 24 * 60 * 60 * 1000; // spariscono dopo 24h dalla data/ora
var OT_WINDOW_MS = 7 * 24 * 60 * 60 * 1000; // si mostrano solo i prossimi 7 giorni

// Nome da mostrare per l'utente corrente. Prima era la variabile locale selfName,
// che pero' esiste solo dentro altre funzioni: usarla altrove faceva ReferenceError.
function myDisplayName(){
return (state.profile && (state.profile.username || state.profile.nomeCognome))
|| (currentUser && (currentUser.displayName || currentUser.email))
|| "?";
}

// Codice della compagnia di appartenenza dell'utente (o null)
function myClubCode(){
return (state.profile && state.profile.compagnia) || null;
}

function loadOpenTrainings(){
if(!db) return;
var cutoff = new Date(Date.now() - OT_MAX_AGE_MS);
db.collection("open_trainings")
.where("status","==","active")
.limit(50)
.get().then(function(snap){
var list = [];
snap.forEach(function(doc){
var d = doc.data(); d.id = doc.id;
// Rimuovi automaticamente quelli scaduti (data/ora passata)
if(d.datetime && d.datetime < Date.now() - OT_MAX_AGE_MS){
doc.ref.update({status:"closed"}).catch(function(){});
return;
}
// Finestra: solo i prossimi 7 giorni, altrimenti la lista si riempie di annunci lontani
if(d.datetime && d.datetime > Date.now() + OT_WINDOW_MS) return;
// Visibilita': "club" lo vede solo chi e' della stessa compagnia
// (l'organizzatore e gli invitati lo vedono sempre)
var myUid = currentUser && currentUser.uid;
if(isUserBlocked(d.ownerUid)) return;
var mine = d.ownerUid === myUid;
var invited = myUid && (d.invitedUids||[]).indexOf(myUid) !== -1;
if(d.visibility === "club" && !mine && !invited){
if(!myClubCode() || d.clubCode !== myClubCode()) return;
}
list.push(d);
});
// Prima quello che sta per succedere, non quello piu' lontano nel tempo
list.sort(function(a,b){ return (a.datetime||0) - (b.datetime||0); });
openTrainings = list;
render();
}).catch(function(err){ console.error("loadOpenTrainings:", err); openTrainings = []; });
}

// ── PUSH NOTIFICATIONS via Cloud Function ───────────────────────────────────
// PRIMA: il telefono scriveva da solo in notifications/{uid}/items. Chiunque
// fosse loggato poteva quindi mandare una notifica a chiunque altro, dalla
// console del browser, firmandosi con il nome di un altro.
// ADESSO: si chiama la callable "sendNotification". Il documento lo scrive il
// server con l'Admin SDK, che ignora le regole Firestore; nelle regole il
// "create" dal client e' chiuso. Il trigger onDocumentCreated gia' esistente
// scatta come prima e manda la push vera: quella parte non e' stata toccata.
//
// Il RIPIEGO sulla scrittura diretta serve solo durante la migrazione, finche'
// le nuove firestore.rules non sono applicate: se la funzione non e' ancora
// deployata le notifiche continuano ad arrivare invece di sparire in silenzio.
// Applicate le regole, il ripiego fallisce da solo e resta valida solo la
// strada del server. E' voluto: non va tolto prima, non serve toglierlo dopo.
// IL QUARTO ARGOMENTO: DOVE PORTA.
// Un avviso senza destinazione dice cos'e' successo e lascia cercare dov'e'
// successo. `dest` e' quel dove, e viaggia dentro il documento perche' e' la
// notifica stessa a doverlo sapere: la push arriva anche ad app chiusa, e al
// ritorno non c'e' nessuna conversazione in corso da cui indovinarlo.
// Le forme sono due sole e dichiarate: { k:"dm", uid } e { k:"annuncio", id }.
// Per la chat l'uid lo RISCRIVE il server con quello del chiamante: qui si
// manda per il solo ripiego, che scrive senza passare dal server.
// Finche' la funzione nuova non e' pubblicata, `dest` viene ignorato e la
// notifica arriva come prima, solo senza il tasto per andarci. Nessuno resta
// senza avviso durante il passaggio.
function sendPushViaFirestore(toUid, title, body, dest){
if(!toUid) return;
if(fns){
fns.httpsCallable("sendNotification")({ toUid: toUid, title: String(title||""), body: String(body||""), dest: dest || null })
.catch(function(err){
console.error("sendNotification:", err && err.code, err && err.message);
// Se la funzione non c'e' ancora (deploy non fatto), si ripiega.
if(err && (err.code === "functions/not-found" || err.code === "functions/internal" || err.code === "functions/unavailable")){
legacyPushWrite(toUid, title, body, dest);
}
});
} else {
legacyPushWrite(toUid, title, body, dest);
}
}

// Vecchia scrittura diretta: usata solo come ripiego (vedi sopra).
function legacyPushWrite(toUid, title, body, dest){
if(!db || !toUid) return;
var doc = {
title: title,
body: body,
read: false,
createdAt: firebase.firestore.FieldValue.serverTimestamp()
};
if(dest) doc.dest = dest;
db.collection("notifications").doc(toUid).collection("items").add(doc).catch(function(){});
}

var notificationsListenerStarted = false;
var myNotifications = [];      // ultime notifiche ricevute, per il centro notifiche
var notifUnreadCount = 0;

function notifShownIds(){
try{ return JSON.parse(localStorage.getItem("at3d_notif_shown") || "[]"); }catch(e){ return []; }
}
function markNotifShown(id){
try{
var l = notifShownIds();
if(l.indexOf(id) !== -1) return;
l.push(id);
if(l.length > 120) l = l.slice(-120);
localStorage.setItem("at3d_notif_shown", JSON.stringify(l));
}catch(e){}
}

// Vero quando le notifiche push VERE arrivano su QUESTO dispositivo (token
// registrato). In quel caso l'app non deve mostrare anche la propria copia
// locale, altrimenti se ne vedono due identiche: una la mostra il service
// worker su comando del server, l'altra la mostrerebbe qui il listener.
var pushRegisteredHere = false;

// Rinfresca in silenzio il token di questo dispositivo a ogni apertura.
// Non chiede niente all'utente: parte solo se il permesso e' gia' concesso.
// Serve a due cose: sapere che qui la push vera arriva (e quindi tacere), e
// tenere aggiornato users/{uid}.fcmToken, che il server usa per l'invio.
function refreshPushToken(){
if(!messaging || !db || !currentUser) return;
if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
if(!navigator.serviceWorker) return;
navigator.serviceWorker.getRegistration("firebase-messaging-sw.js").then(function(reg){
if(!reg) return null;
return messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
}).then(function(token){
if(!token) return;
pushRegisteredHere = true;
return db.collection("users").doc(currentUser.uid).update({ fcmToken: token }).catch(function(){});
}).catch(function(){});
}

function showLocalNotification(d){
if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
// Il server ci manda gia' la push vera su questo dispositivo: tacere.
if(pushRegisteredHere) return;
// Stessa etichetta che mette il server (l'id del documento): se la push vera
// e questa copia locale partissero tutte e due, il sistema ne mostra UNA.
// La difesa di sopra (pushRegisteredHere) vale solo per questa pagina aperta;
// il tag vale sempre, e il 17/08 si e' visto che serviva.
var opts = { body: d.body || "", icon: "/icon-192.png", badge: "/icon-192.png", tag: d.id || (d.title || "at3d"), renotify: false };
if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){
navigator.serviceWorker.getRegistration().then(function(reg){
if(reg){ reg.showNotification(d.title || "ArcTrail 3D", opts); }
else { try{ new Notification(d.title || "ArcTrail 3D", opts); }catch(e){} }
}).catch(function(){
try{ new Notification(d.title || "ArcTrail 3D", opts); }catch(e){}
});
} else {
try{ new Notification(d.title || "ArcTrail 3D", opts); }catch(e){}
}
}

function startNotificationsListener(){
if(notificationsListenerStarted || !db || !currentUser) return;
notificationsListenerStarted = true;
// Niente where+orderBy insieme: Firestore chiederebbe un indice composito che
// non esiste, la query fallisce in silenzio e NESSUNA notifica arriva mai.
var ref = db.collection("notifications").doc(currentUser.uid).collection("items")
.orderBy("createdAt","desc").limit(40);
ref.onSnapshot(function(snap){
var arr = [], nuove = [];
snap.forEach(function(doc){
var d = doc.data() || {};
d.id = doc.id;
arr.push(d);
if(d.read !== true && notifShownIds().indexOf(doc.id) === -1) nuove.push(d);
});
myNotifications = arr;
var unread = arr.filter(function(x){ return x.read !== true; }).length;
// La notifica di sistema si mostra una volta sola per documento: la lettura
// resta in mano all'utente nel centro notifiche, non si azzera da sola.
nuove.forEach(function(d){ showLocalNotification(d); markNotifShown(d.id); });
if(unread !== notifUnreadCount || nuove.length){
notifUnreadCount = unread;
render();
}
}, function(err){ console.error("notifiche:", err); });
}

// Cancellazione definitiva: il listener aggiorna la lista da solo
function deleteNotifications(items){
if(!db || !currentUser || !items.length) return;
var base = db.collection("notifications").doc(currentUser.uid).collection("items");
var batch = db.batch();
items.forEach(function(x){ batch.delete(base.doc(x.id)); });
batch.commit().catch(function(e){ console.error("notif delete:", e); });
}

// Segna come lette tutte quelle ancora da leggere
function markAllNotificationsRead(cb){
if(!db || !currentUser){ if(cb) cb(); return; }
var daFare = myNotifications.filter(function(x){ return x.read !== true; });
if(!daFare.length){ if(cb) cb(); return; }
var base = db.collection("notifications").doc(currentUser.uid).collection("items");
var batch = db.batch();
daFare.forEach(function(x){ batch.update(base.doc(x.id), { read:true }); });
batch.commit().then(function(){ if(cb) cb(); }).catch(function(e){ console.error("notif read:", e); if(cb) cb(); });
}

// ── BLOCCO UTENTI, SEGNALAZIONI, ELIMINAZIONE ACCOUNT ───────────────────
// Requisiti di Google Play per le app con contenuti scritti dagli utenti: si
// deve poter bloccare una persona, segnalare un contenuto e cancellare il
// proprio account dall'app.
// I bloccati stanno in users/{uid}.blockedUsers come mappa uid->nome: le regole
// permettono a ognuno di scrivere il proprio documento, e la mappa evita la
// trappola nota di arrayRemove sugli oggetti (basta un campo diverso e non
// combacia piu'). Il filtro e' lato client: nasconde chi hai bloccato.
var blockedUsers = {};

function isUserBlocked(uid){
return !!(uid && blockedUsers && blockedUsers[uid]);
}

function setUserBlocked(uid, name, blocca, cb){
if(!db || !currentUser || !uid){ if(cb) cb(new Error("no-db")); return; }
var patch = {};
patch["blockedUsers."+uid] = blocca ? (name || "?") : firebase.firestore.FieldValue.delete();
db.collection("users").doc(currentUser.uid).update(patch).then(function(){
if(blocca){ blockedUsers[uid] = (name || "?"); } else { delete blockedUsers[uid]; }
archersDirectory = null;   // l'elenco arcieri e' in cache: va rifatto
if(cb) cb(null);
}).catch(function(e){ console.error("blocco utente:", e); if(cb) cb(e); });
}
