# GitHub Pages — cosa NON si pubblica. (19/09/2026, audit H5/H6.)
#
# Questo repository E' il sito: GitHub Pages pubblicava tutto quello che ci sta
# dentro, compresi i diari interni (con l'elenco dei difetti ancora aperti),
# i banchi, gli script, le regole di Firestore e, in `archive/`, una copia
# dell'app del 31/07 collegata al Firebase di produzione.
#
# Pages costruisce il sito con Jekyll (qui non c'e' `.nojekyll`), e Jekyll
# legge questo file: le voci di `exclude` restano nel repository — chi lavora
# le trova dove sono sempre state — ma non finiscono sul sito.
# `tests/controlla-pubblicazione.js` controlla che nessun file del sito finisca
# qui per sbaglio, e che le cartelle interne ci siano.
#
# ATTENZIONE: aggiungere `.nojekyll` alla radice spegnerebbe questo file, e
# tutto tornerebbe pubblico. Il controllo lo vieta.
#
# Non cambia niente per chi lavora: `controlla-base.js` e `pubblica.sh` leggono
# da raw.githubusercontent.com (cioe' dal repository), non dal sito.
exclude:
  - docs/
  - tests/
  - tools/
  - archive/
  - functions/
  - node_modules/
  - README.md
  - package.json
  - package-lock.json
  - firebase.json
  - firestore.rules
  - storage.rules
  - pubblica.sh
  - firestore-debug.log
  - firebase-debug.log
