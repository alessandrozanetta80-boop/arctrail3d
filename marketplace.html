/* ══ RECENSIONI: cache + calcolo media lato client (niente scritture su /users) ══ */
function getRevs(uid){
  if(revCache[uid])return Promise.resolve(revCache[uid]);
  return db.collection("market_reviews").where("targetUid","==",uid).limit(50).get().then(function(snap){
    var list=snap.docs.map(function(d){return d.data();});
    list.sort(function(a,b){return tms(b.createdAt)-tms(a.createdAt);});
    var tot=0;list.forEach(function(r){tot+=r.rating||0;});
    var res={list:list,count:list.length,avg:list.length?tot/list.length:0};
    revCache[uid]=res;return res;
  }).catch(function(){return{list:[],count:0,avg:0};});
}
function revCardHtml(r){

}

/* ══ DETTAGLIO ══ */
function openDet(id){
  var a=allAds.find(function(x){return x.id===id;});if(!a)return;
  curAd=a;detPhs=(a.photos||[]).filter(Boolean);detIdx=0;
  document.getElementById("detTB").textContent=a.title||"";
  var ph=document.getElementById("detPh");
  ph.querySelectorAll("img").forEach(function(i){i.remove();});
  var pp=document.getElementById("detPhPh");
  pp.innerHTML=IC.target;
  if(detPhs.length){
    pp.style.display="none";
    detPhs.forEach(function(url,i){var img=document.createElement("img");img.src=url;img.alt="";if(i===0)img.classList.add("on");ph.insertBefore(img,document.getElementById("detDts"));});
    document.getElementById("detNL").style.display=detPhs.length>1?"flex":"none";
    document.getElementById("detNR").style.display=detPhs.length>1?"flex":"none";
  } else {pp.style.display="flex";document.getElementById("detNL").style.display="none";document.getElementById("detNR").style.display="none";}
  rdDots();
  /* La pastiglia delle condizioni riusa le classi della scheda invece di
     riscrivere sei colori a mano dentro il JS: gli stessi valori scritti in
     due posti divergono, e qui erano gia' divergenti (rgba(29,154,140) —
     un verde-acqua che nell'app non esiste). */
  var ce=document.getElementById("detCond");
  ce.className="det-cp "+(a.type==="cerco"?"lcond cerco":"lcond "+(KC[a.condition]||"usato"));
  ce.textContent=a.type==="cerco"?t("wanted"):condLabel(a.condition);
  document.getElementById("detTit").textContent=a.title||"";
  var pe=document.getElementById("detPr");
  pe.classList.toggle("aperto",a.type==="cerco");
  pe.textContent=(a.type==="cerco")?(a.budget?t("budget_max_l",{v:euro(a.budget)}):t("budget_open")):euro(a.price);
  document.getElementById("detLoc").textContent=(a.location||"")+(a.createdAt?" · "+ago(a.createdAt):"");
  document.getElementById("detDesc").textContent=a.description||t("no_desc");
  var sp=[];
  if(a.category)sp.push([t("spec_category"),catLabel(a.category)]);
  if(a.arcoTipo)sp.push([t("spec_bow"),bowLabel(a.arcoTipo)]);
  if(a.marca)sp.push([t("spec_brand"),a.marca]);
  if(a.sgTipo)sp.push([t("spec_release"),relLabel(a.sgTipo)]);
  if(a.sgDita)sp.push([t("spec_fingers"),a.sgDita==="pollice"?t("thumb_rel"):a.sgDita]);
  if(a.sgMat)sp.push([t("spec_material"),matLabel(a.sgMat)]);
  if(a.lb)sp.push([t("spec_lb"),a.lb+" lb"]);
  if(a.draw)sp.push([t("spec_draw"),a.draw+"″"]);
  if(a.mano)sp.push([t("hand"),t(a.mano==="dx"?"hand_dx":"hand_sx")]);
  if(a.spine)sp.push([t("spec_spine"),a.spine]);

/* ══ I PREFERITI SEGUONO L'ACCOUNT ═════════════════════════════════════════
   Stavano solo in localStorage: chi cambiava telefono li perdeva, e non
   gliel'aveva detto nessuno. Adesso salgono anche su Firestore.

   IL TELEFONO RESTA LA FONTE PRIMARIA e il cloud e' una copia: si scrive
   subito in locale — quindi il cuore risponde anche senza rete, che al campo
   e' la regola — e si manda su dopo. Al rientro i due elenchi si UNISCONO,
   non si sovrascrivono: chi ha salvato qualcosa su due telefoni diversi non
   deve perdere niente, e un preferito si toglie a mano.

   E SE IL CLOUD NON RISPONDE LO DICE. Un salvataggio che fallisce in silenzio
   e' la stessa promessa vuota delle vecchie «Avvisi attivi»: qui, se le regole
   di Firestore non lasciano passare, la schermata Preferiti scrive che quei
   preferiti stanno solo su questo telefono. */
var favCloud=null;   /* null = ancora non si sa · true = sale · false = solo qui */
function favRef(){return db.collection("market_favs").doc(cu.uid);}
function loadFavs(){
  myFavs=new Set();
  try{var s=localStorage.getItem("mf_"+cu.uid);if(s)JSON.parse(s).forEach(function(id){myFavs.add(id);});}catch(e){}
  favRef().get().then(function(d){
    favCloud=true;
    var remoti=(d.exists&&d.data().ids)||[];
    var prima=myFavs.size;
    remoti.forEach(function(id){myFavs.add(id);});
    if(myFavs.size!==prima){saveFavsLocale();renderAds();}
    if(myFavs.size!==remoti.length)saveFavsCloud();
  }).catch(function(){
    favCloud=false;
    if(document.getElementById("fsFavs").classList.contains("open"))openFavs(true);
  });
}
function saveFavsLocale(){try{localStorage.setItem("mf_"+cu.uid,JSON.stringify(Array.from(myFavs)));}catch(e){}}
function saveFavsCloud(){
  if(!cu)return;
  favRef().set({ids:Array.from(myFavs),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})
    .then(function(){favCloud=true;})
    .catch(function(){favCloud=false;if(document.getElementById("fsFavs").classList.contains("open"))openFavs(true);});
}

/* ══ FOTO: upload su Firebase Storage con compressione ══ */
function compressImg(file,maxDim,quality){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
      else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      var c=document.createElement("canvas");c.width=w;c.height=h;
      var ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej(new Error(t("compress_fail")));},"image/jpeg",quality);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error(t("bad_image")));};
    img.src=url;
  });
}

/* ══ PULIZIA FOTO SU STORAGE ══
   Ogni foto non piu' usata va cancellata, altrimenti i JPEG restano nel
   bucket per sempre e si pagano. Si toccano SOLO i file nostri: le foto
   inserite come link esterno non sono nostre e vanno lasciate stare.
   Gli errori si ignorano: un file gia' sparito non deve bloccare niente. */
function isOurPhoto(u){return typeof u==="string" && (u.indexOf("firebasestorage.googleapis.com")>=0 || u.indexOf("gs://")===0);}
function delPhotos(urls){
  (urls||[]).forEach(function(u){
    if(!isOurPhoto(u))return;
    try{stg.refFromURL(u).delete().catch(function(){});}catch(e){}
  });
}

/* Salvataggio riuscito: butta le foto rimosse dall'annuncio e quelle caricate
   e poi scartate. Azzera lo stato cosi' la chiusura del modulo non ricancella. */
function reconcilePhotos(kept){
  kept=kept||[];
  var orfane=origPhs.concat(upPhs).filter(function(u){return u&&kept.indexOf(u)<0;});

}

  if(fPhs.indexOf("__uploading__")>=0){er.textContent=t("err_uploading");er.style.display="block";return;}
  if(!title){er.textContent=t("err_title");er.style.display="block";return;}
  if(type==="vendo"&&(!price||price<=0)){er.textContent=t("err_price");er.style.display="block";return;}
  var payload={type:type,title:title,category:cat,location:loc,description:desc,photos:fPhs.filter(function(p){return p&&p!=="__uploading__";}),sellerUid:cu.uid,sellerEmail:cu.email,sellerName:cu.displayName||cu.email.split("@")[0],updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  /* `status` si scrive SOLO alla nascita. Prima stava nel payload di sempre, e
     `update()` lo rimetteva a "active": correggere una parola nella descrizione
     di un arco gia' VENDUTO lo rimetteva in vendita, e ricominciavano ad
     arrivare messaggi per una cosa che non c'e' piu'. E "I miei annunci" apre
     dritto il modulo di modifica, quindi era la strada normale. */
  if(!editId)payload.status="active";
  if(type==="vendo"){payload.price=price;payload.shipping=ship;payload.accOffers=acc;payload.condition=getCond();}
  else if(budget>0)payload.budget=budget;
  var mkSel=document.getElementById("fMarca").value;
  if(mkSel==="altro")mkSel=document.getElementById("fMarcaAltro").value.trim().toUpperCase();
  if(mkSel)payload.marca=mkSel;
  if(cat==="arco"){payload.arcoTipo=document.getElementById("fArcoT").value;var lb=document.getElementById("fLb").value,drw=document.getElementById("fDrw").value;if(lb)payload.lb=parseFloat(lb);if(drw)payload.draw=parseFloat(drw);payload.mano=getMano();}
  if(cat==="frecce"){payload.frMat=getFrMat();var sp=document.getElementById("fSpi").value,qt=document.getElementById("fQty").value;if(sp)payload.spine=parseFloat(sp);if(qt)payload.qty=parseFloat(qt);}
  if(cat==="sganci"){payload.sgTipo=document.getElementById("fSgT").value;payload.sgDita=document.getElementById("fSgD").value;payload.sgMat=document.getElementById("fSgMat").value;payload.mano=getSgMano();}
  /* I CAMPI CHE NON C'ENTRANO PIU' VANNO CANCELLATI, non lasciati dov'erano.
     `update()` non tocca quello che non nomini: chi aveva pubblicato per errore
     delle frecce dentro "Archi" e correggeva la categoria si ritrovava un set
     di frecce che diceva ancora «HOYT · Compound · 40 lb · 28″ · destro» — e
     continuava a comparire a chi filtra per archi compound da 40 libbre.
     Un dato che sopravvive alla sua categoria non e' un residuo: e' una bugia
     con dentro dei numeri. */
  if(editId){
    ["marca","arcoTipo","lb","draw","mano","spine","qty","frMat","sgTipo","sgDita","sgMat","price","budget","shipping","accOffers","condition"]
      .forEach(function(c){if(!(c in payload))payload[c]=firebase.firestore.FieldValue.delete();});
  }
  var btn=document.getElementById("btnSave");btn.disabled=true;btn.textContent=t("saving");
  var pr;
  if(editId){pr=db.collection("market_listings").doc(editId).update(payload);}
  else{payload.createdAt=firebase.firestore.FieldValue.serverTimestamp();pr=db.collection("market_listings").add(payload);}
  pr.then(function(){reconcilePhotos(payload.photos);closeOv("ovForm");toast(t(editId?"t_updated":"t_published"));document.getElementById("sInput").value="";resetFilterUI();refreshAds();btn.disabled=false;btn.textContent=t(editId?"save_changes":"publish");})
    .catch(function(e){er.textContent=t("error_with",{code:(e.code||""),msg:e.message});er.style.display="block";btn.disabled=false;btn.textContent=t(editId?"save_changes":"publish");});
});

/* ══ RECENSIONI ══════════════════════════════════════════════════════════════
   LA PORTA MANCAVA. Il profilo del venditore mostrava media, stelle e conteggio
   di recensioni che NON c'era modo di scrivere: openRevSheet() era scritta,
   funzionante, e non la chiamava nessuno. Codice vivo senza una porta e' peggio
   di codice morto — fa sembrare fatta una funzione che non c'e', e nessuno lo
   segnala perche' da fuori sembra solo che nessuno abbia ancora recensito.

   La porta si apre dove c'e' stato davvero uno scambio: un'offerta ACCETTATA.
   Non prima. Una recensione senza trattativa e' un voto, non una
   testimonianza — ed e' la stessa asimmetria della controfirma sul percorso:
   vale perche' l'altro c'era. */
function recensisciDaChat(){
  if(!curConv||!cu)return;
  var altro=otherOf(curConv);
  if(!altro||altro===cu.uid){toast(t("rev_no_other"));return;}
  var nome=(curConv.participantNames&&curConv.participantNames[altro])||t("user_def");
  var ad=curConv.adId||null;
  var q=db.collection("market_reviews").where("fromUid","==",cu.uid);
  if(ad)q=q.where("adId","==",ad);
  q.limit(1).get().then(function(snap){
    /* Una recensione per scambio. Due voti della stessa persona sullo stesso
       annuncio non sono due testimonianze, sono la stessa detta due volte. */
    if(!snap.empty){toast(t("rev_already"));return;}
    openRevSheet(altro,nome,ad);
  }).catch(function(){ openRevSheet(altro,nome,ad); });
}

/* ══ RICERCHE SALVATE ══════════════════════════════════════════════════════
   L'interruttore diceva "Avvisi attivi" e dietro NON C'ERA NIENTE: le ricerche
   vivevano in localStorage, non passavano da Firestore, e nessuna notifica e'
   mai partita. E' l'errore di Norman nella forma peggiore, perche' la cosa
   promessa era la piu' seria che un mercatino possa promettere — "a quello ci
   penso io" — e chi ci contava perdeva l'annuncio senza sapere perche'.

   Poi ha imparato a fare una cosa vera: CONTARE I NUOVI. Ogni ricerca ricorda
   quando l'hai guardata l'ultima volta; entrando nel Marketplace la campanella
   porta il numero degli annunci arrivati da allora. Onesto — ma il conto lo
   vedi solo entrando, e chi salva una ricerca non vuole ricordarsi di
   controllare: vuole che ci pensi qualcun altro. Un mercatino che ti fa venire
   a controllare non ti ha tolto il lavoro, te l'ha solo spostato di posto.

   DAL 17/08 BUSSANO. Le ricerche ACCESE salgono su market_searches/{uid}, e
   li' le guarda la Cloud Function `avvisaRicerche` a ogni annuncio nuovo.
   Finche' vivevano solo in localStorage il server non le vedeva — quindi per
   il server non esistevano, e la funzione piu' bella del mondo avviserebbe
   nessuno.

   SALE POCO, E OGNI PEZZO HA UN MOTIVO:
   - solo le ACCESE: l'interruttore adesso significa qualcosa. Spento, la
     ricerca esce dall'elenco che sale e il server smette di guardarla. Prima
     spegneva un conteggio locale e basta.
   - in MINUSCOLO: il confronto lato server lavora in minuscolo. Mandarle gia'
     cosi' toglie il giorno in cui le due parti tagliano la stringa in modo
     diverso.
   - la LINGUA di chi le ha salvate: la notifica si scrive nella lingua di chi
     la riceve, e il server non ha altro modo di saperla. Tradurre otto lingue
     di interfaccia e poi bussare in italiano e' peggio che non tradurre:
     sembra rotta la traduzione buona.
   - il lastSeen NO: e' di questo telefono, serve al conto sulla campanella e
     non riguarda nessun altro. Il cloud non e' un posto dove mettere le cose
     "gia' che ci siamo". */
var savCloud=null;   /* null = ancora non si sa · true = sale · false = solo qui */
var pushOn=null;     /* null = non si sa · true = notifiche accese · false = spente */
function savRef(){return db.collection("market_searches").doc(cu.uid);}
document.getElementById("btnSaveS").addEventListener("click",function(){
  var q=document.getElementById("sInput").value.trim();
  if(!q){openSavSearches();return;}
  if(savedS.findIndex(function(x){return x.q===q;})>=0){toast(t("sav_already"));return;}
  savedS.push({q:q,active:true,lastSeen:Date.now()});saveSav();dipingiCampana();
  toast(t("sav_saved"));
});
/* IL TELEFONO RESTA LA FONTE PRIMARIA, come per i preferiti: si scrive subito
   in locale — quindi la campanella risponde anche senza rete — e si manda su
   dopo. Al rientro i due elenchi si UNISCONO: chi ha salvato una ricerca su un
   altro telefono non deve perderla, e una ricerca si toglie a mano. Quelle che
   arrivano da fuori nascono con lastSeen = adesso, se no direbbero "180 nuovi"
   al primo sguardo — rumore, non una notizia. */
function loadSav(){
  savedS=[];
  try{var s=localStorage.getItem("ms_"+cu.uid);if(s)savedS=JSON.parse(s);}catch(e){}
  normSav();
  savRef().get().then(function(d){
    savCloud=true;
    var remote=(d.exists&&d.data().queries)||[],ora=Date.now(),aggiunte=0;
    remote.forEach(function(q){
      if(savedS.findIndex(function(x){return String(x.q).toLowerCase()===String(q).toLowerCase();})>=0)return;
      savedS.push({q:q,active:true,lastSeen:ora});aggiunte++;
    });
    if(aggiunte){saveSavLocale();dipingiCampana();if(document.getElementById("fsSav").classList.contains("open"))openSavSearches();}
    if(queriesAccese().length!==remote.length)saveSavCloud();
  }).catch(function(){
    savCloud=false;
    if(document.getElementById("fsSav").classList.contains("open"))openSavSearches();
  });
  /* Le notifiche del telefono sono accese? Si guarda una volta sola, all'entrata.
     La risposta serve a una frase che si dice SOLO quando si sa per certo:
     accusare qualcuno di avere le notifiche spente senza saperlo e' lo stesso
     errore dell'elenco parziale dei sodalizi — una riga sbagliata detta con
     sicurezza vale meno di una riga che non c'e'. */
  db.collection("users").doc(cu.uid).get().then(function(d){
    pushOn=!!(d.exists&&d.data().fcmToken);
    if(document.getElementById("fsSav").classList.contains("open"))openSavSearches();
  }).catch(function(){pushOn=null;});
}
function queriesAccese(){
  return (savedS||[]).filter(function(s){return s.active;})
    .map(function(s){return String(s.q||"").trim().toLowerCase();})
    .filter(function(q){return !!q;});
}
function saveSavLocale(){try{localStorage.setItem("ms_"+cu.uid,JSON.stringify(savedS));}catch(e){}}
function saveSavCloud(){
  if(!cu)return;
  savRef().set({queries:queriesAccese(),lang:LANG,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})
    .then(function(){savCloud=true;})
    .catch(function(){savCloud=false;if(document.getElementById("fsSav").classList.contains("open"))openSavSearches();});
}
function saveSav(){saveSavLocale();saveSavCloud();}
/* Una ricerca salvata prima d'oggi non ha una data. Metterla a zero le farebbe
   dire "180 nuovi" al primo sguardo, che e' rumore e non una notizia: si parte
   da adesso. E' una migrazione, e si riscrive subito. */
function normSav(){
  var ora=Date.now(),cambiato=false;
  savedS=(savedS||[]).map(function(s){
    if(typeof s==="string")s={q:s,active:true};
    if(s.active===undefined){s.active=true;cambiato=true;}
    if(!s.lastSeen){s.lastSeen=ora;cambiato=true;}
    return s;
  });
  if(cambiato)saveSavLocale();
}
function matchQ(a,q){
  q=String(q||"").trim().toLowerCase();if(!q)return false;
  return (a.title||"").toLowerCase().indexOf(q)>=0
      || (a.description||"").toLowerCase().indexOf(q)>=0
      || (a.marca||"").toLowerCase().indexOf(q)>=0;
}
function nuoviPer(s){
  if(!s||!s.active)return 0;
  return allAds.filter(function(a){return matchQ(a,s.q)&&tms(a.createdAt)>s.lastSeen;}).length;
}
function dipingiCampana(){
  var b=document.getElementById("savB");if(!b)return;
  var n=(savedS||[]).reduce(function(somma,s){return somma+nuoviPer(s);},0);
  b.textContent=n>99?"99+":String(n);
  b.classList.toggle("show",n>0);
  document.getElementById("btnSaveS").setAttribute("aria-label",
    n>0?t("bell_new",{n:n}):t("sav_title"));
}
/* LE TRE RIGHE. La prima dice cosa succede. Le altre due si mostrano SOLO
   quando si sa, e ognuna e' una promessa che oggi non regge:
   - le notifiche del telefono sono spente: l'avviso non si perde, ti aspetta
     dentro l'app, e si dice dove si accendono (nel profilo dell'app, che e'
     l'unico posto dove si puo' fare);
   - l'elenco non e' salito: allora l'avviso non parte affatto, e chi ha acceso
     l'interruttore deve saperlo. E' la stessa promessa mancata dei preferiti,
     detta per le ricerche.
   Le due righe di allarme compaiono anche a elenco vuoto: sapere che le
   notifiche sono spente serve PRIMA di salvare la prima ricerca, non dopo.
   La riga 1 invece tace quando l'elenco non e' salito: prometterebbe una cosa
   che in quel momento e' falsa. */
function noteSav(){
  var n="";
  if(pushOn===false)n+='<div class="cap-note">'+esc(t("sav_note_off"))+'</div>';
  if(savCloud===false)n+='<div class="cap-note">'+esc(t("sav_local_only"))+'</div>';
  return n;
}
function openSavSearches(){
  normSav();
  var el=document.getElementById("savList");
  if(!savedS.length){
    el.innerHTML='<div class="empty"><p>'+esc(t("sav_empty_t"))+'</p><p class="empty-sub">'+esc(t("sav_empty_s"))+'</p></div>'+noteSav();
  } else {
    el.innerHTML=(savCloud===false?"":'<p class="sav-nota">'+t("sav_note")+'</p>')+noteSav()
      +savedS.map(function(s,i){
        var n=nuoviPer(s);
        var riga=s.active?(n?t("sav_new",{n:n}):esc(t("sav_none_new"))):esc(t("sav_off"));
        return'<div class="saved-card"><div class="saved-body" data-run="'+i+'" role="button" tabindex="0"><div class="saved-q">'+esc(s.q)+'</div><div class="saved-meta">'+riga+'</div></div>'
          +'<button class="tgl '+(s.active?"on":"off")+'" aria-label="'+esc(t("sav_count_al",{q:s.q}))+'" aria-pressed="'+(s.active?"true":"false")+'" onclick="tglSav('+i+')"><div class="tgl-k"></div></button>'
          +'<button class="btn-icon del" aria-label="'+esc(t("sav_del_al",{q:s.q}))+'" onclick="delSav('+i+')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></div>';
      }).join("");
    el.querySelectorAll("[data-run]").forEach(function(x){
      x.addEventListener("click",function(){eseguiSav(parseInt(x.dataset.run,10));});
    });
  }
  openFS("fsSav");
}
/* Toccare la ricerca la ESEGUE — ed e' anche il momento in cui "l'hai
   guardata", quindi il conto riparte da qui. Il numero non si azzera
   guardandolo da lontano: si azzera aprendo quello che conta. */
function eseguiSav(i){
  var s=savedS[i];if(!s)return;
  /* Cambia solo il lastSeen, che sul cloud non ci sale nemmeno: si scrive in
     locale e basta. Mandare su un elenco identico a ogni tocco e' traffico
     regalato. */
  s.lastSeen=Date.now();saveSavLocale();
  document.getElementById("sInput").value=s.q;
  resetFilterUI();
  closeFS("fsSav");setNav("navMkt");
  renderAds();
}
function tglSav(i){savedS[i].active=!savedS[i].active;saveSav();openSavSearches();dipingiCampana();}
function delSav(i){savedS.splice(i,1);saveSav();openSavSearches();dipingiCampana();toast(t("sav_deleted"));}
document.getElementById("btnCSav").addEventListener("click",function(){closeFS("fsSav");});

/* ══ MESSAGGI ══ */
var cUnsub=null,chUnsub=null;
function listenConvs(){
  if(cUnsub)cUnsub();
  cUnsub=db.collection("market_conversations").where("participants","array-contains",cu.uid).limit(100).onSnapshot(function(snap){
    var convs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    convs.sort(function(a,b){return tms(b.lastAt)-tms(a.lastAt);});
    rndConvs(convs);
    var un=convs.filter(function(c){return c.unreadBy&&c.unreadBy[cu.uid];}).length;
    var b=document.getElementById("msgB");b.textContent=un;b.classList.toggle("show",un>0);
  },function(e){console.error(e);document.getElementById("convList").innerHTML='<div class="load-err"><b>'+esc(t("err_msgs"))+'</b><code>'+esc(e.code||"")+'</code> '+esc(e.message)+'</div>';});
}
function rndConvs(convs){
  var el=document.getElementById("convList");
  if(!convs.length){el.innerHTML='<div class="empty"><p>'+esc(t("no_msg_t"))+'</p><p class="empty-sub">'+t("no_msg_s",{contact:esc(t("contact_seller"))})+'</p></div>';return;}
  el.innerHTML=convs.map(function(c){
    var other=t("user_def");
    if(c.participantNames)Object.keys(c.participantNames).forEach(function(k){if(k!==cu.uid)other=c.participantNames[k];});
    var ur=c.unreadBy&&c.unreadBy[cu.uid];
    return'<div class="conv" data-cid="'+c.id+'"><div class="conv-av">'+ini(other)+'</div><div class="conv-mid"><div class="conv-name">'+esc(other)+(ur?'<span class="udot"></span>':'')+'</div><div class="conv-sub">'+esc(c.adTitle||"")+'</div><div class="conv-last">'+esc(c.lastMsg||"")+'</div></div><div class="conv-right"><span class="conv-time">'+ago(c.lastAt)+'</span></div></div>';
  }).join("");
  el.querySelectorAll("[data-cid]").forEach(function(x){x.addEventListener("click",function(){openChat(x.dataset.cid,convs.find(function(c){return c.id===x.dataset.cid;}));});});
}
function openMsgs(){document.getElementById("fsMsgs").classList.add("open");bloccaFondo();chiudiChat();document.getElementById("convList").style.display="block";document.getElementById("msgTBT").textContent=t("messages");}
/* Chiudere la chat significa staccare l'ascoltatore, non solo nasconderla:
   restava una lettura aperta su Firestore a consumare dati e batteria fino
   alla chat successiva. Non rompeva niente, e per questo non lo notava
   nessuno. Un posto solo che lo fa, chiamato da tutti e tre i modi di uscire. */
function chiudiChat(){
  if(chUnsub){chUnsub();chUnsub=null;}
  curConv=null;curConvId=null;
  document.getElementById("chatVI").classList.remove("open");
  document.getElementById("convList").style.display="block";
  document.getElementById("msgTBT").textContent=t("messages");
  /* Da telefono la barra delle icone si toglie di mezzo mentre si scrive e
     torna appena si esce dalla conversazione: e' un segno su `body`, cosi'
     la decisione sta nel CSS e non sparsa qui dentro. */
  document.body.classList.remove("chat-aperta");
}
document.getElementById("btnCMsg").addEventListener("click",function(){
  if(document.getElementById("chatVI").classList.contains("open")){chiudiChat();return;}
  closeFS("fsMsgs");setNav("navMkt");
});
function openChat(cid,conv){
  if(!conv)return;
  curConvId=cid;curConv=conv;
  document.getElementById("convList").style.display="none";document.getElementById("chatVI").classList.add("open");
  document.body.classList.add("chat-aperta");
  var other=t("user_def");
  if(conv.participantNames)Object.keys(conv.participantNames).forEach(function(k){if(k!==cu.uid)other=conv.participantNames[k];});
  document.getElementById("msgTBT").textContent=other;
  var th=conv.adPhoto?'<img class="chat-ctx-th" src="'+esc(conv.adPhoto)+'" alt="" onerror="phFallback(this)">':'<div class="chat-ctx-th">'+IC.target+'</div>';
  document.getElementById("chatCtx").innerHTML=th+'<span class="t">'+esc(conv.adTitle||"")+'</span>'+(conv.adPrice?'<span class="p">'+euro(conv.adPrice)+'</span>':'');
  var u={};u["unreadBy."+cu.uid]=false;db.collection("market_conversations").doc(cid).update(u).catch(function(){});
  if(chUnsub){chUnsub();chUnsub=null;}
  chUnsub=db.collection("market_conversations").doc(cid).collection("messages").orderBy("createdAt","asc").limit(200).onSnapshot(function(snap){
    var body=document.getElementById("chatBody");
    body.innerHTML=snap.docs.map(function(d){
      var m=d.data(),isMe=m.senderUid===cu.uid;
      if(m.type==="offer"){
        var sl={pending:isMe?t("offer_pend_me"):t("offer_pend_them"),accepted:t("offer_acc"),rejected:t("offer_rej"),countered:t("offer_cnt")}[m.status]||"";
        return'<div class="bub-offer"><div class="bub-offer-amt">'+euro(m.amount)+'</div><div class="bub-offer-lbl">'+esc(t("offer_word"))+' · '+esc(sl)+'</div>'
          +(m.status==="accepted"?'<div class="bub-offer-btns"><button class="btn btn-ghost btn-sm f1" onclick="recensisciDaChat()">'+esc(t("rev_from_chat"))+'</button></div>':'')
          +(m.status==="pending"&&!isMe?'<div class="bub-offer-btns"><button class="btn btn-primary btn-sm f1" onclick="replyOff(\''+d.id+'\',\'accepted\')">'+esc(t("accept"))+'</button><button class="btn btn-ghost btn-sm f1" onclick="cntOff(\''+d.id+'\','+(Number(m.amount)||0)+')">'+esc(t("counter"))+'</button><button class="btn btn-dg btn-sm f1" onclick="replyOff(\''+d.id+'\',\'rejected\')">'+esc(t("reject"))+'</button></div>':'')
          +'</div>';
      }
      return'<div class="bub '+(isMe?"me":"them")+'">'+esc(m.text||"")+'</div><div class="bub-time'+(isMe?" me":"")+'">'+ago(m.createdAt)+'</div>';
    }).join("");
    body.scrollTop=body.scrollHeight;
  },function(e){console.error(e);document.getElementById("chatBody").innerHTML='<div class="load-err"><b>'+esc(t("err_chat"))+'</b><code>'+esc(e.code||"")+'</code></div>';});
}
function otherOf(conv){var o=null;if(conv&&conv.participants)o=conv.participants.find(function(u){return u!==cu.uid;});return o;}
function replyOff(mId,st){
  db.collection("market_conversations").doc(curConvId).collection("messages").doc(mId).update({status:st}).then(function(){
    var l=t(st==="accepted"?"offer_acc_t":"offer_rej_t");
    var u={lastMsg:l,lastAt:firebase.firestore.FieldValue.serverTimestamp()};
    var o=otherOf(curConv);if(o)u["unreadBy."+o]=true;
    db.collection("market_conversations").doc(curConvId).update(u);toast(l);
  }).catch(function(e){toast(t("error_short",{msg:(e.code||e.message)}));});
}
function cntOff(mId,ricevuta){
  var prezzo=(curConv&&curConv.adPrice)||0;
  openAsk({
    titolo:t("counter_title"),
    sub:(curConv&&curConv.adTitle?curConv.adTitle+" · ":"")+t("counter_sub",{v:euro(ricevuta)})+(prezzo?" · "+t("counter_price",{v:euro(prezzo)}):""),
    etichetta:t("counter_label"),
    tipo:"number",
    aiuto:t("counter_hint"),
    conferma:t("counter_send"),
    valida:function(v){return parseFloat(v)>0?"":t("offer_err_num");},
    ok:function(v){inviaContro(mId,parseFloat(v));}
  });
}
function inviaContro(mId,v){
  db.collection("market_conversations").doc(curConvId).collection("messages").doc(mId).update({status:"countered"})
    .then(function(){return db.collection("market_conversations").doc(curConvId).collection("messages").add({type:"offer",amount:v,senderUid:cu.uid,senderName:cu.displayName||cu.email.split("@")[0],status:"pending",createdAt:firebase.firestore.FieldValue.serverTimestamp()});})
    .then(function(){var u={lastMsg:t("counter_title")+": "+euro(v),lastAt:firebase.firestore.FieldValue.serverTimestamp()};var o=otherOf(curConv);if(o)u["unreadBy."+o]=true;db.collection("market_conversations").doc(curConvId).update(u);toast(t("counter_sent"));})
    .catch(function(e){toast(t("error_short",{msg:(e.code||e.message)}));});
}
document.getElementById("btnSnd").addEventListener("click",sndMsg);
document.getElementById("chatIn").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sndMsg();}});
document.getElementById("chatIn").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,120)+"px";});
function sndMsg(){
  var txt=document.getElementById("chatIn").value.trim();if(!txt||!curConvId)return;
  document.getElementById("chatIn").value="";document.getElementById("chatIn").style.height="auto";
  var cr=db.collection("market_conversations").doc(curConvId);
  cr.collection("messages").add({text:txt,senderUid:cu.uid,senderName:cu.displayName||cu.email.split("@")[0],createdAt:firebase.firestore.FieldValue.serverTimestamp()})
    .then(function(){var u={lastMsg:txt,lastAt:firebase.firestore.FieldValue.serverTimestamp()};var o=otherOf(curConv);if(o)u["unreadBy."+o]=true;return cr.update(u);})
    .catch(function(e){toast(t("send_failed",{msg:(e.code||e.message)}));});
}
function startChat(adId){
  var a=allAds.find(function(x){return x.id===adId;});if(!a)return;
  if(a.sellerUid===cu.uid){toast(t("its_yours"));return;}
  closeOv("ovDet");
  var cid=convIdFor(a.sellerUid,adId),cr=db.collection("market_conversations").doc(cid);
  var base=convPayload(a);base.lastAt=firebase.firestore.FieldValue.serverTimestamp();
  cr.set(base,{merge:true}).then(function(){
    setNav("navMsg");openMsgs();
    openChat(cid,Object.assign({id:cid},base,{lastMsg:""}));
  }).catch(function(e){toast(t("error_with",{code:(e.code||""),msg:e.message}));});
}

function openAS(title,items){
  var c=document.getElementById("shActC");
  c.innerHTML=(title?'<div class="a-title">'+esc(title)+'</div>':'')
    +items.map(function(item,i){return'<button class="a-opt'+(item.red?" red":"")+(item.bold?" bold":"")+'" data-ai="'+i+'">'+esc(item.l)+'</button>';}).join("")

}

/* LE QUATTRO VOCI SONO SORELLE, E ADESSO SI COMPORTANO DA SORELLE.
   Prima solo «Marketplace» chiudeva le altre: toccando Preferiti mentre erano
   aperti i Messaggi, la finestra nuova si posava SOPRA quella vecchia. Da
   fuori sembrava funzionare — la sezione giusta si vedeva — ma sotto restava
   una pila, e la freccia riportava a una schermata che nessuno aveva chiesto.
   `vaiA` chiude tutte le sorelle e poi apre quella scelta: da qualunque
   sezione, un tocco solo, e non si passa mai dal punto di partenza.
   Vale anche per il profilo del venditore e le ricerche salvate, che sono
   finestre della stessa famiglia. */
function chiudiSezioni(){
  chiudiChat();
  ["fsMyAds","fsFavs","fsMsgs","fsPro","fsSav"].forEach(function(x){
    document.getElementById(x).classList.remove("open");
  });
  bloccaFondo();
}
function vaiA(voce, apri){
  setNav(voce);
  chiudiSezioni();
  if(apri) apri();
}
document.getElementById("navMkt").addEventListener("click",function(){vaiA("navMkt");});
document.getElementById("navFav").addEventListener("click",function(){vaiA("navFav",openFavs);});
document.getElementById("navMy").addEventListener("click",function(){vaiA("navMy",openMyAds);});
document.getElementById("navMsg").addEventListener("click",function(){vaiA("navMsg",openMsgs);});
function setNav(id){document.querySelectorAll(".bnav-item").forEach(function(n){n.classList.toggle("on",n.id===id);});}

/* DOVE VIVE LA BARRA DELLE ICONE — e perche' si sposta invece di stare ferma.
   (notte fra il 17 e il 18/08/2026.)

   Da computer le icone stanno DENTRO la testata, da telefono sono una barra
   fissa in fondo. Finora il nodo stava sempre dentro `<header class="topbar">`
   e ci si arrangiava col CSS. Il guaio e' che la testata ha un `z-index` suo:
   un genitore posizionato con z-index fa da soffitto ai figli, quindi la barra
   poteva dichiarare quota 105 quanto voleva — restava chiusa sotto la quota
   della testata, e cioe' sotto le finestre di sezione. Da telefono era proprio
   il caso di tutti i giorni: si apriva Preferiti e le icone sparivano.

   Percio' il nodo si sposta: dentro la testata da 760px in su, figlio del
   `body` sotto. E' esattamente quello che fa l'app in `appendTabBarTo()` —
   stesso meccanismo, stessa soglia. Due file che risolvono lo stesso problema
   in due modi diversi divergono al primo ritocco. */
function sistemaBarra(){
  var bar = document.getElementById("bnav");
  if(!bar) return;
  var largo = window.matchMedia("(min-width: 760px)").matches;
  var testa = document.querySelector("header.topbar .tb-left");
  if(largo){
    if(testa && bar.previousElementSibling !== testa){ testa.parentNode.insertBefore(bar, testa.nextSibling); }
  } else if(bar.parentNode !== document.body){
    document.body.appendChild(bar);
  }
}
sistemaBarra();
window.addEventListener("resize", sistemaBarra);

/* Ultima riga del file: il testo statico prende la lingua. Sta in fondo e non
   in cima perche' prima devono esistere t() e il dizionario; e vale una volta
   sola, perche' la lingua qui dentro non si cambia. */
traduci();
document.getElementById("btnSave").textContent=t("publish");
