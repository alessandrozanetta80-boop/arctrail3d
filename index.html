  function effectiveMode(){
    var m = GAME_MODES[state.mode] || GAME_MODES.training;
    if(m.freeFormat && state.arrowsPerTargetOverride){
      var m2 = {};
      for(var k in m){ m2[k] = m[k]; }
      m2.arrowsPerTarget = state.arrowsPerTargetOverride;
      return m2;
    }
    return m;
  }

  // ---------- SESSIONE CONDIVISA (sincronizzazione punteggi tra piu' telefoni) ----------
  function hasInvitedArchers(){
    return (state.pendingArchers||[]).some(function(a){ return !!a.invitedUid; });
  }

  function createSharedSession(modeKey, doubleConfirm, archers){
    if(DEV_MODE || !db || !currentUser) return null;
    var selfName = (state.profile && state.profile.username) || currentUser.email;
    var participants = [{ uid: currentUser.uid, name: selfName }];
    archers.forEach(function(a){
      if(a.invitedUid){ participants.push({ uid: a.invitedUid, name: a.name }); }
    });
    if(participants.length < 2) return null;
    var scoresInit = {};
    archers.forEach(function(a){ scoresInit[a.id] = []; });
    var ref = db.collection("sessions").doc();
    ref.set({
      ownerUid: currentUser.uid,
      ownerName: selfName,
      federation: state.federation,
      mode: modeKey,
      doubleConfirm: !!doubleConfirm,
      archerNames: archers.map(function(a){ return { id:a.id, name:a.name }; }),
      participants: participants,
      participantUids: participants.map(function(p){ return p.uid; }),
      scores: scoresInit,
      status: "active",
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(function(){});
    return ref.id;
  }

  function syncShotToSession(archer, entry){
    if(!state.sessionId || DEV_MODE || !db) return;
    var confirmed = !state.doubleConfirm;
    var payload = { arrows: entry.arrows, total: entry.total, confirmed: confirmed, by: (currentUser && currentUser.uid) || null, at: Date.now() };
    var update = {};
    update["scores." + archer.id] = firebase.firestore.FieldValue.arrayUnion(payload);
    update.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    db.collection("sessions").doc(state.sessionId).update(update).catch(function(){});
  }

  function closeSharedSession(){
    if(!state.sessionId || DEV_MODE || !db) return;
    db.collection("sessions").doc(state.sessionId).update({ status:"closed", updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(function(){});
  }

  var incomingSessions = [];
  var sessionsListenerStarted = false;
  function startIncomingSessionsListener(){
    if(sessionsListenerStarted || DEV_MODE || !db || !currentUser) return;
    sessionsListenerStarted = true;
    db.collection("sessions")
      .where("participantUids", "array-contains", currentUser.uid)
      .where("status", "==", "active")
      .onSnapshot(function(snap){
        var list = [];
        snap.forEach(function(doc){
          var d = doc.data();
          if(d.ownerUid !== currentUser.uid){ d.id = doc.id; list.push(d); }
        });
        incomingSessions = list;
        render();
      }, function(){ /* indice Firestore mancante o permessi: ignorato in silenzio */ });
  }

  var followUnsub = null;
  function stopFollowingSession(){
    if(followUnsub){ followUnsub(); followUnsub = null; }
    state.followSessionData = null;
  }

  function confirmSessionShot(archerId, idx){
    if(!state.followSessionId || !db) return;
    var ref = db.collection("sessions").doc(state.followSessionId);
    ref.get().then(function(doc){
      if(!doc.exists) return;
      var d = doc.data();
      var arr = (d.scores && d.scores[archerId]) ? d.scores[archerId].slice() : [];
      if(arr[idx]){
        arr[idx] = Object.assign({}, arr[idx], { confirmed:true, confirmedBy: currentUser.uid });
        var update = {}; update["scores." + archerId] = arr; update.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
        ref.update(update).catch(function(){});
      }
    });
  }

  function beginRound(modeKey){
    var mode = GAME_MODES[modeKey];
    if(!mode.freeFormat){ state.arrowsPerTargetOverride = null; }
    var format = mode.freeFormat ? clamp(parseInt(state.pendingFormat,10)||14, mode.minFormat, mode.maxFormat) : mode.formats[0];
    var archers = state.pendingArchers.slice();
    var isFiarcGara = state.federation === "fiarc" && FEDERATIONS.fiarc.garaModes.indexOf(modeKey) !== -1;
    if(isFiarcGara && archers.length > 1){
      archers.sort(function(a,b){ return a.name.localeCompare(b.name, "it"); });
    }
    var scores = {};
    archers.forEach(function(a){ scores[a.id] = []; });
    state.screen = "round";
    state.mode = modeKey;
    state.format = format;
    state.archers = archers;
    state.scores = scores;
    state.target = 1;
    state.archerIndex = 0;
    state.arrowIndex = 0;
    state.pendingArrows = [];
    state.liveBattutaTypes = {};
    state.awaitingStep = null;
    state.savedToHistory = false;
    var trainKeyForFed = FEDERATIONS[state.federation || "fiarc"].trainingMode;
    if(modeKey === trainKeyForFed && hasInvitedArchers() && !DEV_MODE && db && currentUser){
      state.sessionId = createSharedSession(modeKey, !!state.doubleConfirm, archers);
    } else {
      state.sessionId = null;
    }
    save(); render();
  }

  // ---------- ROUND ----------
  function roundScreen(){
    if(state.awaitingStep === "target"){ return targetTransitionScreen(); }
    if(state.awaitingStep === "archer"){ return archerTransitionScreen(); }
    pending = null;
    zoomed = false;
    var wrap = el('<div></div>');
    var mode = effectiveMode();
    var unit = modeUnit(state.mode);
    var totalTargets = state.format;
    var pct = Math.round(((state.target-1) / totalTargets) * 100);

    wrap.appendChild(el(
      '<div class="progress-wrap"><span style="font-size:0.75rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;">'+t("targets_word").charAt(0).toUpperCase()+t("targets_word").slice(1)+' '+state.target+' / '+totalTargets+'</span>'+
      '<span style="font-size:0.75rem;color:var(--gold);">'+pct+'%</span></div>'
    ));
    wrap.appendChild(el('<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;"></div></div>'));

    // punteggio parziale live - tutti i partecipanti
    var partialCard = el('<div class="card partial-card"></div>');
    partialCard.appendChild(el('<div class="partial-title">'+t("partial_title")+'</div>'));
    var ranked = state.archers.slice().sort(function(a,b){ return totalFor(b.id) - totalFor(a.id); });
    var topTotal = ranked.length ? totalFor(ranked[0].id) : 0;
    ranked.forEach(function(a){
      var tot = totalFor(a.id);
      var isLeader = tot === topTotal && tot > 0;
      partialCard.appendChild(el(
        '<div class="partial-row'+(isLeader?" leader":"")+'"><span class="pname">'+escapeHtml(a.name)+'</span><span class="ptot">'+tot+'</span></div>'
      ));
    });
    wrap.appendChild(partialCard);

    var currentArcher = state.archers[state.archerIndex];
    state.pendingArrows = state.pendingArrows || [];

    if(mode.key === "battuta" && state.pendingArrows.length === 0 && !(state.liveBattutaTypes && state.liveBattutaTypes[state.target])){
      var pickCard = el('<div class="card target-stage"></div>');
      pickCard.appendChild(el('<div class="mode-badge">'+escapeHtml(modeLabel(state.mode))+'</div>'));
      pickCard.appendChild(el('<div class="piazzola-num">'+state.target+'</div>'));
      pickCard.appendChild(el('<div class="archer-turn">'+t("gl_which_piazzola")+'</div>'));
      var pickGrid = el('<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;"></div>');
      var pickOpts = [
        {key:"singola", label:t("gl_singola"), sub:t("gl_1_arrow"), frecce:1},
        {key:"mobile", label:t("gl_mobile"), sub:t("gl_1_arrow"), frecce:1},
        {key:"branco", label:t("gl_branco"), sub:t("gl_3_arrows_stop"), frecce:3},
        {key:"tempo", label:t("gl_tempo"), sub:t("gl_3_arrows_sum"), frecce:3}
      ];
      pickOpts.forEach(function(op){
        var b = el('<button class="btn btn-ghost btn-block menu-btn"><span class="menu-txt"><b>'+op.label+'</b><span class="menu-sub">'+op.sub+'</span></span></button>');
        b.addEventListener("click", function(){
          state.liveBattutaTypes = state.liveBattutaTypes || {};
          state.liveBattutaTypes[state.target] = { tipo: op.key, frecce: op.frecce };
          save(); render();
        });
        pickGrid.appendChild(b);
      });
      pickCard.appendChild(pickGrid);
      wrap.appendChild(pickCard);
      return wrap;
    }

    var arrowNumber = state.pendingArrows.length + 1;
    var pts = mode.scoring[arrowNumber] || mode.scoring[mode.arrowsPerTarget] || mode.scoring[1];

    var card = el('<div class="card target-stage"></div>');
    card.appendChild(el('<div class="mode-badge">'+escapeHtml(modeLabel(state.mode))+'</div>'));
    card.appendChild(el('<div class="piazzola-num">'+state.target+'</div>'));

    if(state.archers.length > 1){
      var switchRow = el('<div class="switch-row"></div>');
      state.archers.forEach(function(a, idx){
        var doneAlready = (state.scores[a.id]||[]).length >= state.target;
        var canSwitch = !doneAlready && state.pendingArrows.length === 0;
        var chip = el('<button class="btn btn-ghost btn-sm"></button>');
        chip.textContent = (doneAlready? "\u2713 " : "") + a.name;
        if(idx === state.archerIndex){
          chip.style.background = "var(--accent)"; chip.style.color = "#fff"; chip.style.borderColor = "var(--accent)";
        }
        if(!canSwitch){ chip.disabled = true; chip.style.opacity = "0.55"; }
        else {
          chip.addEventListener("click", function(){ state.archerIndex = idx; save(); render(); });
        }
        switchRow.appendChild(chip);
      });
      card.appendChild(switchRow);
    }

    card.appendChild(el('<div class="archer-turn">'+t("turn_of")+'</div>'));
    card.appendChild(el('<div class="archer-name-big display">'+escapeHtml(currentArcher.name)+'</div>'));
    var badgeExtra = state.pendingArrows.length ? t("finora",{list:state.pendingArrows.join(', ')}) : '';
    var stopNote = mode.stopAtFirstHit ? t("vale_prima") : '';
    card.appendChild(el('<div class="arrow-badge">'+unit+' '+arrowNumber+' / '+targetArrowCount(mode)+badgeExtra+stopNote+'</div>'));

    card.appendChild(el('<div class="quick-hint">'+icon("leaf",12)+' '+t("quick_hint_voice")+'</div>'));
    var quickGrid = el('<div class="quick-grid"></div>');
    mode.zones.forEach(function(z){
      var qbtn = el('<button class="btn quick-btn '+z.cls+'"><span class="quick-lbl">'+t(z.labelKey)+'</span><span class="quick-pts">'+pts[z.key]+'</span></button>');
      qbtn.addEventListener("click", function(){
        if(navigator.vibrate){ navigator.vibrate(15); }
        if(z.key === "perfect" || z.key === "superspot"){ leafBurst(qbtn); }
        registerShot(pts[z.key]);
      });
      quickGrid.appendChild(qbtn);
    });
    var zeroBtn = el('<button class="btn quick-btn zero"><span class="quick-lbl">'+t("zero_label")+'</span><span class="quick-pts">0</span></button>');
    zeroBtn.addEventListener("click", function(){
      if(navigator.vibrate){ navigator.vibrate(15); }
      registerShot(0);
    });
    quickGrid.appendChild(zeroBtn);
    var totalBtns = quickGrid.children.length;
    var centerIdx = (totalBtns - 1) / 2;
    Array.prototype.forEach.call(quickGrid.children, function(btn, idx){
      var dist = Math.abs(idx - centerIdx);
      btn.style.transform = "translateY(" + Math.round(dist * dist * 3) + "px)";
    });
    card.appendChild(quickGrid);

    card.appendChild(el('<div class="quick-hint" style="margin-top:10px;">'+t("quick_hint_target")+'</div>'));

    var board = el('<div class="board"></div>');
    var svgWrap = el('<div class="silhouette-wrap"></div>');
    svgWrap.innerHTML = targetSVG(mode);
    board.appendChild(svgWrap);
    card.appendChild(board);
    card.appendChild(el('<div style="font-size:0.72rem;color:var(--muted);margin-top:8px;">'+t("tap_impact_hint")+'</div>'));
    var legendParts = mode.zones.map(function(z){ return t(z.labelKey)+' '+pts[z.key]; });
    card.appendChild(el('<div class="legend-row">'+legendParts.join(" &middot; ")+' &middot; '+t("fuori_sagoma")+' 0</div>'));
    if(mode.provisional){
      card.appendChild(el('<div class="legend-row" style="color:var(--danger);">'+t("provisional_note")+'</div>'));
    }

    var toolbar = el('<div class="zoom-toolbar"><button class="btn btn-ghost btn-sm" id="zoomBtn">'+icon("sight",14)+' '+t("zoom_btn")+'</button></div>');
    card.appendChild(toolbar);

    var readoutHolder = el('<div id="readoutHolder"></div>');
    card.appendChild(readoutHolder);

    var strip = el('<div class="shots-strip"></div>');
    state.archers.forEach(function(a){
      var entries = state.scores[a.id];
      if(entries.length >= state.target){
        var ent = entries[state.target-1];
        strip.appendChild(el('<span class="shot-pill">'+escapeHtml(a.name)+': '+ent.total+'</span>'));
      }
    });
    if(strip.children.length){ card.appendChild(strip); }

    wrap.appendChild(card);
    wrap.appendChild(el('<div class="row"><button class="btn btn-ghost btn-block" id="undoBtn">'+t("undo_btn")+'</button></div>'));

    if(state.arrowsPerTargetOverride && mode.freeFormat){
      var skipBtn = el('<button class="btn btn-ghost btn-block" style="margin-top:10px;">'+t("skip_remaining_btn")+'</button>');
      skipBtn.addEventListener("click", finishTargetEarly);
      wrap.appendChild(skipBtn);
    }

    var standingsBtn = el('<button class="btn btn-ghost btn-block" style="margin-top:10px;">'+icon("target",16)+' '+t("check_standings_btn")+'</button>');
    standingsBtn.addEventListener("click", function(){ state.screen = "classifica-live"; save(); render(); });
    wrap.appendChild(standingsBtn);

    var interruptBtn = el('<button class="btn btn-ghost btn-block" style="margin-top:10px;">'+t("interrupt_btn")+'</button>');
    wrap.appendChild(interruptBtn);

    setTimeout(function(){
      var svgEl = svgWrap.querySelector("svg");

      svgEl.addEventListener("click", function(e){
        var pt = svgEl.createSVGPoint();
        pt.x = e.clientX; pt.y = e.clientY;
        var ctm = svgEl.getScreenCTM();
        if(!ctm) return;
        var loc = pt.matrixTransform(ctm.inverse());

        var cx = 150, cy = 150;
        var dx = loc.x - cx, dy = loc.y - cy;
        var dist = Math.sqrt(dx*dx + dy*dy);
        var radii = mode.radii, zones = mode.zones;
        var inBody = dist <= radii[radii.length-1];

        var score = 0;
        var zoneLabel = t("fuori_sagoma");
        var zoneKey = null;
        if(inBody){
          for(var zi=0; zi<radii.length; zi++){
            if(dist <= radii[zi]){ zoneKey = zones[zi].key; zoneLabel = t(zones[zi].labelKey); break; }
          }
          score = pts[zoneKey];
        }
        pending = { x: loc.x, y: loc.y, score: score, zoneLabel: zoneLabel, zoneKey: zoneKey };
        drawMarker(svgEl, loc.x, loc.y);
        showReadout();
      });

      document.getElementById("zoomBtn").addEventListener("click", function(){
        zoomed = !zoomed;
        svgWrap.classList.toggle("zoomed", zoomed);
        this.innerHTML = zoomed ? t("zoom_btn_reduce") : (icon("sight",14)+' '+t("zoom_btn"));
        if(pending){ drawMarker(svgEl, pending.x, pending.y); }
      });

      document.getElementById("undoBtn").addEventListener("click", undoLastShot);
      armDoubleConfirm(interruptBtn, t("clear_confirm"), function(){
        state.screen = "summary"; save(); render();
      });
    },0);

    function drawMarker(svgEl, x, y){
      var old = svgEl.querySelector("#impactMarker");
      if(old) old.remove();
      var ns = "http://www.w3.org/2000/svg";
      var g = document.createElementNS(ns, "g");
      g.setAttribute("id", "impactMarker");
      g.setAttribute("pointer-events", "none");
      var c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 6);
      c.setAttribute("fill", "none"); c.setAttribute("stroke", "#1d5fd1"); c.setAttribute("stroke-width", "2.6");
      var l1 = document.createElementNS(ns, "line");
      l1.setAttribute("x1", x-10); l1.setAttribute("y1", y); l1.setAttribute("x2", x+10); l1.setAttribute("y2", y);
      l1.setAttribute("stroke", "#1d5fd1"); l1.setAttribute("stroke-width", "1.8");
      var l2 = document.createElementNS(ns, "line");
      l2.setAttribute("x1", x); l2.setAttribute("y1", y-10); l2.setAttribute("x2", x); l2.setAttribute("y2", y+10);
      l2.setAttribute("stroke", "#1d5fd1"); l2.setAttribute("stroke-width", "1.8");
      g.appendChild(c); g.appendChild(l1); g.appendChild(l2);
      svgEl.appendChild(g);
    }

    function showReadout(){
      readoutHolder.innerHTML = "";
      readoutHolder.appendChild(el(
        '<div class="impact-readout">'+
          '<div class="lbl">'+t("detected_score",{unit:unit, n:arrowNumber})+'</div>'+
          '<div class="pts">'+pending.score+'</div>'+
          '<div style="font-size:0.8rem;color:var(--muted);margin-top:2px;">'+pending.zoneLabel+'</div>'+
          '<div class="impact-actions">'+
            '<button class="btn btn-ghost" id="correctBtn">'+t("correct_point_btn")+'</button>'+
            '<button class="btn btn-primary" id="confirmBtn">'+t("confirm_shot_btn")+'</button>'+
          '</div>'+
        '</div>'
      ));
      document.getElementById("correctBtn").addEventListener("click", function(){
        pending = null;
        var svgEl2 = svgWrap.querySelector("svg");
        var old = svgEl2.querySelector("#impactMarker");
        if(old) old.remove();
        readoutHolder.innerHTML = "";
      });
      document.getElementById("confirmBtn").addEventListener("click", function(){
        if(navigator.vibrate){ navigator.vibrate(15); }
        if(pending.zoneKey === "superspot"){ leafBurst(document.getElementById("confirmBtn")); }
        registerShot(pending.score);
      });
    }

    return wrap;
  }

  // ---------- TRANSIZIONE: prossimo arciere ----------
  function archerTransitionScreen(){
    var wrap = el('<div></div>');
    var justDone = state.archers[state.archerIndex];
    var entries = state.scores[justDone.id];
    var lastEnt = entries[entries.length-1];
    var next = state.archers[state.archerIndex+1];

    var card = el('<div class="card target-stage"></div>');
    card.appendChild(el('<div class="mode-badge">'+escapeHtml(modeLabel(state.mode))+'</div>'));
    card.appendChild(el('<div class="archer-turn">'+t("target_singular")+' '+state.target+' &middot; '+t("done_word")+'</div>'));
    card.appendChild(el('<div class="archer-name-big display">'+escapeHtml(justDone.name)+': '+lastEnt.total+' pt</div>'));
    wrap.appendChild(card);

    var nextBtn = el('<button class="btn btn-primary btn-block" style="padding:16px;font-size:1.05rem;">'+t("next_archer_btn",{name:escapeHtml(next.name)})+'</button>');
    nextBtn.addEventListener("click", function(){
      state.awaitingStep = null;
      state.archerIndex += 1;
      save(); render();
    });
    wrap.appendChild(nextBtn);

    var undoBtn = el('<button class="btn btn-ghost btn-block" style="margin-top:10px;">'+t("undo_btn")+'</button>');
    undoBtn.addEventListener("click", undoLastShot);
    wrap.appendChild(undoBtn);

    return wrap;
  }

  // ---------- TRANSIZIONE: prossima piazzola ----------
  function targetTransitionScreen(){
    var wrap = el('<div></div>');
    var isLast = state.target >= state.format;

    var card = el('<div class="card target-stage"></div>');
    card.appendChild(el('<div class="mode-badge">'+escapeHtml(modeLabel(state.mode))+'</div>'));
    card.appendChild(el('<div class="archer-turn">'+(isLast ? t("round_done") : t("target_done"))+'</div>'));
    card.appendChild(el('<div class="big-target-num">'+state.target+'</div>'));

    var strip = el('<div class="shots-strip"></div>');
    state.archers.forEach(function(a){
      var entries = state.scores[a.id];
      var ent = entries[state.target-1];
      if(ent){ strip.appendChild(el('<span class="shot-pill">'+escapeHtml(a.name)+': '+ent.total+'</span>')); }
    });
    card.appendChild(strip);
    wrap.appendChild(card);

    var nextBtn = el('<button class="btn btn-primary btn-block" style="padding:16px;font-size:1.08rem;">'+(isLast ? t("view_final_btn") : t("next_target_btn"))+'</button>');
    nextBtn.addEventListener("click", advanceToNextTarget);
    wrap.appendChild(nextBtn);

    var undoBtn = el('<button class="btn btn-ghost btn-block" style="margin-top:10px;">'+t("undo_btn")+'</button>');
    undoBtn.addEventListener("click", undoLastShot);
    wrap.appendChild(undoBtn);

    return wrap;
  }

  function advanceToNextTarget(){
    var mode = GAME_MODES[state.mode] || GAME_MODES.training;
    state.awaitingStep = null;
    state.archerIndex = 0;
    if(state.target < state.format){
      state.target += 1;
      // rotazione FIARC: nelle gare FIARC, il primo arciere passa in ultima posizione ad ogni piazzola
      if(state.federation === "fiarc" && FEDERATIONS.fiarc.garaModes.indexOf(mode.key) !== -1 && state.archers.length > 1){
        // rotazione FIARC corretta (Art. 3.11): l'ultimo arciere passa primo,
        // tutti gli altri scendono di una sola posizione (es. ABCD -> DABC)
        state.archers.unshift(state.archers.pop());
      }
    } else {
      state.screen = "summary";
      closeSharedSession();
    }
    save(); render();
  }

  function registerShot(score){
    var mode = effectiveMode();
    var archer = state.archers[state.archerIndex];
    state.pendingArrows = state.pendingArrows || [];
    state.pendingArrows.push(score);

    var tac = targetArrowCount(mode);
    var liveType = (mode.key === "battuta" && state.liveBattutaTypes) ? (state.liveBattutaTypes[state.target]||{}).tipo : null;
    var stopAtFirstMiss = liveType === "branco";
    var done = mode.stopAtFirstHit
      ? (score > 0 || state.pendingArrows.length >= tac)
      : stopAtFirstMiss
        ? (score === 0 || state.pendingArrows.length >= tac)
        : (state.pendingArrows.length >= tac);

    if(done){
      var total = state.pendingArrows.reduce(function(s,x){ return s+x; }, 0);
      var entry = { arrows: state.pendingArrows.slice(), total: total };
      state.scores[archer.id].push(entry);
      syncShotToSession(archer, entry);
      state.pendingArrows = [];
      state.arrowIndex = 0;
      if(state.archerIndex < state.archers.length - 1){
        state.awaitingStep = "archer";
      } else {
        state.awaitingStep = "target";
      }
    } else {
      state.arrowIndex = state.pendingArrows.length;
    }
    save(); render();
  }

  function finishTargetEarly(){
    var archer = state.archers[state.archerIndex];
    state.pendingArrows = state.pendingArrows || [];
    var total = state.pendingArrows.reduce(function(s,x){ return s+x; }, 0);
    var earlyEntry = { arrows: state.pendingArrows.slice(), total: total };
    state.scores[archer.id].push(earlyEntry);
    syncShotToSession(archer, earlyEntry);
    state.pendingArrows = [];
    state.arrowIndex = 0;
    if(state.archerIndex < state.archers.length - 1){
      state.awaitingStep = "archer";
    } else {
      state.awaitingStep = "target";
    }
    save(); render();
  }

  function undoLastShot(){
    // Frecce già segnate in questa piazzola ma non ancora completata: si toglie solo l'ultima
    if(state.pendingArrows && state.pendingArrows.length > 0){
      state.pendingArrows.pop();
      state.arrowIndex = state.pendingArrows.length;
      save(); render();
      return;
    }

    var archerIdx, targetNum;
    if(state.awaitingStep === "target" || state.awaitingStep === "archer"){
      // la piazzola per questo arciere e' appena stata completata: l'ultima freccia tirata e' la sua
      archerIdx = state.archerIndex;
      targetNum = state.target;
      state.awaitingStep = null;
    } else {
      archerIdx = state.archerIndex - 1;
      targetNum = state.target;
      if(archerIdx < 0){
        if(state.target === 1) return; // niente da annullare
        targetNum = state.target - 1;
        archerIdx = state.archers.length - 1;
      }
    }

    var archer = state.archers[archerIdx];
    var entries = state.scores[archer.id];
    if(entries.length >= targetNum){
      var lastEntry = entries.pop();
      // si toglie solo l'ultima freccia della piazzola: le altre restano gia' segnate, pronte per essere confermate di nuovo
      state.pendingArrows = lastEntry.arrows.slice(0, -1);
      state.arrowIndex = state.pendingArrows.length;
    } else {
      state.pendingArrows = [];
      state.arrowIndex = 0;
    }
    state.target = targetNum;
    state.archerIndex = archerIdx;
    save(); render();
  }

  // ---------- SUMMARY ----------
  function classificaLiveScreen(){
    var wrap = el('<div></div>');
    var mLabel = modeLabel(state.mode);
    var card = el('<div class="card"></div>');
    card.appendChild(el('<h2 class="section-title">'+t("classifica_title",{mode:escapeHtml(mLabel)})+'</h2>'));
    var ranked = state.archers.slice().sort(function(a,b){ return totalFor(b.id) - totalFor(a.id); });

    var table = el('<table class="score-table"><thead><tr><th class="name-col">'+t("th_archer")+'</th><th>'+t("th_targets")+'</th><th>'+t("th_total")+'</th></tr></thead><tbody></tbody></table>');
    var tbody = table.querySelector("tbody");
    ranked.forEach(function(a, i){
      var entries = state.scores[a.id] || [];
      var tot = totalFor(a.id);
      tbody.appendChild(el(
        '<tr class="rank-row'+(i===0?" first":"")+'"><td class="name-col">'+(i===0?"\uD83C\uDFC6 ":"")+escapeHtml(a.name)+'</td>'+
        '<td>'+entries.length+'</td><td class="total-col">'+tot+'</td></tr>'
      ));
    });
    card.appendChild(table);
    wrap.appendChild(card);

    var detailCard = el('<div class="card printable"></div>');
    detailCard.appendChild(el('<h2 class="section-title">'+t("detail_title")+'</h2>'));
    var piazzFlow = el('<div class="piazz-flow"></div>');
    for(var i=0;i<state.format;i++){
      var pCard = el('<div class="piazz-card"></div>');
      pCard.appendChild(el('<div class="piazz-card-num">'+(i+1)+'</div>'));
      var rightWrap = el('<div class="piazz-card-right"></div>');
      ranked.forEach(function(a){
        var entries = state.scores[a.id] || [];
        var ent = entries[i];
        var item = el('<div class="ring-item"></div>');
        if(ent){
          item.appendChild(el('<div class="ring-badge">'+ent.total+'</div>'));
          if(ent.arrows.length > 1){
            item.appendChild(el('<span style="font-size:0.58rem;color:var(--muted);">'+ent.arrows.join('+')+'</span>'));
          }
        } else {
          item.appendChild(el('<div class="ring-badge empty">&ndash;</div>'));
        }
        item.appendChild(el('<span class="ring-name">'+escapeHtml(a.name)+'</span>'));
        rightWrap.appendChild(item);
      });
      pCard.appendChild(rightWrap);
      piazzFlow.appendChild(pCard);
    }
    detailCard.appendChild(piazzFlow);
    wrap.appendChild(detailCard);

    var backBtn = el('<button class="btn btn-primary btn-block no-print" style="padding:16px;">'+t("back_to_shooting_btn")+'</button>');
    backBtn.addEventListener("click", function(){ state.screen = "round"; save(); render(); });
    wrap.appendChild(backBtn);

    return wrap;
  }

  function summaryScreen(){
    var wrap = el('<div></div>');
    var mLabel = modeLabel(state.mode);
    var card = el('<div class="card"></div>');
    card.appendChild(el('<h2 class="section-title">'+t("classifica_title",{mode:escapeHtml(mLabel)})+'</h2>'));
    var ranked = state.archers.slice().sort(function(a,b){ return totalFor(b.id) - totalFor(a.id); });

    if(!state.savedToHistory){
      var hist = loadHistory();
      hist.unshift({
        date: new Date().toISOString(),
        format: state.format,
        modeKey: state.mode,
        modeLabel: mLabel,
        results: ranked.map(function(a){
          var entries = state.scores[a.id] || [];
          return { name: a.name, total: totalFor(a.id), perTarget: entries.map(function(e){ return e.total; }) };
        })
      });
      if(hist.length > 20) hist.length = 20;
      saveHistoryList(hist);
      state.savedToHistory = true;
      save();
      setTimeout(celebrationBurst, 150);
    }

    var histAll = loadHistory();
    function prevTotalFor(name){
      for(var i=1;i<histAll.length;i++){
        var h = histAll[i];
        var hKey = h.modeKey || null;
        if(hKey ? hKey !== state.mode : h.modeLabel !== mLabel) continue;
        for(var j=0;j<h.results.length;j++){
          if(h.results[j].name === name) return h.results[j].total;
        }
      }
      return null;
    }

    var table = el('<table class="score-table"><thead><tr><th class="name-col">'+t("th_archer")+'</th><th>'+t("th_targets")+'</th><th>'+t("th_total")+'</th><th>'+t("th_vs_prev")+'</th></tr></thead><tbody></tbody></table>');
    var tbody = table.querySelector("tbody");
    ranked.forEach(function(a, i){
      var entries = state.scores[a.id] || [];
      var tot = totalFor(a.id);
      var prev = prevTotalFor(a.name);
      var deltaTxt = "&mdash;";
      if(prev !== null){
        var diff = tot - prev;
        var sign = diff > 0 ? "+" : "";
        var color = diff > 0 ? "var(--success)" : diff < 0 ? "var(--danger)" : "var(--muted)";
        deltaTxt = '<span style="color:'+color+';font-weight:700;">'+sign+diff+'</span>';
      }
      tbody.appendChild(el(
        '<tr class="rank-row'+(i===0?" first":"")+'"><td class="name-col">'+(i===0?"\uD83C\uDFC6 ":"")+escapeHtml(a.name)+'</td>'+
        '<td>'+entries.length+'</td><td class="total-col">'+tot+'</td><td>'+deltaTxt+'</td></tr>'
      ));
    });
    card.appendChild(table);
    wrap.appendChild(card);

    var detailCard = el('<div class="card printable"></div>');
    detailCard.appendChild(el('<h2 class="section-title">'+t("detail_title")+'</h2>'));
    var piazzFlow = el('<div class="piazz-flow"></div>');
    for(var i=0;i<state.format;i++){
      var pCard = el('<div class="piazz-card"></div>');
      pCard.appendChild(el('<div class="piazz-card-num">'+(i+1)+'</div>'));
      var rightWrap = el('<div class="piazz-card-right"></div>');
      ranked.forEach(function(a){
        var entries = state.scores[a.id] || [];
        var ent = entries[i];
        var item = el('<div class="ring-item"></div>');
        if(ent){
          item.appendChild(el('<div class="ring-badge">'+ent.total+'</div>'));
          if(ent.arrows.length > 1){
            item.appendChild(el('<span style="font-size:0.58rem;color:var(--muted);">'+ent.arrows.join('+')+'</span>'));
          }
        } else {
          item.appendChild(el('<div class="ring-badge empty">&ndash;</div>'));
        }
        item.appendChild(el('<span class="ring-name">'+escapeHtml(a.name)+'</span>'));
        rightWrap.appendChild(item);
      });
      pCard.appendChild(rightWrap);
      piazzFlow.appendChild(pCard);
    }
    detailCard.appendChild(piazzFlow);
    wrap.appendChild(detailCard);

    var newRound = el('<button class="btn btn-primary btn-block no-print" style="padding:16px;">'+t("back_to_menu_full")+'</button>');
    newRound.addEventListener("click", function(){ homeOverride = true; render(); });
    wrap.appendChild(newRound);

    var resetBtn = el('<button class="btn btn-ghost btn-block no-print" style="margin-top:10px;">'+t("reset_round_btn")+'</button>');
    wrap.appendChild(resetBtn);
    armDoubleConfirm(resetBtn, t("reset_confirm"), hardResetAll);

    var printBtn = el('<button class="btn btn-ghost btn-block no-print" style="margin-top:10px;">'+icon("printer",16)+' '+t("export_pdf_btn")+'</button>');
    printBtn.addEventListener("click", function(){
      window.print();
    });
    wrap.appendChild(printBtn);

    var shareBtn = el('<button class="btn btn-ghost btn-block no-print" style="margin-top:10px;">'+icon("share",16)+' '+t("share_btn")+'</button>');
    shareBtn.addEventListener("click", function(){
      var lines = ranked.map(function(a,i){
        var entries = state.scores[a.id] || [];
        var perTarget = entries.map(function(ent,idx){ return (idx+1)+":"+ent.total; }).join(" ");
        return (i+1)+". "+a.name+" \u2013 "+totalFor(a.id)+" pt\n   "+perTarget;
      });
      var text = t("share_header",{mode:mLabel, n:state.format})+"\n\n"+lines.join("\n\n");
      if(navigator.share){
        navigator.share({ title: "ArcTrail 3D", text: text }).catch(function(){});
      } else if(navigator.clipboard){
        navigator.clipboard.writeText(text).then(function(){
          shareBtn.innerHTML = t("copied_msg");
          setTimeout(function(){ shareBtn.innerHTML = icon("share",16)+' '+t("share_btn"); }, 2000);
        });
      }
    });
    wrap.appendChild(shareBtn);

    return wrap;
  }

  if(!DEV_MODE && 'serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
    var swReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(swReloaded) return;
      swReloaded = true;
      window.location.reload();
    });
  }
  initAuthFlow();
})();
</script>
