// ---------- ELIMINAZIONE DELL'ACCOUNT ----------
// Cancella prima i dati (finche' l'utente e' ancora autenticato: dopo la
// cancellazione dell'account le regole non lo lascerebbero piu' scrivere),
// poi il documento utente, infine l'account di autenticazione.
function deleteQueryDocs(q){
return q.get().then(function(snap){
var ps = [];
snap.forEach(function(doc){ ps.push(doc.ref.delete().catch(function(){})); });
return Promise.all(ps);
}).catch(function(){});
}

function wipeAccountData(uid){
var jobs = [];
// Giri salvati sul cloud (comprese le "lapidi" dei giri gia' cancellati)
jobs.push(deleteQueryDocs(db.collection("users").doc(uid).collection("storico").limit(400)));
// Notifiche ricevute
jobs.push(deleteQueryDocs(db.collection("notifications").doc(uid).collection("items").limit(400)));
// rate_limits/{uid} NON si cancella: lo scrive solo la Cloud Function e le
// regole sono chiuse al client, quindi la delete fallirebbe sempre. Contiene
// due soli numeri, nessun dato personale.
// Errori registrati da questo utente: portano il suo uid, quindi vanno via
// insieme all'account.
jobs.push(db.collection("errors").where("uid","==",uid).limit(200).get().then(function(snap){
var ps = [];
snap.forEach(function(doc){ ps.push(doc.ref.delete().catch(function(){})); });
return Promise.all(ps);
}).catch(function(){}));
// Chat private: prima i messaggi, poi il documento della conversazione
jobs.push(db.collection("direct_chats").where("members","array-contains",uid).limit(60).get().then(function(snap){
var ps = [];
snap.forEach(function(doc){
ps.push(deleteQueryDocs(doc.ref.collection("messages").limit(200)).then(function(){
return doc.ref.delete().catch(function(){});
}));
});
return Promise.all(ps);
}).catch(function(){}));
// Allenamenti aperti pubblicati da me
jobs.push(db.collection("open_trainings").where("ownerUid","==",uid).limit(60).get().then(function(snap){
var ps = [];
snap.forEach(function(doc){
ps.push(deleteQueryDocs(doc.ref.collection("messages").limit(200)).then(function(){
return doc.ref.delete().catch(function(){});
}));
});
return Promise.all(ps);
}).catch(function(){}));
// Allenamenti aperti ALTRUI a cui partecipo: mi tolgo dall'elenco, altrimenti
// il mio nome resta li' per sempre. Si rilegge e si riscrive l'array intero
// (arrayRemove su oggetti non combacia se un campo e' cambiato).
jobs.push(db.collection("open_trainings").where("participantUids","array-contains",uid).limit(60).get().then(function(snap){
var ps = [];
snap.forEach(function(doc){
var d = doc.data() || {};
if(d.ownerUid === uid) return; // gia' cancellato sopra
var uids = (d.participantUids||[]).filter(function(u){ return u !== uid; });
var arr  = (d.participants||[]).filter(function(p){ return p && p.uid !== uid; });
ps.push(doc.ref.update({ participantUids: uids, participants: arr, updatedAt: Date.now() }).catch(function(){}));
});
return Promise.all(ps);
}).catch(function(){}));
// Segnalazioni percorso
jobs.push(deleteQueryDocs(db.collection("field_reports").where("reporterUid","==",uid).limit(100)));
// Richieste di gestione compagnia (il campo e' richiedenteUid; gli altri due
// nomi coprono eventuali documenti vecchi)
["richiedenteUid","requesterUid","uid"].forEach(function(campo){
jobs.push(deleteQueryDocs(db.collection("compagnie_admin_requests").where(campo,"==",uid).limit(20)));
});
// Sessioni di tiro condivise che ho aperto. Le regole lasciano leggere solo
// le sessioni in cui compaio fra i partecipanti: cercare per ownerUid faceva
// rifiutare TUTTA la query (nessuna sessione veniva cancellata). Filtro qui.
jobs.push(db.collection("sessions").where("participantUids","array-contains",uid).limit(60).get().then(function(snap){
var ps = [];
snap.forEach(function(doc){
var d = doc.data() || {};
if(d.ownerUid !== uid) return;   // sessioni altrui: non sono mie da cancellare
ps.push(doc.ref.delete().catch(function(){}));
});
return Promise.all(ps);
}).catch(function(){}));
// Marketplace: annunci (il campo usato dalle regole e' sellerUid; gli altri due
// coprono eventuali annunci scritti da versioni precedenti)
["sellerUid","uid","ownerUid"].forEach(function(campo){
jobs.push(deleteQueryDocs(db.collection("market_listings").where(campo,"==",uid).limit(100)));
});
// Marketplace: trattative, prima i messaggi poi la conversazione
jobs.push(db.collection("market_conversations").where("participants","array-contains",uid).limit(60).get().then(function(snap){
var ps = [];
snap.forEach(function(doc){
ps.push(deleteQueryDocs(doc.ref.collection("messages").limit(200)).then(function(){
return doc.ref.delete().catch(function(){});
}));
});
return Promise.all(ps);
}).catch(function(){}));
// Marketplace: recensioni che HO SCRITTO io (quelle ricevute non sono mie)
jobs.push(deleteQueryDocs(db.collection("market_reviews").where("fromUid","==",uid).limit(100)));
// Marketplace: preferiti. Un solo documento, market_favs/{uid}, scritto dal
// mercatino da quando i preferiti seguono l'account invece del telefono.
// Senza questa riga restava sul cloud dopo l'eliminazione dell'account: un
// elenco di cosa uno stava cercando di comprare, cioe' esattamente il tipo di
// residuo che Google verifica. Non e' una query, e' un documento: si cancella
// per id.
jobs.push(db.collection("market_favs").doc(uid).delete().catch(function(){}));
// Marketplace: ricerche salvate, market_searches/{uid}. Stesso residuo dei
// preferiti — un elenco di cosa uno stava cercando — ma qui c'e' un motivo in
// piu': finche' il documento resta, la Cloud Function `avvisaRicerche`
// continua a scrivere notifiche per un account che non esiste piu'.
// Le tre domande di una raccolta nuova — chi la scrive, chi la legge, chi la
// porta via — vanno fatte tutte e tre lo stesso giorno.
jobs.push(db.collection("market_searches").doc(uid).delete().catch(function(){}));
// Foto degli annunci caricate su Storage in market/{uid}/
try{
if(firebase.storage){
jobs.push(firebase.storage().ref("market/"+uid).listAll().then(function(res){
return Promise.all((res.items||[]).map(function(it){ return it.delete().catch(function(){}); }));
}).catch(function(){}));
}
}catch(e){}
return Promise.all(jobs);
}

// ── CHAT DIRETTA TRA DUE ARCIERI ────────────────────────────────────────────
// direct_chats/{uidA__uidB} (uid ordinati, cosi' la coppia ha sempre un solo
// documento) con members[2], memberNames{}, ultimo messaggio e readBy{}.
// I messaggi stanno nella sottocollezione messages.
// Come sempre in questo progetto: mai where+orderBy insieme (indice composito),
// l'ordinamento si fa lato client.
var myDirectChats = [];
var dmUnreadCount = 0;
var directChatsListenerStarted = false;
var dmMsgUnsub = null;
var archersDirectory = null;

function dmChatId(a, b){ return [a, b].sort().join("__"); }
function dmMillis(ts){ return (ts && ts.toMillis) ? ts.toMillis() : 0; }

function dmOther(chat){
var meUid = currentUser ? currentUser.uid : null;
var members = chat.members || [];
var otherUid = null;
for(var i=0;i<members.length;i++){ if(members[i] !== meUid){ otherUid = members[i]; break; } }
if(!otherUid) otherUid = meUid;
return { uid: otherUid, name: (chat.memberNames && chat.memberNames[otherUid]) || "?" };
}

// UNA RICEVUTA IN VIAGGIO E' GIA' UNA RICEVUTA.
// dmMarkRead scrive readBy[me] con serverTimestamp(): finche' il server non
// risponde, la copia locale di quel campo vale `null`. Letto alla lettera,
// null vuol dire "mai letta" — quindi per un istante la conversazione appena
// aperta tornava a dirsi NON letta, e il conto sulla campanella cambiava due
// volte per ogni segno di lettura. Ogni cambio faceva un render(), ogni
// render() riattaccava l'ascoltatore dei messaggi, che riscriveva la
// ricevuta: era il giro che faceva sfarfallare la chat.
// Il campo PRESENTE ma vuoto e il campo ASSENTE non sono la stessa cosa: il
// primo e' una ricevuta partita, e conta come letta.
function dmIsUnread(chat){
if(!currentUser || !chat.lastAt) return false;
if(chat.lastSenderUid === currentUser.uid) return false;
var mappa = chat.readBy || {};
if(Object.prototype.hasOwnProperty.call(mappa, currentUser.uid) && mappa[currentUser.uid] == null) return false;
return dmMillis(chat.lastAt) > dmMillis(mappa[currentUser.uid]);
}

function startDirectChatsListener(){
if(directChatsListenerStarted || !db || !currentUser) return;
directChatsListenerStarted = true;
db.collection("direct_chats").where("members","array-contains",currentUser.uid).limit(60)
.onSnapshot(function(snap){
var arr = [];
snap.forEach(function(doc){ var d = doc.data() || {}; d.id = doc.id; arr.push(d); });
arr.sort(function(a,b){ return dmMillis(b.lastAt) - dmMillis(a.lastAt); });
myDirectChats = arr;
var n = 0;
arr.forEach(function(c){ if(dmIsUnread(c)) n++; });
var cambiato = (n !== dmUnreadCount);
dmUnreadCount = n;
// MENTRE LA CHAT E' APERTA NON SI RIDISEGNA.
// Su quella schermata il conto dei non letti non si vede: sta sulla
// campanella del menu. Ridisegnare per aggiornare un numero invisibile
// stacca e riattacca l'ascoltatore dei messaggi — ed e' il gradino su cui
// si reggeva il giro che faceva sfarfallare la chat. Tolto quello, la
// pagina che si vede resta in mano al suo ascoltatore, che e' l'unico che
// sa cosa e' cambiato davvero.
if(state.screen === "dm-chat") return;
// Non ridisegnare mentre si sta scrivendo: si perderebbe il cursore.
var att = document.activeElement;
var staScrivendo = att && (att.tagName === "INPUT" || att.tagName === "TEXTAREA");
if(cambiato || (state.screen === "messaggi" && !staScrivendo)) render();
}, function(err){ console.error("chat dirette:", err); });
}

// Elenco arcieri approvati, per scegliere con chi parlare
function loadArchersDirectory(cb){
if(archersDirectory){ cb(archersDirectory); return; }
if(!db){ cb([]); return; }
loadPublicProfiles(function(all){
var list = all.filter(function(u){
return u.uid !== (currentUser && currentUser.uid) && !isUserBlocked(u.uid);
});
list.sort(function(a,b){ return a.username.toLowerCase().localeCompare(b.username.toLowerCase()); });

// Segnalazione all'amministratore. Non si usa piu' un mailto: quello esce
// dall'app (e sui computer senza client di posta non fa proprio nulla). Si
// riusa la chat interna 1-a-1, cosi' il messaggio resta, si puo' rispondere e
// la push parte da sola. L'uid dell'admin sta in app_config/admin, scritto
// dall'app dell'admin al suo login: se non c'e' ancora, si avvisa e basta.
// Uid dell'amministratore, letto una volta sola e tenuto da parte: lo usano
// sia il pulsante di segnalazione sia la riga sotto il titolo della chat.
var adminUidCache = null;
function loadAdminUid(cb){
if(adminUidCache){ cb(adminUidCache); return; }
if(!db){ cb(null); return; }
db.collection("app_config").doc("admin").get().then(function(doc){
adminUidCache = doc.exists ? (doc.data().uid || null) : null;
cb(adminUidCache);

// Riga sotto il titolo della conversazione: dice chi c'e' davvero dall'altra
// parte, e cambia a seconda di chi guarda.
// - Utente normale nella chat di segnalazione: il nome dell'amministratore.
//   La sola scritta "Assistenza ArcTrail 3D" non dice a chi si sta scrivendo.
// - Amministratore: nome e cognome di chi scrive, letti da users/{uid} (per
//   regola li legge solo lui). Serve perche' chi ha spuntato "nascondi nome e
//   cognome" nel profilo pubblico arriverebbe col solo nome utente, e su una
//   segnalazione bisogna sapere chi e'.
function fillDmSubtitle(box, otherUid){
if(!box || !otherUid || !currentUser || !db) return;
if(currentUser.email === ADMIN_EMAIL){
db.collection("users").doc(otherUid).get().then(function(d){

}).catch(function(e){ console.error("nome mittente:", e); });
return;
}
loadAdminUid(function(adminUid){

});

// Segna letta la conversazione. Solo se il documento esiste gia': un set con
// merge su un doc mai creato lo farebbe nascere senza members, quindi fuori
// dalle regole e invisibile al listener.
// SI SCRIVE SOLO SE C'E' QUALCOSA DA SEGNARE.
// Prima scriveva a ogni apparizione dell'ascoltatore dei messaggi, anche su
// una conversazione gia' letta da un pezzo: una scrittura inutile che pero'
// faceva scattare l'ascoltatore delle conversazioni, che ridisegnava, che
// riattaccava l'ascoltatore dei messaggi, che riscriveva. Il giro si chiudeva
// e non si fermava piu'.
// Si notava SOLO dopo la risposta di qualcun altro, e per un motivo preciso:
// finche' l'ultimo messaggio era il proprio, dmIsUnread rispondeva "letta"
// senza nemmeno guardare la ricevuta, quindi il conto non cambiava mai e il
// giro non partiva. Bastava una risposta perche' partisse.
function dmMarkRead(chatId){
if(!db || !currentUser || !chatId) return;
var chat = null;
for(var i=0;i<myDirectChats.length;i++){ if(myDirectChats[i].id === chatId){ chat = myDirectChats[i]; break; } }
// Un set con merge su un documento mai creato lo farebbe nascere senza
// members: fuori dalle regole e invisibile all'ascoltatore.
if(!chat) return;
if(!dmIsUnread(chat)) return;
var patch = { readBy: {} };
patch.readBy[currentUser.uid] = firebase.firestore.FieldValue.serverTimestamp();
db.collection("direct_chats").doc(chatId).set(patch, { merge:true }).catch(function(){});
}

function deleteDirectChat(chatId, cb){
if(!db || !chatId){ if(cb) cb(); return; }
var ref = db.collection("direct_chats").doc(chatId);
ref.collection("messages").limit(300).get().then(function(snap){
if(snap.empty) return null;
var batch = db.batch();
snap.forEach(function(d){ batch.delete(d.ref); });
return batch.commit();
}).then(function(){
return ref.delete();
}).then(function(){ if(cb) cb(); }).catch(function(e){ console.error("dm delete:", e); if(cb) cb(); });
}

// ---------- DOVE PORTA UNA NOTIFICA ----------
// Una notifica che dice cos'e' successo e lascia cercare DOVE e' successo e'
// una ricevuta, non un avviso: la cosa che serviva era arrivarci. Qui il
// documento si traduce in un posto dove andare.
// Due sorgenti, in ordine di fiducia:
//   - `dest`, scritto dal server al momento dell'invio. Per una chat l'uid lo
//     mette il server e non chi manda: una notifica che potesse dichiarare
//     «apri la chat con X» scegliendo X sarebbe una porta aperta, la stessa
//     che si e' chiusa il 17/08 mettendo `fromUid` lato server.
//   - `adId`, che l'avviso delle ricerche salvate porta gia' con se'. Per
//     quello non e' servito cambiare niente: c'era gia' e non lo leggeva
//     nessuno.
function destinazioneNotifica(n){
var d = n && n.dest;
if(d && d.k === "dm" && d.uid) return { etichetta: t("notif_open_msg"), k:"dm", val:d.uid };
var adId = (d && d.k === "annuncio" && d.id) ? d.id : n.adId;
if(adId) return { etichetta: t("notif_open_ad"), k:"annuncio", val:adId };
return null;
}

// Il nome della persona non viaggia nella notifica, e va bene cosi': se
// qualcuno ci ha scritto la conversazione esiste, quindi il nome ce l'abbiamo
// gia' in casa. Il giro sui profili pubblici e' solo la rete di sicurezza.
function nomeDiChat(uid){
for(var i=0;i<myDirectChats.length;i++){
var membri = myDirectChats[i].members || [];
if(membri.indexOf(uid) !== -1) return dmOther(myDirectChats[i]).name;
}
return null;
}
function apriChatDaNotifica(uid){
var nome = nomeDiChat(uid);
if(nome){ openDirectChat(uid, nome); return; }
loadPublicProfiles(function(tutti){
var p = null;
for(var i=0;i<tutti.length;i++){ if(tutti[i].uid === uid){ p = tutti[i]; break; } }
openDirectChat(uid, p ? p.username : "?");
});
}

// L'ANNUNCIO SI CONTROLLA PRIMA DI PARTIRE, NON DOPO.
// Un annuncio venduto o tolto non c'e' piu': se si cambia pagina e poi si
// scopre, la persona si ritrova nel mercatino senza sapere perche'. Il
// controllo costa una lettura e si fa dove la persona sta guardando, cosi'
// la risposta arriva sulla riga che ha toccato.
function apriAnnuncioDaNotifica(adId, riga){
if(!db){ vaiAlMercatino(adId); return; }
db.collection("market_listings").doc(adId).get().then(function(doc){
var d = doc.exists ? (doc.data() || {}) : null;
if(!d || d.status !== "active"){
var vai = riga.querySelector(".notif-vai");
if(vai){ vai.textContent = t("notif_ad_gone"); }
riga.classList.remove("apribile");
return;
}
vaiAlMercatino(adId);
}).catch(function(){ vaiAlMercatino(adId); });
}
// La scheda torna su "Tira" prima di uscire: al ritorno dal mercatino,
// altrimenti, si ripartirebbe subito verso il mercatino, in cerchio.
function vaiAlMercatino(adId){
state.tab = "tira"; save();
window.location.href = "marketplace.html?annuncio=" + encodeURIComponent(adId);
}

var incomingSessions = [];
var dismissedSessions = {};
var sessionsListenerStarted = false;
var SESSION_MAX_AGE_MS = 8 * 60 * 60 * 1000;
function startIncomingSessionsListener(){
if(sessionsListenerStarted || DEV_MODE || !db || !currentUser) return;
sessionsListenerStarted = true;
db.collection("sessions")
.where("participantUids", "array-contains", currentUser.uid)
.where("status", "==", "active")
.onSnapshot(function(snap){
var list = [];
var now = Date.now();
snap.forEach(function(doc){
var d = doc.data();
if(d.ownerUid === currentUser.uid) return;
if(dismissedSessions[doc.id]) return;
var age = d.createdAt && d.createdAt.toMillis ? (now - d.createdAt.toMillis()) : 0;
if(age > SESSION_MAX_AGE_MS){
doc.ref.update({ status:"closed", updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(function(){});
return;
}
d.id = doc.id; list.push(d);
});
incomingSessions = list;
render();
}, function(){ /* indice Firestore mancante o permessi: ignorato in silenzio */ });
}

// La controfirma e' una scrittura su una chiave sua, non piu' una riscrittura
// dell'elenco intero. Il vecchio giro leggi-modifica-riscrivi aveva un difetto
// che nessuno aveva ancora visto perche' la funzione non si usava: due arcieri
// che controfirmano due tiri diversi nello stesso momento leggevano tutti e due
// l'elenco di prima, e chi scriveva per secondo cancellava la firma dell'altro.
function confirmSessionShot(archerId, sid){
if(!state.followSessionId || !db || !currentUser || !sid) return;
var update = {};
update["confirms." + sessionShotKey(archerId, sid)] = { by: currentUser.uid, at: Date.now() };
update.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
db.collection("sessions").doc(state.followSessionId).update(update).catch(function(){});
}

// Sessioni aperte prima dell'aggiornamento: i tiri sono ancora un elenco e la
// firma vive dentro la riga. Restano leggibili e controfirmabili finche' non
// scadono (otto ore). Da togliere quando non ne circolera' piu' nessuna.
function confirmSessionShotLegacy(archerId, idx){
if(!state.followSessionId || !db || !currentUser) return;
var ref = db.collection("sessions").doc(state.followSessionId);
ref.get().then(function(doc){
if(!doc.exists) return;
var d = doc.data();
var arr = (d.scores && d.scores[archerId]) ? d.scores[archerId].slice() : [];
if(arr[idx]){
arr[idx] = Object.assign({}, arr[idx], { confirmed:true, confirmedBy: currentUser.uid });
var update = {}; update["scores." + archerId] = arr; update.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
ref.update(update).catch(function(){});
}
});
}

// I tiri di un arciere, in ordine, da qualunque delle due forme di documento.
// Ordinati per piazzola: e' l'ordine in cui sono stati tirati ed e' l'unico che
// chi guarda sa gia'.
function sessionShots(data, archerId){
var out = [];
if(data && data.shots){
var shots = data.shots;
for(var k in shots){
if(!Object.prototype.hasOwnProperty.call(shots, k)) continue;
var s = shots[k];
if(!s || s.archerId !== archerId) continue;
out.push({ key:k, sid:s.sid || null, target:s.target || 0,
arrows:s.arrows || [], total:s.total || 0,
by:s.by || null, at:s.at || 0, legacy:false, legacyConfirmed:false });
}
out.sort(function(a,b){ return (a.target - b.target) || (a.at - b.at); });
return out;
}
var old = (data && data.scores && data.scores[archerId]) || [];
old.forEach(function(e, i){
out.push({ key:null, sid:null, idx:i, target:i + 1,
arrows:e.arrows || [], total:e.total || 0,
by:e.by || null, at:e.at || 0, legacy:true, legacyConfirmed:!!e.confirmed });
});
return out;
}

function beginRound(modeKey){
homeOverride = false; // senza questo un percorso nuovo veniva dirottato al menu
stopOwnSessionListener(); // la pastiglia non deve raccontare il giro di ieri
var mode = GAME_MODES[modeKey];
if(!mode.freeFormat){ state.arrowsPerTargetOverride = null; }
var format = mode.freeFormat ? clamp(parseInt(state.pendingFormat,10)||14, mode.minFormat, mode.maxFormat) : mode.formats[0];
var archers = state.pendingArchers.slice();
var isFiarcGara = state.federation === "fiarc" && FEDERATIONS.fiarc.garaModes.indexOf(modeKey) !== -1;
if(isFiarcGara && archers.length > 1){
archers.sort(function(a,b){ return a.name.localeCompare(b.name, state.lang || "it"); });
}
var scores = {};
archers.forEach(function(a){ scores[a.id] = []; });
state.roundActive = true;
misura("giriIniziati"); ultimoTocco = null;
state.archersBase = archers.slice(); // ordine della prima piazzola: da qui si ricava quello di tutte le altre
state.rotBaseTarget = 1;
state.screen = "round";
state.mode = modeKey;
state.format = format;
state.archers = archers;
state.scores = scores;
state.target = 1;
state.archerIndex = 0;
state.arrowIndex = 0;
state.pendingArrows = [];
state.liveBattutaTypes = {};
state.awaitingStep = null;
state.savedToHistory = false;
state.roundEntryDate = null;
// la scheda di ieri non firma quella di oggi
state.firme = {};
state.consegna = null;
state.panel = null;
state.lastShotInfo = null;
var trainKeyForFed = FEDERATIONS[state.federation || "fiarc"].trainingMode;
if(modeKey === trainKeyForFed && hasInvitedArchers() && !DEV_MODE && db && currentUser){
state.sessionId = createSharedSession(modeKey, !!state.doubleConfirm, archers);
} else {
state.sessionId = null;
}
save(); render();
}

function roundScreen(){
// L'unica sosta a tutto schermo che resta e' la fine del giro: le 95
// interruzioni per "tocca al prossimo" sono state sostituite dalla fila dei
// turni dentro la scena, che dice la stessa cosa senza fermare nessuno.
if(state.awaitingStep === "target"){ return targetTransitionScreen(); }
// Chi aveva un giro in corso salvato dalla versione precedente arriva qui con
// una sosta "archer" che non esiste piu': la si consuma facendo quello che
// faceva il tasto della vecchia schermata, cioe' passare all'arciere dopo.
if(state.awaitingStep === "archer"){
state.awaitingStep = null;
if(state.archerIndex < state.archers.length - 1){ state.archerIndex += 1; }
save();
}
state.pendingArrows = state.pendingArrows || [];
// Chi segna deve poter sapere se qualcuno lo sta seguendo. La guardia sta
// dentro: se la sessione e' gia' in ascolto non succede niente, e su un giro
// senza arcieri invitati non parte proprio.
startOwnSessionListener();

var mode = effectiveMode();
var wrap = el('<div class="pista"></div>');

// ── battuta: prima si dichiara che piazzola e', poi si tira ──
if(mode.key === "battuta" && state.pendingArrows.length === 0 && !(state.liveBattutaTypes && state.liveBattutaTypes[state.target])){
var pickCard = el('<div class="card target-stage"></div>');
pickCard.appendChild(el('<div class="mode-badge">'+escapeHtml(modeLabel(state.mode))+'</div>'));
var pickHero = el('<div class="piazzola-hero"></div>');

pickHero.appendChild(el('<div class="piazzola-num">'+state.target+'</div>'));
pickCard.appendChild(pickHero);
pickCard.appendChild(el('<div class="archer-turn">'+t("gl_which_piazzola")+'</div>'));
var pickGrid = el('<div class="onboard-stack" style="max-width:none;margin-top:14px;"></div>');
var pickOpts = [
{key:"singola", label:t("gl_singola"), sub:t("gl_1_arrow"), frecce:1},
{key:"mobile", label:t("gl_mobile"), sub:t("gl_1_arrow"), frecce:1},
{key:"branco", label:t("gl_branco"), sub:t("gl_3_arrows_stop"), frecce:3},
{key:"tempo", label:t("gl_tempo"), sub:t("gl_3_arrows_sum"), frecce:3}
];
pickOpts.forEach(function(op){
var b = el('<button class="btn btn-ghost btn-block menu-btn"><span class="menu-txt"><b>'+op.label+'</b><span class="menu-sub">'+op.sub+'</span></span></button>');
b.addEventListener("click", function(){
state.liveBattutaTypes = state.liveBattutaTypes || {};
state.liveBattutaTypes[state.target] = { tipo: op.key, frecce: op.frecce };
save(); render();
});
pickGrid.appendChild(b);
});

}

var c = pistaContesto(mode);

wrap.appendChild(pistaTesta(c));

// ══════════════ PANNELLI oppure SCENA ══════════════
if(state.panel === "classifica"){
wrap.appendChild(pannelloClassifica());
} else {
wrap.appendChild(pistaScena(c));
wrap.appendChild(pistaSpazio(c));

var scorciatoie = el('<div class="pista-scorciatoie no-print"></div>');
// A SINISTRA IL SOLE, A DESTRA LA CLASSIFICA. La riga era allineata tutta a
// destra e meta' larghezza stava vuota: lo spazio c'era gia'.
// Il Sole porta la PAROLA, non solo il glifo — un sole da solo si legge
// "luminosita'", e questo e' il comando che serve quando lo schermo non si
// legge piu': se per trovarlo devi leggere bene, non serve a niente.
var bSole = el('<button class="btn btn-sole'+(soleAcceso() ? " acceso" : "")+'">'
+ icon("sun",16) + ' ' + t("theme_sun_label") + '</button>');
bSole.setAttribute("aria-pressed", String(soleAcceso()));
bSole.addEventListener("click", toggleSole);
scorciatoie.appendChild(bSole);
var bCla = el('<button class="btn btn-standings">'+icon("target",16)+' '+t("pista_classifica_btn")+'</button>');
bCla.addEventListener("click", function(){ misura("classifiche"); state.panel = "classifica"; save(); render(); });
scorciatoie.appendChild(bCla);
wrap.appendChild(scorciatoie);
}

// La striscia dell'annulla c'e' solo se c'e' qualcosa da annullare.
var striscia = pistaStriscia();
if(striscia) wrap.appendChild(striscia);

wrap.appendChild(pistaTastiera(c));

return wrap;
}

/* ══════════════════════════════════════════════════════════════════════════
   LE REGIONI DELLA PISTA, E PERCHE' SONO FUNZIONI A PARTE

   Il criterio scritto nelle note dice che il valore di questa schermata e'
   QUANTO E' VELOCE LO SGUARDO dopo il tocco. Quello sguardo *e'* il
   ridisegno. Finche' ogni freccia svuotava #app e ricostruiva tutto, la
   funzione dichiarata come l'unica che conta era anche la piu' costosa:
   288 ricostruzioni per giro, ciascuna capace di mangiarsi il :active del
   tasto ancora sotto il dito.

   Adesso ogni regione sa dirsi con una FIRMA: una stringa che riassume tutto
   quello che la farebbe sembrare diversa. dipingiPista() rifa' solo le
   regioni la cui firma e' cambiata; le altre non vengono toccate, quindi il
   nodo su cui poggia il dito sopravvive al tocco.

   La regola che tiene insieme la cosa: NESSUNA REGIONE HA DUE COSTRUTTORI.
   roundScreen() e dipingiPista() chiamano le stesse quattro funzioni. Due
   percorsi che disegnano la stessa cosa divergono sempre, e in silenzio.
   ══════════════════════════════════════════════════════════════════════════ */

// Tutto quello che le regioni devono sapere, calcolato una volta sola.
function pistaContesto(mode){
mode = mode || effectiveMode();
state.pendingArrows = state.pendingArrows || [];
var arrowNumber = state.pendingArrows.length + 1;
return {
mode: mode,
currentArcher: state.archers[state.archerIndex],
arrowNumber: arrowNumber,
totArrows: targetArrowCount(mode),
totalTargets: state.format,
pct: Math.round(((state.target-1) / state.format) * 100),
pts: mode.scoring[arrowNumber] || mode.scoring[mode.arrowsPerTarget] || mode.scoring[1]
};
}

// ---------- REGIONE: la testata (passo, avanzamento, timer) ----------
// E' l'unica regione che non si puo' costruire "per prova": dentro ci sono il
// conto alla rovescia e il suo setInterval, e un nodo costruito e poi buttato
// si porterebbe via l'intervallo di quello ancora a schermo — il timer visibile
// si fermerebbe da solo. Per questo la sua firma si sa PRIMA di costruirla.
function firmaTesta(c){
return state.target+"/"+c.totalTargets+"|"+c.pct+"|"+state.target+"_"+state.archerIndex
+"|"+(state.archers.length > 1 ? "gruppo" : "solo");
}
function pistaTesta(c){
var totalTargets = c.totalTargets, pct = c.pct;
// ══════════════ TESTATA: il passo del giro ══════════════
var testa = el('<div class="pista-testa" data-regione="testa"></div>');
// La firma include il turno: cambiando arciere il timer DEVE ripartire da
// zero, e il modo piu' sicuro per garantirlo e' che la regione si rifaccia.
testa.setAttribute("data-firma", firmaTesta(c));
var passoRiga = el('<div class="pista-passo-riga"></div>');
// Il numero della piazzola si dice UNA VOLTA SOLA sullo schermo. Se comanda la
// scena (arciere solo), qui resta la sola barra: ripeterlo in piccolo sotto lo
// stesso numero in grande e' una delle tre ripetizioni gia' tolte altrove.
if(state.archers.length > 1){
passoRiga.appendChild(el('<span class="pista-passo">'+t("target_singular")+' '+state.target+' / '+totalTargets+'</span>'));
} else {
passoRiga.appendChild(el('<span class="pista-passo"></span>'));
}

var tKey = state.target + "_" + state.archerIndex;
if(tKey !== timerTargetKey){
timerTargetKey = tKey; timerRemaining = null; timerRunning = false; timerAperto = false;
if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; }
}
function fmtTime(s){ var m = Math.floor(s/60), r = s%60; return m + ":" + (r<10?"0":"") + r; }

var chip = el('<button type="button" class="chip-timer"></button>');
var regola = el('<div class="timer-regola"></div>');
passoRiga.appendChild(chip);
testa.appendChild(passoRiga);
// La percentuale e' un DATO, non uno stile: entra come proprieta'
// personalizzata e la larghezza la decide il foglio di stile.
var barra = el('<div class="progress-track"><div class="progress-fill"></div></div>');
barra.firstChild.style.setProperty("--pct", pct+"%");
testa.appendChild(barra);
testa.appendChild(regola);

function tintaTimer(){
chip.classList.toggle("corre", timerRunning || timerRemaining !== null);
chip.classList.toggle("timer-warn", timerRemaining !== null && timerRemaining <= 20 && timerRemaining > 10);
chip.classList.toggle("timer-danger", timerRemaining !== null && timerRemaining <= 10);
}
function dipingiTimer(){
var inCorsa = timerRunning || timerRemaining !== null;
chip.innerHTML = icon("clock",14) + '<span class="chip-num">' + fmtTime(inCorsa ? Math.max(0,timerRemaining) : timerDuration) + '</span>';
tintaTimer();
regola.innerHTML = "";
// IN PAUSA: il conto e' fermo ma non perduto, e l'azzeramento vive qui —
// un comando a parte, non lo stesso tocco che mette in pausa.
if(inCorsa && !timerRunning){
if(timerRemaining > 0){
var ripr = el('<button type="button" class="btn btn-primary btn-sm">'+t("timer_resume")+'</button>');
ripr.addEventListener("click", function(){ timerRunning = true; dipingiTimer(); avviaConto(); });
regola.appendChild(ripr);
}
var azz = el('<button type="button" class="btn btn-ghost btn-sm">'+t("timer_reset")+'</button>');
azz.addEventListener("click", function(){
if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; }
timerRunning = false; timerRemaining = null; timerAperto = false; dipingiTimer();
});
regola.appendChild(azz);
return;
}
if(!inCorsa && timerAperto){
var meno = el('<button type="button" class="btn btn-ghost btn-sm">\u2212</button>');
var dur = el('<span class="timer-dur num">'+fmtTime(timerDuration)+'</span>');
var piu = el('<button type="button" class="btn btn-ghost btn-sm">+</button>');
var via = el('<button type="button" class="btn btn-primary btn-sm">'+t("timer_start")+'</button>');
meno.addEventListener("click", function(){ if(timerDuration>15){ timerDuration -= 15; dur.textContent = fmtTime(timerDuration); } });
piu.addEventListener("click", function(){ if(timerDuration<600){ timerDuration += 15; dur.textContent = fmtTime(timerDuration); } });
via.addEventListener("click", function(){
timerRemaining = timerDuration; timerRunning = true; timerAperto = false;
dipingiTimer(); avviaConto();
});
regola.appendChild(meno); regola.appendChild(dur); regola.appendChild(piu); regola.appendChild(via);
}
}
function avviaConto(){
if(timerIntervalId){ clearInterval(timerIntervalId); }
timerIntervalId = setInterval(function(){
timerRemaining--;
if(timerRemaining <= 0){
clearInterval(timerIntervalId); timerIntervalId = null;
timerRemaining = 0; timerRunning = false;
if(navigator.vibrate){ navigator.vibrate([80,60,80]); }
// scaduto: il conto e' fermo, quindi deve comparire il comando per azzerarlo.
dipingiTimer(); return;
}
var n = chip.querySelector(".chip-num");
if(n){ n.textContent = fmtTime(Math.max(0,timerRemaining)); }
tintaTimer();
}, 1000);
}
// Un tocco solo distruggeva il conto, senza conferma e senza rimedio, nella
// stessa schermata che dedica un'intera striscia a rendere annullabile un
// punteggio. Adesso vale la stessa asimmetria: il tocco mette in pausa (non
// si perde niente) e riprende; azzerare e' un comando a parte, a timer fermo.
chip.addEventListener("click", function(){
if(timerRunning){
if(timerIntervalId){ clearInterval(timerIntervalId); timerIntervalId = null; }
timerRunning = false;
} else if(timerRemaining > 0){
timerRunning = true; dipingiTimer(); avviaConto(); return;
} else if(timerRemaining === 0){
timerRemaining = null; timerAperto = false;
} else {
timerAperto = !timerAperto;
}
dipingiTimer();
});
dipingiTimer();
if(timerRunning && timerRemaining !== null){ avviaConto(); }
return testa;
}

// ---------- REGIONE: la scena (chi tira adesso, e chi viene dopo) ----------
function pistaScena(c){
var mode = c.mode, currentArcher = c.currentArcher, arrowNumber = c.arrowNumber, totArrows = c.totArrows;
var solo = state.archers.length <= 1;
// ── la scena: chi tira adesso, e chi viene dopo ──
// aria-live: e' la stessa funzione della fila dei turni — sapere di chi e' il
// turno senza doverlo cercare — per un utente che non guarda lo schermo.
var scena = el('<div class="card pista-scena" data-regione="scena" aria-live="polite"></div>');
// state.target entra nella firma: da soli il protagonista E' la piazzola, e
// senza il numero qui la firma resterebbe identica cambiando bersaglio.
var firma = solo+"|"+state.target+"|"+currentArcher.name+"|"+arrowNumber+"/"+totArrows+"|"+state.pendingArrows.join(",");
if(solo){
// Da soli: comanda la piazzola. Il nome non compare affatto — dire a un uomo
// come si chiama per due ore non e' un'informazione.
var hero = el('<h2 class="pista-piazzola"></h2>');
hero.appendChild(el('<span class="eti">'+t("target_singular")+'</span>'));
var cifre = el('<span class="cifre"></span>');
cifre.appendChild(el('<span>'+state.target+'</span>'));
cifre.appendChild(el('<span class="su">/ '+c.totalTargets+'</span>'));
hero.appendChild(cifre);
scena.appendChild(hero);
} else {
scena.appendChild(el('<h2 class="pista-arciere">'+escapeHtml(currentArcher.name)+'</h2>'));
}
var sotto = t("pista_freccia_di",{n:arrowNumber, tot:totArrows});
if(state.pendingArrows.length){ sotto += t("finora",{list:state.pendingArrows.join(', ')}); }
if(mode.stopAtFirstHit){ sotto += t("vale_prima"); }
scena.appendChild(el('<div class="pista-freccia">'+sotto+'</div>'));
if(mode.provisional){ scena.appendChild(el('<div class="pista-nota">'+t("provisional_note")+'</div>')); }

var turni = el('<div class="pista-turni"></div>');
state.archers.forEach(function(a, i){
var entries = state.scores[a.id] || [];
var ent = entries[state.target-1];
var stato = ent ? "fatto" : (i === state.archerIndex ? "ora" : "attesa");
var testo;
if(ent){ testo = ent.total; }
else if(stato === "ora" && state.pendingArrows.length){ testo = state.pendingArrows.reduce(function(s,x){ return s+x; },0); }
else { testo = "\u2013"; }
firma += "|" + a.id + ":" + stato + ":" + testo;
var t1 = el('<div class="turno'+(stato==="ora"?" ora":"")+'"></div>');
t1.appendChild(el('<div class="turno-badge '+stato+'">'+testo+'</div>'));
t1.appendChild(el('<span class="turno-nome">'+escapeHtml(a.name)+'</span>'));
turni.appendChild(t1);
});
if(state.archers.length > 1){ scena.appendChild(turni); }

scena.setAttribute("data-firma", firma);
return scena;
}

// ---------- REGIONE: lo spazio che avanza, e cosa ci sta dentro ----------
// PRIMO TENTATIVO SBAGLIATO, 15/08/2026: l'andamento era stato messo dentro
// .pista-scena. Ma la scena e' l'unica regione che CEDE (flex:0 1 auto,
// overflow-y:auto): con tre arcieri la scheda diventava piu' alta dello spazio
// disponibile, cominciava a scorrere, e scorrendo nascondeva il nome di chi
// tira — cioe' proprio la cosa che quella scheda esiste per dire.
// Il posto giusto e' lo spazio che avanza: e' la regione che CRESCE. Se c'e'
// posto l'andamento si vede, se non ce n'e' viene ritagliato e la scena resta
// intatta. Stessa proprieta' che rendeva la filigrana "gratis" — ma questo,
// a differenza di quella, si puo' scrivere cosa fa.
function pistaSpazio(c){
var sp = el('<div class="pista-spazio" data-regione="spazio"></div>');
var mie = state.scores[c.currentArcher.id] || [];
sp.setAttribute("data-firma", c.currentArcher.id + "|"
+ mie.map(function(e){ return e.total; }).join(","));
if(!mie.length) return sp;
var and = el('<div class="pista-andamento"></div>');
// Le piazzole chiuse: una riga sola, le piu' recenti a destra. A capo no —
// una fila che va a capo cresce senza limite e torna a rubare spazio alla
// scena, che e' l'errore appena corretto.
var fatte = el('<div class="pista-fatte"></div>');
mie.forEach(function(ent, idx){
fatte.appendChild(el('<span class="fatta"><i>'+(idx+1)+'</i><b class="num">'+ent.total+'</b></span>'));
});
and.appendChild(fatte);
var tot = el('<div class="pista-tot"></div>');
tot.appendChild(el('<span class="eti">'+t("pista_totale")+'</span>'));
tot.appendChild(el('<b class="num">'+totalFor(c.currentArcher.id)+'</b>'));
and.appendChild(tot);
sp.appendChild(and);
return sp;
}

// ---------- REGIONE: la striscia dell'annulla ----------
// Sostituisce la conferma: si segna e si va avanti, e il rimedio resta
// visibile accanto al risultato invece che in fondo alla pagina.
// L'UNITA' SI DICHIARA, NON SI FA INDOVINARE. Prima questo campo voleva
// dire due cose diverse a seconda di chi lo scriveva: la freccia in
// registerShot, il totale in finishTargetEarly. A schermo, chiusa una
// piazzola da 15+10+5, il cerchio del turno diceva "30" e la striscia
// "Ultimo: Anna 5" — due numeri per la stessa persona nello stesso istante,
// risolvibili solo sapendo che uno e' un totale e l'altro un'ultima freccia.
// Adesso la striscia dice quale delle due cose sta mostrando.
function pistaStriscia(){
if(!state.lastShotInfo) return null;
var info = state.lastShotInfo;
// role="status": la striscia compare dopo ogni freccia ed e' il rimedio.
// Comparire in silenzio significherebbe non esistere, per chi non vede.
var striscia = el('<div class="striscia-annulla no-print" data-regione="striscia" role="status"></div>');
striscia.setAttribute("data-firma", [info.name,info.score,info.unit,info.n,info.target,state.target].join("|"));
var testoUlt;
if(info.unit === "piazzola"){ testoUlt = t("pista_ultimo_piazzola",{name:escapeHtml(info.name)}); }
else if(info.n){ testoUlt = t("pista_ultimo_freccia",{name:escapeHtml(info.name), n:info.n}); }
// giri gia' in corso salvati da una versione precedente: il campo non c'e'
else { testoUlt = t("pista_ultimo",{name:escapeHtml(info.name)}); }
// Il rimedio resta valido anche dopo il cambio di piazzola — undoLastShot()
// sa tornare indietro e ripristina l'ordine di quella piazzola — ma allora il
// numero va DETTO: altrimenti la testata dice 14 e la striscia parla della 13.
if(info.target && info.target !== state.target){
testoUlt = t("pista_ultimo_altrove", { txt: testoUlt, p: t("target_inline"), n: info.target });
}
striscia.appendChild(el('<span>'+testoUlt+' <b class="num">'+info.score+'</b></span>'));
// L'azione resta una sola perche' il rimedio e' uno solo: si toglie sempre
// l'ultima freccia, anche quando la piazzola e' appena stata chiusa.
var bAnn = el('<button type="button">'+icon("undo",16)+' '+t("pista_annulla_freccia")+'</button>');
bAnn.addEventListener("click", undoLastShot);
striscia.appendChild(bAnn);
return striscia;
}

// ---------- REGIONE: la tastiera ----------
function pistaTastiera(c){
var mode = c.mode, pts = c.pts;
// ══════════════ LA TASTIERA ══════════════
var voci = mode.zones.map(function(z){
return { cls:z.cls, label:t(z.labelKey), pts:pts[z.key], key:z.key };
});
voci.push({ cls:"zero", label:t("zero_label"), pts:0, key:null });

var righe;
if(voci.length <= 3){ righe = [voci]; }
else if(voci.length === 4){ righe = [voci.slice(0,2), voci.slice(2)]; }
else { righe = [voci.slice(0,3), voci.slice(3)]; }

var tastiera = el('<div class="tastiera no-print" data-regione="tastiera"></div>');
// DUE FIRME, e la ragione l'ha trovata il banco. In Percorso il punteggio
// dipende da quale freccia e' (20/18/16, poi 14/12/10, poi 8/6/4): con una
// firma sola la tastiera si rifaceva 287 volte su 288, cioe' il tasto sotto
// il dito moriva comunque e tutto questo lavoro non serviva a niente.
//   forma  = quante righe, quali colori, quali etichette → non cambia quasi mai
//   numeri = le cifre                                    → cambiano a ogni freccia
// Se cambiano solo i numeri, i nodi restano e si riscrive la sola cifra.
tastiera.setAttribute("data-firma", righe.map(function(r){ return r.length; }).join(",")
+ "|" + voci.map(function(v){ return v.cls+":"+v.label; }).join("|"));
tastiera.setAttribute("data-numeri", voci.map(function(v){ return v.pts; }).join(","));
righe.forEach(function(riga){
var r = el('<div class="tastiera-riga" data-n="'+riga.length+'"></div>');
riga.forEach(function(v){
// Il punteggio sta NEL NODO, non in una chiusura: quando si aggiorna la sola
// cifra il tasto resta lo stesso, e un ascoltatore che leggesse una chiusura
// vecchia segnerebbe il punteggio della freccia precedente.
var b = el('<button class="btn quick-btn '+v.cls+'" data-pts="'+v.pts+'" data-zona="'+(v.key||"")+'"><span class="quick-lbl">'+v.label+'</span><span class="quick-pts">'+v.pts+'</span></button>');
b.addEventListener("click", function(){
if(navigator.vibrate){ navigator.vibrate(15); }
var zona = b.getAttribute("data-zona");
if(zona === "perfect" || zona === "superspot"){ leafBurst(b); }
registerShot(Number(b.getAttribute("data-pts")));
});
r.appendChild(b);
});
tastiera.appendChild(r);
});
return tastiera;
}

// Stessa forma, cifre diverse: si riscrive la cifra e basta. E' l'unico punto
// dell'app dove un nodo sopravvive a un cambio di dato, ed e' anche l'unico
// dove serve: e' il nodo che ha il dito sopra.
function aggiornaNumeriTastiera(nodo, c){
var voci = c.mode.zones.map(function(z){ return c.pts[z.key]; });
voci.push(0);
var tasti = nodo.querySelectorAll(".quick-btn");
if(tasti.length !== voci.length) return false;
for(var i=0; i<tasti.length; i++){
tasti[i].setAttribute("data-pts", voci[i]);
var cifra = tasti[i].querySelector(".quick-pts");
if(cifra) cifra.textContent = voci[i];
}
nodo.setAttribute("data-numeri", voci.join(","));
return true;
}

/* ---------- IL RIDISEGNO MIRATO ----------
   Torna true se ha aggiornato la pista sul posto, false se la schermata ha
   cambiato FORMA e serve un render() intero. Chi chiama scrive sempre:

       save(); if(!dipingiPista()) render();

   Le uscite sono deliberatamente pessimiste: in ogni caso dubbio si torna al
   ridisegno intero, che e' lento ma non sbaglia mai. Un aggiornamento mirato
   che indovina e' peggio di un ridisegno che rallenta. */
function dipingiPista(){
if(state.screen !== "round" || authState !== "ready" || homeOverride) return false;
// una sosta a tutto schermo, la scelta della piazzola in battuta, un pannello
// aperto: sono altre forme, non questa.
if(state.awaitingStep || state.panel) return false;
var wrap = document.querySelector(".pista");
if(!wrap) return false;
var mode = effectiveMode();
if(mode.key === "battuta" && (state.pendingArrows||[]).length === 0
&& !(state.liveBattutaTypes && state.liveBattutaTypes[state.target])) return false;
if(!state.archers[state.archerIndex]) return false;

var c = pistaContesto(mode);

// La testata: firma prima, costruzione solo se serve (vedi firmaTesta).
var vecchiaTesta = wrap.querySelector(".pista-testa");
if(!vecchiaTesta) return false;
if(firmaTesta(c) !== vecchiaTesta.getAttribute("data-firma")){
wrap.replaceChild(pistaTesta(c), vecchiaTesta);
}

// Scena e tastiera non hanno effetti collaterali: costruirle per confronto e
// poi buttarle non costa niente e non rompe niente.
// Scena e spazio: nessun effetto collaterale, quindi si costruiscono per
// confronto e si buttano se la firma non e' cambiata.
var ok = true;
[[".pista-scena", pistaScena], [".pista-spazio", pistaSpazio]].forEach(function(coppia){
if(!ok) return;
var vecchio = wrap.querySelector(coppia[0]);
if(!vecchio){ ok = false; return; }
var nuovo = coppia[1](c);
if(nuovo.getAttribute("data-firma") === vecchio.getAttribute("data-firma")) return;
wrap.replaceChild(nuovo, vecchio);
});
if(!ok) return false;

// LA TASTIERA E' IL PUNTO. Se la forma e' la stessa non si sostituisce niente:
// si riscrivono le cifre dentro i tasti che ci sono gia'. Il tasto appena
// premuto resta lo stesso nodo, con il suo :active, per tutta la durata del
// tocco. Solo se cambiano righe, colori o etichette si rifa' davvero.
var vecchiaTast = wrap.querySelector(".tastiera");
if(!vecchiaTast) return false;
var nuovaTast = pistaTastiera(c);
if(nuovaTast.getAttribute("data-firma") !== vecchiaTast.getAttribute("data-firma")){
wrap.replaceChild(nuovaTast, vecchiaTast);
} else if(nuovaTast.getAttribute("data-numeri") !== vecchiaTast.getAttribute("data-numeri")){
if(!aggiornaNumeriTastiera(vecchiaTast, c)) return false;
}

// La striscia invece nasce e muore, quindi le serve un posto dove nascere:
// subito prima della tastiera, che e' l'unica regione sempre presente in
// fondo. Il rimedio dev'essere adiacente all'errore anche qui.
var vecchiaStr = wrap.querySelector(".striscia-annulla");
var nuovaStr = pistaStriscia();
if(!nuovaStr){
if(vecchiaStr) wrap.removeChild(vecchiaStr);
} else if(!vecchiaStr){

// ---------- ROTAZIONE DEGLI ARCIERI ----------
// Due stili, verificati sui regolamenti:
// FIARC                   -> a scalare: l'ultimo passa primo, gli altri scendono di uno (ABCD -> DABC)
// World Archery / FITARCO -> a coppie: si tira a coppie e le coppie si alternano (ABCD -> CDAB).
//                            Con 3 arcieri il terzo vale come seconda coppia, con 5 il quinto come terza.
// L'ordine viene RICALCOLATO dal numero di piazzola invece che applicato a passi:
// cos\u00ec resta giusto anche tornando indietro con l'annulla.
// Se un giro era gi\u00e0 in corso quando l'ordine di partenza non veniva ancora
// memorizzato, lo si fissa adesso partendo dalla piazzola corrente.
function ensureRotationBase(){
if(!state.archersBase || !state.archersBase.length){
state.archersBase = (state.archers || []).slice();
state.rotBaseTarget = state.target || 1;
}
if(!state.rotBaseTarget) state.rotBaseTarget = 1;
}

function orderForTarget(n){
if(!state.archersBase || state.archersBase.length < 2) return (state.archers || []).slice();
var base = state.archersBase;
var steps = Math.max(0, (n || 1) - (state.rotBaseTarget || 1));

if(state.federation === "fiarc"){
var k = steps % base.length;
if(k === 0) return base.slice();
return base.slice(base.length - k).concat(base.slice(0, base.length - k));
}

var pairs = [];
for(var i = 0; i < base.length; i += 2){ pairs.push(base.slice(i, i + 2)); }
if(pairs.length === 1){
// un'unica coppia: nel regolamento tira insieme, qui i due si alternano
var due = base.slice();
if(steps % 2 === 1) due.reverse();
return due;
}
var kp = steps % pairs.length;
var ruotate = pairs.slice(kp).concat(pairs.slice(0, kp));
var out = [];
ruotate.forEach(function(p){ p.forEach(function(a){ out.push(a); }); });
return out;
}

function advanceToNextTarget(){
var mode = GAME_MODES[state.mode] || GAME_MODES.training;
state.awaitingStep = null;
state.panel = null;
state.archerIndex = 0;
if(state.target < state.format){
state.target += 1;
// Ad ogni piazzola l'ordine cambia, in gara come in allenamento,
// secondo lo stile della federazione scelta.
ensureRotationBase();
state.archers = orderForTarget(state.target);
} else {
state.roundActive = false;
state.screen = "summary";
// Finito vuol dire ARRIVATO IN FONDO. L'interruzione dalla classifica porta
// alla stessa schermata ma non e' la stessa cosa, e contarla insieme
// cancellerebbe proprio il numero che si voleva sapere.
misura("giriFiniti");
closeSharedSession();
}
save(); if(!dipingiPista()) render();
}

function registerShot(score){
var mode = effectiveMode();
var archer = state.archers[state.archerIndex];
state.pendingArrows = state.pendingArrows || [];
// L'intervallo vale solo se la freccia precedente e' dello stesso arciere
// sulla stessa piazzola: fra un arciere e l'altro c'e' un tiro vero di mezzo.
misuraTocco(state.pendingArrows.length > 0);
state.pendingArrows.push(score);

var tac = targetArrowCount(mode);
var liveType = (mode.key === "battuta" && state.liveBattutaTypes) ? (state.liveBattutaTypes[state.target]||{}).tipo : null;
var stopAtFirstMiss = liveType === "branco";
var done = mode.stopAtFirstHit
? (score > 0 || state.pendingArrows.length >= tac)
: stopAtFirstMiss
? (score === 0 || state.pendingArrows.length >= tac)
: (state.pendingArrows.length >= tac);

// unit dice COSA e' il numero: qui e' una freccia, e n e' la quale.
// target dice DOVE. Serve perche' chiudendo l'ultima piazzola si avanza
// subito: senza il numero, la striscia resterebbe a schermo parlando di una
// piazzola diversa da quella scritta in testata.
state.lastShotInfo = { name: archer.name, score: score,
unit: "freccia", n: state.pendingArrows.length, target: state.target };

if(done){
var total = state.pendingArrows.reduce(function(s,x){ return s+x; }, 0);
var entry = { arrows: state.pendingArrows.slice(), total: total };
state.scores[archer.id].push(entry);
syncShotToSession(archer, entry);
state.pendingArrows = [];
state.arrowIndex = 0;
// Il passaggio di turno non merita piu' una schermata a se': la fila dei
// turni nella scena dice gia' a chi tocca, e la diceva anche mentre stavi
// segnando. Su un percorso da 24 piazzole in quattro sono 95 interruzioni
// e 95 tocchi in meno. L'unica sosta che resta e' la fine del giro, dove
// c'e' davvero qualcosa da decidere (vedere il finale, o aggiungerne una).
if(state.archerIndex < state.archers.length - 1){
state.archerIndex += 1;
} else if(state.target < state.format){
advanceToNextTarget();
return;
} else {
state.awaitingStep = "target";
}
} else {
state.arrowIndex = state.pendingArrows.length;
}
// IL RIDISEGNO E' LA FUNZIONE, non un dettaglio di resa. Vedi il blocco sulle
// regioni: si rifa' solo quello che e' cambiato, e la tastiera — che di norma
// non cambia — non viene toccata, quindi il tasto appena premuto resta lo
// stesso nodo e non perde il suo :active a meta' tocco.
save(); if(!dipingiPista()) render();
}

function finishTargetEarly(){
var archer = state.archers[state.archerIndex];
state.pendingArrows = state.pendingArrows || [];
var total = state.pendingArrows.reduce(function(s,x){ return s+x; }, 0);
var earlyEntry = { arrows: state.pendingArrows.slice(), total: total };
state.scores[archer.id].push(earlyEntry);
syncShotToSession(archer, earlyEntry);
// qui il numero e' la somma della piazzola, non una freccia: va detto.
state.lastShotInfo = { name: archer.name, score: total, unit: "piazzola", n: null, target: state.target };
state.pendingArrows = [];
state.arrowIndex = 0;
if(state.archerIndex < state.archers.length - 1){
state.archerIndex += 1;
} else if(state.target < state.format){
advanceToNextTarget();
return;
} else {
state.awaitingStep = "target";
}
save(); if(!dipingiPista()) render();
}

function undoLastShot(){
misura("annulli"); ultimoTocco = null;
// La striscia dell'annulla mostra l'ultimo tiro: appena lo si toglie, sparisce.
state.lastShotInfo = null;
state.panel = null;
// Frecce già segnate in questa piazzola ma non ancora completata: si toglie solo l'ultima
if(state.pendingArrows && state.pendingArrows.length > 0){
state.pendingArrows.pop();
state.arrowIndex = state.pendingArrows.length;
save(); if(!dipingiPista()) render();
return;
}

var archerIdx, targetNum;
if(state.awaitingStep === "target" || state.awaitingStep === "archer"){
// la piazzola per questo arciere e' appena stata completata: l'ultima freccia tirata e' la sua
archerIdx = state.archerIndex;
targetNum = state.target;
state.awaitingStep = null;
} else {
archerIdx = state.archerIndex - 1;
targetNum = state.target;
if(archerIdx < 0){
if(state.target === 1) return; // niente da annullare
targetNum = state.target - 1;
archerIdx = state.archers.length - 1;
}
}

// tornando a una piazzola precedente va ripristinato anche l'ordine di quella piazzola,
// altrimenti si annullerebbe il punteggio dell'arciere sbagliato
ensureRotationBase();
if(targetNum !== state.target){ state.archers = orderForTarget(targetNum); }
var archer = state.archers[archerIdx];
var entries = state.scores[archer.id];
if(entries.length >= targetNum){
var lastEntry = entries.pop();
// L'ANNULLA PROPAGA. La riga esce anche dal documento condiviso, insieme alla
// controfirma che avesse gia' addosso. Quando l'arciere ricompletera' la
// piazzola nascera' una riga nuova, con un sid nuovo: non si "corregge" una
// testimonianza, se ne scrive un'altra.
unsyncShotFromSession(archer, lastEntry);
// si toglie solo l'ultima freccia della piazzola: le altre restano gia' segnate, pronte per essere confermate di nuovo
state.pendingArrows = lastEntry.arrows.slice(0, -1);
state.arrowIndex = state.pendingArrows.length;
} else {
state.pendingArrows = [];
state.arrowIndex = 0;
}
state.target = targetNum;
state.archerIndex = archerIdx;
save(); if(!dipingiPista()) render();
}

// ---------- SUMMARY ----------
/* ══════════════════════════════════════════════════════════════════════════
   LA CONSEGNA: il terzo mestiere della scheda

   Registrare era gia' risolto, e meglio della carta. Testimoniare lo dice la
   pastiglia durante il giro. Mancava il gesto che chiude il rito: su un
   percorso il giro finisce quando la scheda passa di mano, e finche'
   consegnare non esiste la scheda di carta resta in tasca.

   Due regole, e sono quelle che distinguono una consegna da un secondo
   "condividi" con un'icona diversa:

   1. UNA FIRMA VALE SE QUALCUNO HA VISTO. In gruppo ne servono almeno due,
      da soli basta la propria. E' la stessa asimmetria della controfirma
      durante il giro: chi segna non controfirma se stesso.
   2. DOPO LA CONSEGNA NON SI TOCCA PIU' NIENTE. Una scheda passata di mano
      non torna indietro. E' l'irreversibilita' a rendere l'atto un atto;
      senza, sarebbe un'etichetta.

   Cosa NON c'e', di proposito: un codice scheda. Era stato disegnato — sei
   lettere maiuscole da dire al tavolo — e non passa la prova che deve passare
   ogni cosa su questo schermo: *si scriva cosa fa*. Un codice che punta solo
   dentro l'archivio di questo telefono non e' una ricevuta, e' una ricevuta
   finta. La data, l'ora e i nomi di chi ha firmato sono veri tutti e tre.
   ══════════════════════════════════════════════════════════════════════════ */

// Quante piazzole sono state davvero chiuse. Serve a distinguere il giro
// arrivato in fondo da quello interrotto: FIARC Art. 18.i, una gara non finita
// resta valida se la tabella e' firmata, e quindi vale la pena consegnarla.
function piazzoleChiuse(){
var n = 0;
(state.archers||[]).forEach(function(a){
var e = ((state.scores||{})[a.id]||[]).length;
if(e > n) n = e;
});
return n;
}
function schedaConsegnata(){ return !!(state.consegna && state.consegna.at); }
function firmeScheda(){
var f = state.firme || {}, n = 0;
(state.archers||[]).forEach(function(a){ if(f[a.id]) n++; });
return n;
}
function consegnaPronta(){
if(schedaConsegnata()) return false;
var tot = (state.archers||[]).length;
return firmeScheda() >= (tot > 1 ? 2 : 1);
}
function firmaScheda(archerId){
if(schedaConsegnata()) return false;
state.firme = state.firme || {};
if(state.firme[archerId]) return false;
state.firme[archerId] = new Date().toISOString();
return true;
}
// Finche' la scheda e' in mano si puo' togliere una firma: non e' ancora uscita
// di li'. Ma non e' un interruttore, quindi la si chiede due volte.
function togliFirmaScheda(archerId){
if(schedaConsegnata()) return false;
if(!state.firme || !state.firme[archerId]) return false;
delete state.firme[archerId];
return true;
}
// Si consegna UNA VOLTA SOLA: la seconda chiamata restituisce la consegna di
// prima invece di farne un'altra. Una scheda con due ore di consegna diverse
// e' una scheda che non si sa quando e' stata consegnata.
function registraConsegna(){
if(schedaConsegnata()) return state.consegna;
if(!consegnaPronta()) return null;
var f = state.firme || {};
state.consegna = {
at: new Date().toISOString(),
firme: (state.archers||[]).filter(function(a){ return !!f[a.id]; })
.map(function(a){ return { name:a.name, at:f[a.id] }; }),
piazzole: piazzoleChiuse(),
formato: state.format
};
return state.consegna;
}
// In allenamento non si consegna niente a nessuno. Dire "consegna la scheda" a
// chi tira da solo dietro casa e' lo stesso errore del badge della modalita':
// un'etichetta che non parla di niente.
function schedaVisibile(){
var fed = FEDERATIONS[state.federation || "fiarc"];
return !!fed && fed.garaModes.indexOf(state.mode) !== -1;
}
// La consegna deve sopravvivere alla schermata: finisce sulla riga di
// cronologia gia' salvata e sulla copia in cloud. Senza, domani la scheda
// risulta di nuovo da firmare — e una consegna che si dimentica non e' una
// consegna. La riga si ritrova per data, non per posizione: la prima della
// lista e' quasi sempre questa, ma "quasi sempre" non e' un criterio.
function scriviConsegna(c){
if(!c || !state.roundEntryDate) return;
var hist = loadHistory();
for(var i=0;i<hist.length;i++){
if(hist[i] && hist[i].date === state.roundEntryDate){
hist[i].consegna = {
at: c.at,
firme: c.firme.map(function(f){ return f.name; }),
piazzole: c.piazzole
};
saveHistoryList(hist);
backupRoundToCloud(hist[i]);
return;
}
}
}

function schedaCard(ranked){
var card = el('<div class="card"></div>');
card.appendChild(el('<h2 class="section-title">'+t("consegna_title")+'</h2>'));

var fatta = schedaConsegnata();
if(fatta){
var c = state.consegna, d = new Date(c.at);
var box = el('<div class="scheda-fatta"></div>');
box.appendChild(el('<div class="sf-titolo">'+icon("firma",18)+' '+t("consegna_fatta")+'</div>'));
box.appendChild(el('<div class="sf-quando">'+escapeHtml(t("consegna_fatta_nota",{
data: d.toLocaleDateString(state.lang||"it"),
ora: d.toLocaleTimeString(state.lang||"it", { hour:"2-digit", minute:"2-digit" })
}))+'</div>'));
card.appendChild(box);
} else {
card.appendChild(el('<div class="scheda-nota">'+escapeHtml(t("consegna_nota"))+'</div>'));
}

// Un giro interrotto non e' un giro perso, e chi non conosce l'Art. 18.i non
// puo' saperlo: buttare una scheda buona e' un errore del disegno.
var chiuse = piazzoleChiuse();
if(chiuse < state.format){
card.appendChild(el('<div class="scheda-nota">'+escapeHtml(t("consegna_interrotta",{n:chiuse, tot:state.format}))+'</div>'));
}

var lista = el('<div class="scheda-firme"></div>');
(ranked || state.archers).forEach(function(a){
var firmato = !!((state.firme||{})[a.id]);
var riga = el('<button type="button" class="firma-riga'+(firmato?" firmata":"")+'"></button>');
riga.appendChild(el('<span class="fr-nome">'+escapeHtml(a.name)+'</span>'));
riga.appendChild(el('<span class="fr-tot">'+totalFor(a.id)+'</span>'));
var segno = el('<span class="fr-segno"></span>');
segno.innerHTML = firmato ? (icon("firma",14)+' '+t("consegna_firmato")) : t("consegna_firma");
riga.appendChild(segno);

if(fatta){
riga.setAttribute("disabled","disabled");
} else if(firmato){
var armato = false, tmr = null;
riga.addEventListener("click", function(){
if(!armato){
armato = true;
riga.classList.add("btn-armed");
segno.textContent = t("consegna_togli");
tmr = setTimeout(function(){
armato = false;
riga.classList.remove("btn-armed");
segno.innerHTML = icon("firma",14)+' '+t("consegna_firmato");
}, 4000);
} else {
clearTimeout(tmr);
if(togliFirmaScheda(a.id)){ save(); render(); }
}
});
} else {
riga.addEventListener("click", function(){
if(firmaScheda(a.id)){ save(); render(); }
});
}
lista.appendChild(riga);
});
card.appendChild(lista);

if(!fatta){
var pronta = consegnaPronta();
var btn = el('<button class="btn btn-primary btn-block">'+t("consegna_btn")+'</button>');
if(!pronta) btn.setAttribute("disabled","disabled");
armDoubleConfirm(btn, t("consegna_conferma"), function(){
var c = registraConsegna();
if(!c) return;
scriviConsegna(c);
save(); render();
});
card.appendChild(btn);
if(!pronta) card.appendChild(el('<div class="scheda-manca">'+escapeHtml(t("consegna_manca"))+'</div>'));
}
return card;
}

function summaryScreen(){
var wrap = el('<div></div>');
var mLabel = modeLabel(state.mode);
var card = el('<div class="card"></div>');
card.appendChild(el('<div class="print-header"><h2 style="margin:0;">ArcTrail 3D \u2014 '+escapeHtml(mLabel)+'</h2><div style="font-size:0.85rem;">'+new Date().toLocaleDateString(state.lang||'it')+'</div></div>'));
card.appendChild(el('<h2 class="section-title">'+t("classifica_title",{mode:escapeHtml(mLabel)})+'</h2>'));
var ranked = state.archers.slice().sort(function(a,b){ return totalFor(b.id) - totalFor(a.id); });

if(!state.savedToHistory){
var hist = loadHistory();
var nowISO = new Date().toISOString();
var roundEntry = {
date: nowISO,
format: state.format,
modeKey: state.mode,
modeLabel: mLabel,
results: ranked.map(function(a){
var entries = state.scores[a.id] || [];
return { name: a.name, total: totalFor(a.id), isSelf: (a.isSelf === true), ownerUid: a.ownerUid || null, perTarget: entries.map(function(e){ return e.total; }), arrows: entries.map(function(e){ return e.arrows; }) };
})
};
hist.unshift(roundEntry);
roundEntry.results.forEach(function(r){
recordLifetime(r.name, state.mode, mLabel, r.total, nowISO, state.format, r.ownerUid, r.isSelf);
});
if(hist.length > HISTORY_MAX) hist.length = HISTORY_MAX;
saveHistoryList(hist);
backupRoundToCloud(roundEntry);
state.savedToHistory = true;
// La riga appena scritta si ritrova per data: alla consegna serve QUESTA, non
// la prima della lista.
state.roundEntryDate = nowISO;
save();
setTimeout(celebrationBurst, 150);
}

var histAll = loadHistory();
function prevTotalFor(name){
for(var i=1;i<histAll.length;i++){
var h = histAll[i];
var hKey = h.modeKey || null;
if(hKey ? hKey !== state.mode : h.modeLabel !== mLabel) continue;
for(var j=0;j<h.results.length;j++){
if(h.results[j].name === name) return h.results[j].total;
}
}
return null;
}

var table = el('<table class="score-table"><thead><tr><th class="name-col">'+t("th_archer")+'</th><th>'+t("th_targets")+'</th><th>'+t("th_total")+'</th><th>'+t("th_vs_prev")+'</th></tr></thead><tbody></tbody></table>');
var tbody = table.querySelector("tbody");
ranked.forEach(function(a, i){
var entries = state.scores[a.id] || [];
var tot = totalFor(a.id);
var prev = prevTotalFor(a.name);
var deltaTxt = "&mdash;";
if(prev !== null){
var diff = tot - prev;
var sign = diff > 0 ? "+" : "";
var color = diff > 0 ? "var(--success)" : diff < 0 ? "var(--danger)" : "var(--muted)";
deltaTxt = '<span style="color:'+color+';font-weight:700;">'+sign+diff+'</span>';
}
tbody.appendChild(el(
'<tr class="rank-row'+(i===0?" first":"")+'"><td class="name-col">'+(i===0?"\uD83C\uDFC6 ":"")+escapeHtml(a.name)+'</td>'+
'<td>'+entries.length+'</td><td class="total-col">'+tot+'</td><td>'+deltaTxt+'</td></tr>'
));
});
card.appendChild(table);
wrap.appendChild(card);

var detailCard = el('<div class="card"></div>');
detailCard.appendChild(el('<h2 class="section-title">'+t("detail_title")+'</h2>'));
var piazzFlow = el('<div class="piazz-flow"></div>');
for(var i=0;i<state.format;i++){
var pCard = el('<div class="piazz-card"></div>');
pCard.appendChild(el('<div class="piazz-card-num">'+(i+1)+'</div>'));
var rightWrap = el('<div class="piazz-card-right"></div>');
ranked.forEach(function(a){
var entries = state.scores[a.id] || [];
var ent = entries[i];
var item = el('<div class="ring-item"></div>');
if(ent){
item.appendChild(el('<div class="ring-badge">'+ent.total+'</div>'));
if(ent.arrows.length > 1){
item.appendChild(el('<span style="font-size:0.58rem;color:var(--muted);">'+ent.arrows.join('+')+'</span>'));
}
} else {
item.appendChild(el('<div class="ring-badge empty">&ndash;</div>'));
}
item.appendChild(el('<span class="ring-name">'+escapeHtml(a.name)+'</span>'));
rightWrap.appendChild(item);
});
pCard.appendChild(rightWrap);
piazzFlow.appendChild(pCard);
}
detailCard.appendChild(piazzFlow);
wrap.appendChild(detailCard);

// La scheda sta dopo i numeri, come sulla carta: prima si legge, poi si firma.
var consegnaAperta = false;
if(schedaVisibile()){
wrap.appendChild(schedaCard(ranked));
consegnaAperta = !schedaConsegnata();
}

// Sulla stampa la riga della firma non e' piu' vuota se qualcuno ha firmato
// nell'app: due righe da riempire a penna quando la firma c'e' gia' sono la
// carta che rientra dalla finestra.
var firmatari = schedaConsegnata()
? state.consegna.firme.map(function(f){ return f.name; }).join(", ")
: "";
var colonnaFirme = firmatari
? escapeHtml(t("consegna_firmata_da",{list:firmatari}))
: t("print_sign_archer");
var sigRow = el('<div class="print-signatures"><div>'+colonnaFirme+'</div><div>'+t("print_sign_judge")+'</div></div>');
wrap.appendChild(sigRow);

// Finche' la scheda non e' consegnata, il tasto principale di questa schermata
// non puo' essere quello che se ne va: sarebbe l'unica azione in evidenza, e
// direbbe di andarsene proprio prima del gesto che chiude il giro.
var newRound = el('<button class="btn '+(consegnaAperta?"btn-ghost":"btn-primary")+' btn-block no-print" style="padding:16px;">'+t("back_to_menu_full")+'</button>');
newRound.addEventListener("click", function(){ homeOverride = true; render(); });
wrap.appendChild(newRound);

var resetBtn = el('<button class="btn btn-ghost btn-block no-print" style="margin-top:10px;">'+t("reset_round_btn")+'</button>');
wrap.appendChild(resetBtn);
armDoubleConfirm(resetBtn, t("reset_confirm"), hardResetAll);

var printBtn = el('<button class="btn btn-ghost btn-block no-print" style="margin-top:10px;">'+icon("printer",16)+' '+t("export_pdf_btn")+'</button>');
printBtn.addEventListener("click", function(){
window.print();
});
wrap.appendChild(printBtn);

var shareBtn = el('<button class="btn btn-ghost btn-block no-print" style="margin-top:10px;">'+icon("share",16)+' '+t("share_btn")+'</button>');
shareBtn.addEventListener("click", function(){
var lines = ranked.map(function(a,i){
var entries = state.scores[a.id] || [];
var perTarget = entries.map(function(ent,idx){ return (idx+1)+":"+ent.total; }).join(" ");
return (i+1)+". "+a.name+" \u2013 "+totalFor(a.id)+" pt\n "+perTarget;
});
var text = t("share_header",{mode:mLabel, n:state.format})+"\n\n"+lines.join("\n\n");
if(navigator.share){
navigator.share({ title: "ArcTrail 3D", text: text }).catch(function(){});
} else if(navigator.clipboard){
navigator.clipboard.writeText(text).then(function(){
shareBtn.innerHTML = t("copied_msg");
setTimeout(function(){ shareBtn.innerHTML = icon("share",16)+' '+t("share_btn"); }, 2000);
});
}
});
wrap.appendChild(shareBtn);

return wrap;
}

if(!DEV_MODE && 'serviceWorker' in navigator){
window.addEventListener('load', function(){
navigator.serviceWorker.register('sw.js').catch(function(){});
});
var swReloaded = false;
navigator.serviceWorker.addEventListener('controllerchange', function(){
if(swReloaded) return;
swReloaded = true;
window.location.reload();
});
}
// Rientro dopo una lunga pausa: l'app si ricarica da sola, cosi' riparte pulita
// e prende anche l'eventuale versione nuova. Non lo fa mai durante un giro.
var appHiddenAt = 0;
document.addEventListener("visibilitychange", function(){
if(document.hidden){ appHiddenAt = Date.now(); return; }
if(!appHiddenAt) return;
var fermo = Date.now() - appHiddenAt;
appHiddenAt = 0;
if(state.roundActive === true || state.screen === "round" || state.screen === "summary") return;
if(fermo < 20 * 60 * 1000) return;
if(!DEV_MODE && navigator.serviceWorker && navigator.serviceWorker.getRegistration){
navigator.serviceWorker.getRegistration().then(function(reg){ if(reg) reg.update(); }).catch(function(){});
}
window.location.reload();
});

// Ridimensionando la finestra del browser si passa da telefono a computer:
// la barra e le colonne si decidono al momento del disegno, quindi senza questo
// il layout restava quello di partenza finche' non si cambiava schermata.
// Non ridisegna mai durante un giro, per non perdere quello che si sta scrivendo.
if(typeof window.matchMedia === "function"){
["(min-width: 760px)", "(min-width: 1080px)"].forEach(function(q){
var mq = window.matchMedia(q);
var onChange = function(){
if(state.screen === "round" || state.screen === "summary") return;
if(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
render();
};
if(mq.addEventListener) mq.addEventListener("change", onChange);
else if(mq.addListener) mq.addListener(onChange);
});
}

// Tasto indietro fisico di Android e gesto di scorrimento laterale.
// Si aggancia alla cronologia del browser: premere indietro riporta al menu
// invece di chiudere l'app, e da una schermata gia' al menu esce davvero.
var navGuardActive = false;
function pushNavGuard(){
if(navGuardActive) return;
try{ history.pushState({ arctrail:true }, ""); navGuardActive = true; }catch(e){}
}
function syncNavGuard(){
var dentro = state.lang && state.screen && state.screen !== "menu" && !homeOverride;
if(dentro) pushNavGuard();
}
window.addEventListener("popstate", function(){
navGuardActive = false;
if(!state.lang) return;
if(state.screen === "round" || state.screen === "summary"){
// durante un percorso non si esce per sbaglio: si torna al menu, i punteggi restano
homeOverride = true;
save(); render();
pushNavGuard();
return;
}
if(state.screen && state.screen !== "menu"){
if(state.screen === "session-follow"){ stopFollowingSession(); state.followSessionId = null; }
state.screen = "menu";
save(); render();
pushNavGuard();
}
});

initAuthFlow();
});
</script>
</body>
</html>
