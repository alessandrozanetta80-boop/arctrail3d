<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D9A8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ArcTrail 3D">
<meta name="mobile-web-app-capable" content="yes">
<title>ArcTrail 3D – Scoring App for 3D Archery</title>
<meta name="description" content="ArcTrail 3D: free scoring app for 3D archery, supporting multiple federations (FIARC, FITARCO, IFAA and more).">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
--bg:#0F1412; --bg-panel:#16201C; --bg-panel-2:#1A2620;
--accent:#1D9A8C; --bark:#E8722F; --gold:#CBA35C; --cream:#EDE6D6; --muted:#9AA39C;
--danger:#E23D2E; --success:#4CAF50; --line:#2A362F;
}
body.theme-light{
--bg:#F5F4F0; --bg-panel:#FFFFFF; --bg-panel-2:#FAFAF7;
--accent:#0F8A7C; --bark:#D9601E; --gold:#A6791F; --cream:#1A1D1B; --muted:#6B7069;
--line:#E4E1D8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; color:var(--cream); background:var(--bg); font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100dvh; padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:520px; margin:0 auto; padding:18px 16px 32px; min-height:100dvh; position:relative;}
.card{background:linear-gradient(180deg, var(--bg-panel-2) 0%, var(--bg-panel) 100%); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:0 6px 16px rgba(0,0,0,0.28); border-top:2px solid var(--gold); position:relative; z-index:1;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:10px; padding:14px 18px; font-size:1rem; font-weight:700; cursor:pointer; color:var(--cream); background:var(--bg-panel-2); border:1px solid var(--line); box-shadow:0 3px 8px rgba(0,0,0,0.22); transition:transform .12s ease;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--accent); border-color:transparent; color:#fff;}
.btn-danger{background:var(--danger); border-color:transparent; color:#fff;}
.btn-block{width:100%;}
.badge{display:inline-block; background:var(--bark); color:#fff; padding:4px 8px; border-radius:4px; font-size:0.7rem; font-weight:700;}
h2.section-title{font-size:0.78rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted); margin:0 0 12px;}
.input-group{margin-bottom:12px;}
.input-group label{display:block; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:6px; font-weight:700;}
.input-group input,.input-group select{width:100%; padding:12px; border:1px solid var(--line); background:var(--bg-panel-2); color:var(--cream); border-radius:8px; font-family:inherit; font-size:1rem;}
.input-group input::placeholder{color:var(--muted);}
.ranking-card{background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; display:flex; align-items:center; gap:12px;}
.rank-badge{font-weight:800; font-size:1.2rem; color:var(--gold); width:32px; text-align:center;}
.rank-info{flex:1;}
.rank-name{font-weight:600; color:var(--cream); font-size:0.95rem;}
.rank-meta{font-size:0.75rem; color:var(--muted); margin-top:2px;}
.rank-score{font-weight:800; font-size:1.1rem; color:var(--gold);}
.stat-box{background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px;}
.stat-label{font-size:0.65rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:6px; font-weight:700;}
.stat-value{font-size:1.8rem; font-weight:800; color:var(--gold);}
.stat-sub{font-size:0.75rem; color:var(--muted); margin-top:6px;}
.sync-phone{background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px;}
.sync-header{display:flex; align-items:center; gap:8px; font-weight:600; color:var(--cream); margin-bottom:10px;}
.sync-dot{width:8px; height:8px; border-radius:50%; background:var(--success);}
.sync-dot.offline{background:#666;}
.sync-input{display:flex; gap:8px; margin-bottom:10px;}
.sync-input input{flex:1; padding:10px; background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; color:var(--cream); font-size:0.9rem;}
.sync-input button{padding:10px 14px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-weight:600; cursor:pointer; font-size:0.9rem;}
.total-display{text-align:center; padding:16px; background:rgba(76,175,80,0.1); border:1px solid var(--success); border-radius:10px; margin:12px 0;}
.total-label{font-size:0.75rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:6px;}
.total-value{font-size:2rem; font-weight:800; color:var(--success);}
.beta-tab{display:flex; gap:8px; margin-bottom:16px;}
.beta-tab button{flex:1; padding:10px; background:var(--bg-panel-2); border:1px solid var(--line); border-radius:8px; color:var(--muted); font-weight:600; cursor:pointer; font-size:0.85rem;}
.beta-tab button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.beta-screen{display:none;}
.beta-screen.active{display:block;}
.info-box{font-size:0.75rem; color:var(--muted); margin-bottom:12px; padding:8px; background:rgba(29,154,140,0.1); border-radius:8px; border-left:2px solid var(--accent);}
.diario-entry{background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px;}
.diario-date{font-size:0.75rem; color:var(--muted); font-weight:600;}
.diario-gara{font-weight:600; font-size:0.95rem; color:var(--cream); margin-top:2px;}
.diario-score{display:flex; gap:12px; margin-top:6px;}
.diario-score-item{flex:1; background:var(--bg-panel); padding:6px; border-radius:6px; text-align:center;}
.diario-score-label{font-size:0.65rem; color:var(--muted);}
.diario-score-val{font-weight:700; font-size:1rem; color:var(--cream);}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DEV_MODE = false;
const firebaseConfig = {
  apiKey: "AIzaSyB9SoSHGEMnF-a1QP78hYF9r9E553wYNhY",
  authDomain: "arctrail3d.firebaseapp.com",
  projectId: "arctrail3d",
  storageBucket: "arctrail3d.firebasestorage.app",
  messagingSenderId: "185889526349",
  appId: "1:185889526349:web:0af3b386332664387c8204"
};

let user = null;
let FEATURES_BETA = false;
let currentScreen = 'home';
let syncPattuglia = { telefono1: 0, telefono2: 0, lastUpdate: new Date() };

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function initAuthFlow(){
  auth.onAuthStateChanged(async function(u){
    if(u){
      user = { uid: u.uid, email: u.email };
      try {
        const doc = await db.collection('users').doc(u.uid).get();
        if(doc.exists){
          Object.assign(user, doc.data());
        }
      } catch(e) {
        console.log('Firestore read error:', e);
      }
      FEATURES_BETA = user.adminTester === true;
      render();
    } else {
      user = null;
      FEATURES_BETA = false;
      render();
    }
  });
}

function renderLoginScreen(){
  return `
  <div class="card">
    <h2 class="section-title">Login</h2>
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="tu@example.com">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Password">
    </div>
    <button class="btn btn-primary btn-block" onclick="handleLogin()">Accedi</button>
    <button class="btn btn-block" style="margin-top:10px;" onclick="currentScreen='register'; render()">Registrati</button>
  </div>
  `;
}

function renderRegisterScreen(){
  return `
  <div class="card">
    <h2 class="section-title">Registrazione</h2>
    <div class="input-group">
      <label>Nome</label>
      <input type="text" id="regName" placeholder="Il tuo nome">
    </div>
    <div class="input-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="tu@example.com">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="regPass" placeholder="Almeno 6 caratteri">
    </div>
    <div class="input-group">
      <label>Numero Tessera Federazione (facoltativo)</label>
      <input type="text" id="regTessera" placeholder="es. FIARC-2024-12345">
    </div>
    <button class="btn btn-primary btn-block" onclick="handleRegister()">Registrati</button>
    <button class="btn btn-block" style="margin-top:10px;" onclick="currentScreen='home'; render()">Torna al Login</button>
  </div>
  `;
}

function renderHomeScreen(){
  const userInfo = `
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-weight:600; font-size:1.1rem;">Ciao, ${user.nome || 'Arciere'}</div>
        <div style="font-size:0.75rem; color:var(--muted);">${user.email}</div>
        ${user.tessera ? `<div style="font-size:0.75rem; color:var(--gold); margin-top:2px; font-weight:600;">✓ ${user.tessera}</div>` : ''}
      </div>
      <button class="btn btn-danger" onclick="handleLogout()">Esci</button>
    </div>
  </div>
  `;

  const betaFeatures = FEATURES_BETA ? `
  <div class="card">
    <h2 class="section-title">Beta Features <span class="badge">TESTER</span></h2>
    <button class="btn btn-block btn-primary" style="margin-bottom:10px;" onclick="currentScreen='streaming'; render()">📊 Classifica Live</button>
    <button class="btn btn-block" style="margin-bottom:10px;" onclick="currentScreen='diario'; render()">📈 Il Mio Diario</button>
    <button class="btn btn-block" onclick="currentScreen='sincro'; render()">🔄 Sincro Pattuglia</button>
  </div>
  ` : '';

  const mainMenu = `
  <div class="card">
    <h2 class="section-title">Menu Principale</h2>
    <button class="btn btn-block" style="margin-bottom:10px;">🎯 Allena</button>
    <button class="btn btn-block" style="margin-bottom:10px;">🏆 Gara</button>
    <button class="btn btn-block" style="margin-bottom:10px;">📊 Compagnie</button>
    <button class="btn btn-block">⚙️ Impostazioni</button>
  </div>
  `;

  return userInfo + betaFeatures + mainMenu;
}

function renderStreamingScreen(){
  return `
  <div class="card">
    <h2 class="section-title">Classifica Live <span class="badge">BETA</span></h2>
    <div class="beta-tab">
      <button class="active" onclick="switchBetaTab(0)">Streaming</button>
      <button onclick="switchBetaTab(1)">Diario</button>
      <button onclick="switchBetaTab(2)">Sincro</button>
    </div>
    
    <div class="beta-screen active">
      <div class="info-box">✓ Aggiornamento live ogni 2 secondi da Firestore</div>
      <div style="font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:8px; font-weight:700;">Vignone Red 3D — Piazzola 1</div>
      <div class="ranking-card">
        <div class="rank-badge">1</div>
        <div class="rank-info">
          <div class="rank-name">Marco Rossi</div>
          <div class="rank-meta">FIARC-2024-001 • 4/14</div>
        </div>
        <div class="rank-score">248</div>
      </div>
      <div class="ranking-card">
        <div class="rank-badge">2</div>
        <div class="rank-info">
          <div class="rank-name">Anna Verdi</div>
          <div class="rank-meta">FIARC-2024-002 • 4/14</div>
        </div>
        <div class="rank-score">235</div>
      </div>
      <div class="ranking-card">
        <div class="rank-badge">3</div>
        <div class="rank-info">
          <div class="rank-name">Luca Bianchi</div>
          <div class="rank-meta">FIARC-2024-003 • 3/14</div>
        </div>
        <div class="rank-score">219</div>
      </div>
    </div>
    
    <div class="beta-screen">
      <div class="stat-box">
        <div class="stat-label">Personal Best</div>
        <div class="stat-value">267</div>
        <div class="stat-sub">Vignone Red 3D, agosto 2024</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Media questo anno</div>
        <div class="stat-value">241</div>
        <div class="stat-sub">Su 12 gare • +3% trend</div>
      </div>
      <div style="font-size:0.7rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin:16px 0 10px; font-weight:700;">Storico gare (da Firestore)</div>
      <div class="diario-entry">
        <div class="diario-date">08 AUG 2024</div>
        <div class="diario-gara">Vignone Red 3D</div>
        <div class="diario-score">
          <div class="diario-score-item">
            <div class="diario-score-label">Totale</div>
            <div class="diario-score-val">248</div>
          </div>
          <div class="diario-score-item">
            <div class="diario-score-label">Pos.</div>
            <div class="diario-score-val">1°</div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="beta-screen">
      <div class="info-box">✓ Sincro pattuglia in tempo reale (Firestore listener)</div>
      <div class="sync-phone">
        <div class="sync-header">
          <div class="sync-dot"></div>
          <span>Tu (Marco)</span>
        </div>
        <div class="sync-input">
          <input type="number" id="syncVal1" placeholder="es. 50">
          <button onclick="updateSyncScore(1)">Invia</button>
        </div>
      </div>
      <div class="sync-phone">
        <div class="sync-header">
          <div class="sync-dot"></div>
          <span>Anna</span>
        </div>
        <div style="padding:8px; background:var(--bg-panel); border-radius:8px; font-size:0.9rem; color:var(--cream);">
          <strong>Ultimo punteggio:</strong> <span id="syncVal2">48</span> pt
          <br><span style="font-size:0.7rem; color:var(--muted);">ricevuto 1 sec fa</span>
        </div>
      </div>
      <div class="total-display">
        <div class="total-label">Totale Piazzola</div>
        <div class="total-value" id="syncTotal">98</div>
      </div>
      <div class="info-box" style="border-left-color:var(--success);">💡 I punteggi sono salvati in Firestore. Offline-first: continua offline e sincronizza dopo.</div>
    </div>
    
    <button class="btn btn-block" style="margin-top:16px;" onclick="currentScreen='home'; render()">Torna al Menu</button>
  </div>
  `;
}

function switchBetaTab(idx){
  document.querySelectorAll('.beta-tab button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.beta-screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.beta-tab button')[idx].classList.add('active');
  document.querySelectorAll('.beta-screen')[idx].classList.add('active');
}

function updateSyncScore(phone){
  if(phone === 1){
    const val = document.getElementById('syncVal1').value;
    if(!val) return;
    syncPattuglia.telefono1 = parseInt(val);
  } else {
    syncPattuglia.telefono2 = parseInt(Math.random() * 50);
  }
  syncPattuglia.lastUpdate = new Date();
  document.getElementById('syncVal2').textContent = syncPattuglia.telefono2;
  document.getElementById('syncTotal').textContent = syncPattuglia.telefono1 + syncPattuglia.telefono2;
}

function handleLogin(){
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass) { alert('Completa i campi'); return; }
  auth.signInWithEmailAndPassword(email, pass).catch(e => alert('Errore: ' + e.message));
}

function handleRegister(){
  const nome = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const pass = document.getElementById('regPass').value;
  const tessera = document.getElementById('regTessera').value;
  
  if(!nome || !email || !pass) { alert('Completa nome, email, password'); return; }
  if(pass.length < 6) { alert('Password minimo 6 caratteri'); return; }
  
  auth.createUserWithEmailAndPassword(email, pass)
    .then(cred => {
      return db.collection('users').doc(cred.user.uid).set({
        email: email,
        nome: nome,
        tessera: tessera || null,
        adminTester: false,
        createdAt: new Date()
      });
    })
    .then(() => { alert('Registrazione riuscita! Accedi ora.'); currentScreen='home'; render(); })
    .catch(e => alert('Errore: ' + e.message));
}

function handleLogout(){
  auth.signOut().then(() => { user = null; FEATURES_BETA = false; currentScreen='home'; render(); });
}

function render(){
  let html = '';
  
  if(!user){
    if(currentScreen === 'register'){
      html = renderRegisterScreen();
    } else {
      html = renderLoginScreen();
    }
  } else {
    if(currentScreen === 'streaming'){
      html = renderStreamingScreen();
    } else {
      html = renderHomeScreen();
    }
  }
  
  document.getElementById('app').innerHTML = html;
}

initAuthFlow();
</script>
</body>
</html>
