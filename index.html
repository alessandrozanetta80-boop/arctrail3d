/* ---------- IL CAMPO CON L'OCCHIO ----------
   Nascondere quello che si scrive protegge da chi guarda alle spalle. Al
   banco iscrizioni di una gara, in piedi, col telefono in una mano e i guanti
   nell'altra, alle spalle non c'e' nessuno: l'unica cosa da cui quei pallini
   proteggono e' la persona da se stessa, e non e' un buon affare. Chi sbaglia
   una lettera scopre solo dopo che l'ha sbagliata, e non sa dove.
   Quindi si sceglie: parte coperta, e l'occhio la scopre.
   L'occhio e' un tasto vero alto quanto il campo, non un'iconcina appoggiata
   sopra: con un dito guantato un bersaglio da venti pixel non si prende. */
.campo-pw{ position:relative; }
.campo-pw input{ padding-right:var(--hit); }
.campo-pw .occhio-pw{
display:flex; align-items:center; justify-content:center;
position:absolute; top:0; right:0; bottom:0; width:var(--hit);
background:none; border:none; padding:0; cursor:pointer;
color:var(--text-3); border-radius:var(--r-sm);
transition:color var(--dur-2) var(--ease); }
.campo-pw .occhio-pw:hover{ color:var(--text-1); }
.campo-pw .occhio-pw:focus-visible{ outline:none; box-shadow:var(--focus-ring); }
.campo-pw .occhio-pw.acceso{ color:var(--brand-soft); }
.campo-pw.in-mezzo{ max-width:280px; margin:8px auto 0; }
.campo-pw.in-mezzo input{ text-align:center; padding-left:var(--hit); }

/* ---------- CENTRO NOTIFICHE ----------
   Era tutto scritto in linea dal JS: dodici `style=`, che il guardiano conta
   e che nessun tema puo' correggere. Qui il disegno torna nel foglio.
   La riga che PORTA da qualche parte si distingue da quella che informa e
   basta: cursore, freccia, e una riga in fondo che dice dove va. Un aggancio
   che non si vede non e' un aggancio — la volta dopo nessuno ci prova. */
.notif-riga{
position:relative; border:1px solid var(--line); background:transparent;
border-radius:var(--r-sm); padding:12px; margin-bottom:8px; }
.notif-riga.nuova{ border-color:var(--accent-soft); background:var(--bg-panel-2); }
.notif-riga.apribile{ cursor:pointer; transition:border-color var(--dur-2) var(--ease); }
.notif-riga.apribile:hover{ border-color:var(--accent-soft); }
.notif-riga.apribile:focus-visible{ outline:none; box-shadow:var(--focus-ring); }
.notif-via{
position:absolute; top:0; right:0; width:var(--hit); height:var(--hit);
display:flex; align-items:center; justify-content:center;
background:none; border:none; padding:0; cursor:pointer;
color:var(--text-3); font-size:var(--t-lg); line-height:1; }
.notif-via:hover{ color:var(--text-1); }
.notif-titolo{ font-size:var(--t-sm); font-weight:600; padding-right:var(--hit); }
.notif-riga.nuova .notif-titolo{ font-weight:800; }
.notif-testo{ font-size:var(--t-sm); line-height:1.4; margin-top:4px; }
.notif-quando{ font-size:var(--t-xs); color:var(--text-3); margin-top:4px; }
.notif-vai{
display:flex; align-items:center; gap:4px; margin-top:8px;
font-size:var(--t-xs); font-weight:700; color:var(--accent-soft); }
.notif-vuoto{ font-size:var(--t-sm); color:var(--text-3); }
.notif-sub{ font-size:var(--t-sm); color:var(--text-3); margin-bottom:12px; }
.notif-azioni{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
/* Una schermata che si apre sopra il menu: respiro in fondo, e i tasti che
   ci stanno appesi sotto la scheda non si toccano fra loro. */
.sotto-schermo{ padding-bottom:24px; }
.sotto-schermo > .btn{ margin-top:8px; }
/* `.pericolo` esisteva solo per i tasti della barra: sul tasto normale il
   colore veniva riscritto a mano in linea, due volte, con lo stesso valore. */
.btn.pericolo{ color:var(--danger); border-color:var(--danger); }

/* ---------- PREPARA GARA ----------
   Sette campi di questa schermata erano scritti a mano dal JS, e ognuno
   RIDISEGNAVA da capo il campo che il foglio di stile definisce gia' piu' in
   alto: fondo piu' scuro, bordo piu' sottile, padding fuori scala e - la cosa
   che conta - nessun min-height:var(--hit). Erano campi SOTTO i 44px, in
   l'unica schermata che si compila in piedi al banco iscrizioni, col telefono
   in una mano. Non erano una variante voluta: erano il componente comune,
   peggiorato in silenzio, sette volte.
   Quindi qui NON nasce un componente nuovo: quegli stili se ne vanno e basta,
   e i campi tornano quelli di tutta l'app. Restano solo le vere eccezioni -
   una larghezza, un'altezza minima, una regola di flusso. */
/* Il selettore porta anche il tipo di campo di proposito. La regola comune
   piu' in alto e' scritta come input[type=number] - un attributo, che pesa
   quanto una classe piu' un elemento. Una classe da sola PERDE, e la
   larghezza tornerebbe al 100% senza che nessuno se ne accorga qui. */
input[type=number].pg-campo-num{ width:96px; }
input[type=text].pg-campo-nome{ width:auto; flex:1 1 120px; }
textarea.pg-campo-testo{ min-height:120px; }
.pg-campo-riga{ margin-bottom:var(--s-3); }
.pg-campo-etichetta{ display:block; font-size:var(--t-xs); font-weight:700;
color:var(--text-3); text-transform:uppercase; letter-spacing:.05em;
margin-bottom:var(--s-1); }

.pg-riga{ display:flex; flex-wrap:wrap; gap:var(--s-2); margin-bottom:var(--s-2); }
.pg-riga-larga{ flex:1 1 100%; }
.pg-riga-num{ display:flex; align-items:center; flex-wrap:wrap; gap:var(--s-3);
margin-bottom:var(--s-3); }
.pg-riga-num span{ font-size:var(--t-sm); color:var(--text-3); }
.pg-blocco{ margin-bottom:var(--s-3); }
.pg-esiti{ margin-top:var(--s-2); display:flex; flex-wrap:wrap; gap:var(--s-2); }
.pg-nota{ font-size:var(--t-xs); color:var(--text-3); margin:var(--s-1) 0; }
/* Stessa frase, stesso componente, due schermate: la ricerca per username
   vive sia in Arcieri sia in Prepara gara. Il nome non porta il prefisso di
   nessuna delle due, perche' non appartiene a nessuna delle due. */
.cerca-vuoto{ font-size:var(--t-xs); color:var(--text-3); padding:var(--s-1) 0; }
.pg-nota-stacco{ margin:var(--s-3) 0 var(--s-1); }
.pg-conto{ font-size:var(--t-sm); color:var(--text-3); margin-bottom:var(--s-2); }
.pg-conto b{ color:var(--gold-role); }
.pg-avviso{ font-size:var(--t-xs); color:var(--clay); margin:0 0 var(--s-4); }
.pg-stacco-sotto{ margin-bottom:var(--s-2); }
.pg-stacco-importa{ margin:var(--s-2) 0 var(--s-4); }
.pg-stacco-sopra{ margin-top:var(--s-4); }
.pg-stato{ font-size:var(--t-sm); color:var(--text-3); margin-top:var(--s-2);
text-align:center; }
.pg-titolo-squadre{ font-size:var(--t-sm); color:var(--gold-role);
margin:var(--s-4) 0 var(--s-2); }
.pg-squadra{ font-size:var(--t-sm); background:var(--surface-2);
border:1px solid var(--border); border-radius:var(--r-sm);
padding:var(--s-2) var(--s-3); margin-bottom:var(--s-2); }
.pg-squadra b{ color:var(--gold-role); }
.pg-azioni{ display:flex; gap:var(--s-3); }
.pg-azioni .btn-primary{ flex:1; }

/* La riga dell'iscritto e' una RIGA, non una scheda: vale qui la regola gia'
   scritta per il Profilo. Era un rettangolo col suo fondo, il suo bordo e il
   suo raggio, dentro una scheda che ha gia' fondo, bordo e raggio: due
   scatole uguali annidate non dicono niente in piu' e non aiutano a scorrere
   l'elenco, che e' l'unica cosa che devono fare. Resta il filo di
   separazione. Il tasto che toglie l'iscritto era alto sedici pixel: adesso
   e' un bersaglio da 44, perche' cancellare la persona sbagliata dalla lista
   iscritti non e' un errore che si annulla con un tocco. */
.pg-elenco-iscritti{ margin-bottom:var(--s-3); border-top:1px solid var(--border); }
.iscritto-row{ display:flex; align-items:center; gap:var(--s-2);
padding:var(--s-1) 0; border-bottom:1px solid var(--border); }
.iscritto-nome{ flex:1; font-size:var(--t-sm); }
.iscritto-user{ color:var(--brand-soft); }
.iscritto-slegato{ color:var(--text-3); font-size:var(--t-xs); }
.iscritto-rm{ background:none; border:none; color:var(--text-3); cursor:pointer;
font-family:inherit; font-size:var(--t-md); line-height:1;
min-width:var(--hit); min-height:var(--hit); border-radius:var(--r-sm); }
.iscritto-rm:hover{ color:var(--danger-role); }

/* La divisione, la tessera, il codice di Compagnia.
   Sono i quattro dati che l'Art. 18.j vuole nella classifica da consegnare:
   se non si scrivono qui non esistono nel documento, e li' non si recuperano
   piu'. Quindi stanno a vista, non dietro a un tocco: un campo che si apre
   solo se lo cerchi resta vuoto, e il vuoto si scopre alla premiazione.
   L'etichetta pero' non si ripete sessanta volte. I due menu si presentano da
   soli - la voce vuota porta il nome del menu - e i due numeri si riconoscono
   dalla forma: cifre la tessera, due cifre e quattro lettere il codice, che
   per giunta risponde col nome della compagnia. Il nome per esteso lo sente
   chi non vede, con aria-label. */
.iscritto-row{ display:block; padding:var(--s-2) 0;
border-bottom:1px solid var(--border); }
.iscritto-capo{ display:flex; align-items:center; gap:var(--s-2); }
.iscritto-dati{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
gap:var(--s-2); margin-top:var(--s-2); }
.iscritto-dati input, .iscritto-dati select{ font-size:var(--t-sm);
padding:var(--s-2) var(--s-3); }
.iscritto-dati input{ font-family:var(--font-num);
font-variant-numeric:tabular-nums slashed-zero; }
/* Il nome della compagnia sta sotto ai due numeri e prende tutta la riga:
   e' una risposta, non un campo. */
.iscritto-club{ grid-column:1 / -1; font-size:var(--t-xs); color:var(--text-3); }
.iscritto-club.ignoto{ color:var(--danger-role); }
/* La coppia che finisce in classifica, accanto al nome. Chi non ce l'ha
   intera dice "Ospite" a chiare lettere: un vuoto silenzioso lo scopri alla
   premiazione. Colore d'attenzione, non d'allarme - Ospite e' una condizione
   prevista dal regolamento, non un errore. */
.divisione-sigla{ font-size:var(--t-xs); font-weight:800; letter-spacing:.06em;
padding:var(--s-1) var(--s-2); border-radius:var(--r-pill); white-space:nowrap;
background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); }
.divisione-sigla.ospite{ color:var(--clay); }

/* Il resoconto dell'importazione: non una conferma da premere, un foglio che
   resta li'. Le righe non capite si mostrano una per una - un'importazione che
   ne perde tre su cento in silenzio e' peggio di una che non parte, perche'
   l'errore si scopre in gara, quando manca una persona. */
.pg-esito{ margin:var(--s-2) 0 var(--s-4); padding:var(--s-3);
border:1px solid var(--border); border-radius:var(--r-sm);
background:var(--surface-2); }
.pg-esito-conti{ font-size:var(--t-sm); color:var(--text-2); }
.pg-esito-dubbie{ font-size:var(--t-xs); color:var(--clay); font-weight:700;
margin-top:var(--s-2); }
.pg-esito-riga{ font-size:var(--t-xs); color:var(--text-3);
font-family:var(--font-num); padding:var(--s-1) 0; }

/* ══════════════════ RIFINITURA DA COMPUTER (agosto 2026) ══════════════════
   Tutto quello che segue vive dentro @media (min-width:900px): sul telefono
   e sul tablet in verticale non cambia una virgola.
   Serve a dare al desktop una forma sua, invece della colonna del telefono
   lasciata in mezzo allo schermo.
   Per tornare indietro basta cancellare fino a "FINE RIFINITURA". */
@media (min-width:900px){

/* ── 1. Il foglio ────────────────────────────────────────────────────────
   Una fascia chiara sotto la colonna: senza, i riquadri bianchi galleggiano
   nel vuoto e mezzo schermo sembra abbandonato. */
body{
  background:
    linear-gradient(90deg,
      transparent calc(50% - 610px),
      color-mix(in srgb, var(--surface-1) 55%, transparent) calc(50% - 545px),
      color-mix(in srgb, var(--surface-1) 55%, transparent) calc(50% + 545px),
      transparent calc(50% + 610px)),
    radial-gradient(ellipse 1100px 620px at 10% -10%, var(--wash-1), transparent 62%),
    radial-gradient(ellipse 900px 560px at 105% 8%, var(--wash-2), transparent 58%),
    radial-gradient(ellipse 1000px 700px at 50% 116%, var(--wash-3), transparent 62%),
    var(--surface);
}
html{ scroll-behavior:smooth; }
html.no-smooth{ scroll-behavior:auto; }
#app{ max-width:1060px; padding:20px 34px 76px; }
#app.narrow{ max-width:660px; }

/* ── 2. La testata: un'insegna, non una barra grigia ─────────────────── */
/* L'insegna era un blocco verde scuro sopra una pagina chiara: due meta'
   diverse. Ora e' chiara come tutto il resto, e il marchio si tiene il verde
   pieno — cosi' il presidio resta, ma non e' piu' la testata a gridare. */
header.top{
  min-height:60px; padding:8px 12px 8px 8px; gap:16px; border-radius:16px;
  background:var(--navbar-bg); border:1px solid var(--navbar-line); box-shadow:var(--elev-2);
  margin-bottom:20px; position:sticky; top:12px; z-index:70; isolation:isolate;
}
header.top::after{ display:none; }
header.top .brand-title{ font-size:1.1rem; font-weight:700; letter-spacing:0.13em; color:#FFFFFF; }
/* I tre bottoni arancioni in fila erano la cosa piu' pesante della pagina:
   ora sono pastiglie di vetro sul verde scuro, e resta arancione solo il
   comando vero e proprio ("Cambia"). */
header.top .home-btn{
  height:44px; border-radius:12px;
  background:var(--surface-2); border:1.5px solid var(--border-strong); color:var(--text-2);
  transition:background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
}
header.top .home-btn:hover{
  background:color-mix(in srgb, var(--brand) 10%, var(--surface-1));
  border-color:var(--brand); color:var(--brand); transform:translateY(-1px);
}
header.top .home-btn.small{
  background:var(--clay); border-color:transparent; color:#fff; font-weight:700;
  box-shadow:0 8px 18px -10px color-mix(in srgb, var(--clay) 90%, transparent);
}
header.top .home-btn.small:hover{ background:color-mix(in srgb, var(--clay) 88%, white); border-color:transparent; }

/* ── 3. Le sezioni: non piu' una barra a se', ma il centro della testata ── */
.tabbar-wide button > svg{ transition:transform var(--dur-2) var(--ease); }
.tabbar-wide button:hover > svg{ transform:translateY(-1px); }

/* ── 4. I riquadri ───────────────────────────────────────────────────── */
.card{
  border-radius:18px; padding:22px 24px; margin-bottom:18px;
  border:1px solid var(--border);
  border-top:2px solid color-mix(in srgb, var(--gold-role) 42%, transparent);
  box-shadow:var(--elev-3);
  transition:box-shadow var(--dur-2) var(--ease);
}
h2.section-title{
  display:flex; align-items:center; gap:12px;
  font-size:0.72rem; letter-spacing:0.18em; margin-bottom:16px;
}
h2.section-title::after{
  content:""; flex:1 1 auto; height:1px;
  background:linear-gradient(90deg, var(--line), transparent);
}

/* ── 5. I comandi diventano schede affiancate ────────────────────────────
   In colonna, uno sotto l'altro, sprecavano mezzo schermo. La griglia si
   applica solo ai riquadri di soli pulsanti: dove ci sono campi da
   compilare resta tutto incolonnato. */
.menu-cols .card:has(> .menu-btn):not(:has(input)):not(:has(select)):not(:has(textarea)){
  display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px; align-items:stretch;
}
.menu-cols .card:has(> .menu-btn):not(:has(input)):not(:has(select)):not(:has(textarea)) > h2.section-title,
.menu-cols .card:has(> .menu-btn):not(:has(input)):not(:has(select)):not(:has(textarea)) > div{
  grid-column:1 / -1; margin-bottom:0;
}
.menu-cols .card > .menu-btn{
  flex-direction:column; align-items:flex-start; justify-content:flex-start;
  gap:14px; padding:22px 20px; min-height:150px; margin-bottom:0;
  border-radius:16px; text-align:left;
  transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease, border-color .18s ease;
}
.menu-cols .card > .menu-btn .menu-icon{
  width:48px; height:48px; border-radius:15px;
  display:inline-flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, currentColor 13%, transparent);
  border:1px solid color-mix(in srgb, currentColor 30%, transparent);
}
.menu-cols .card > .menu-btn .menu-txt{ font-size:1.12rem; line-height:1.2; }
.menu-cols .card > .menu-btn .menu-sub{ font-size:0.78rem; line-height:1.5; margin-top:7px; font-weight:400; }
.menu-cols .card > .menu-btn:hover{
  transform:translateY(-3px); box-shadow:0 20px 34px -22px rgba(30,45,34,0.55);
  border-color:color-mix(in srgb, currentColor 62%, transparent);
}

/* ── 6. Bottoni ──────────────────────────────────────────────────────────
   Il verde pieno largo quanto la pagina era la cosa piu' triste della
   schermata: ora e' un comando di misura normale. */
.btn{
  border-radius:12px;
  transition:transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s ease,
             background .16s ease, border-color .16s ease, color .16s ease;
}
.btn:not(:disabled):hover{ filter:none; }
.btn-primary:hover{
  background:color-mix(in srgb, var(--brand) 88%, white); transform:translateY(-1px);
}
.menu-cols .card > .btn.btn-primary.btn-block{ max-width:380px; }
.menu-cols > .btn.btn-ghost.btn-block{ max-width:340px; margin:0 auto; display:flex; }
.btn-ghost:hover{
  background:var(--surface-1); border-color:var(--brand-soft); color:var(--brand);
  transform:translateY(-1px);
}

/* ── 7. Campi di testo: erano tutti diversi tra loro ─────────────────────
   email, telefono e note non ereditavano niente e restavano piccoli
   accanto ai campi normali. */
input[type=text], input[type=number], input[type=email], input[type=tel],
input[type=password], input[type=search], input[type=date], input[type=time], textarea{
  width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface-1); color:var(--text-1); font-size:var(--t-md); font-family:inherit;
  transition:border-color var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
}

/* ── 8. Respiro e dettagli ───────────────────────────────────────────── */
.footer-note{ margin-top:28px; font-size:0.74rem; }
.empty-hint{ font-size:0.88rem; padding:14px 0; }
.archer-row, .timeline-row, .cp-class-row{ transition:border-color .15s ease, background .15s ease; }
.archer-row:hover, .cp-class-row:hover{ border-color:var(--border-strong); }
.stat-box{ padding:14px 8px; border-radius:14px; }
.stat-box .stat-num{ font-size:1.7rem; }
.piazz-card{ border-radius:var(--r-xl); box-shadow:var(--elev-2); }
table.score-table{ font-size:0.9rem; }
table.score-table th{ letter-spacing:.09em; }
table.score-table tbody tr{ transition:background .15s ease; }
table.score-table tbody tr:hover{ background:color-mix(in srgb, var(--brand) 6%, transparent); }

}
/* ══════════════════ FINE RIFINITURA ══════════════════ */
/* Le 5 sezioni prendono una riga tutta loro dentro l'insegna. Prima
   c'erano due casi — sotto e sopra i 1040px — e quindi due numeri da
   azzeccare a ogni modifica. Ma #app e' largo al massimo 1060px: la riga
   unica non ci sta mai davvero, perche' allargando la finestra cresce lo
   schermo e non la colonna. Un caso solo: marchio e comandi in alto,
   sezioni sotto, uguale da 760px in su.
   Deve stare dopo i blocchi qui sopra per avere la meglio. */
@media (min-width:760px){
header.top .brandblock{ order:0; }
header.top .head-actions{ order:1; }
header.top .tabbar-wide{ order:2; flex-basis:100%; }
}
/* ── Pannello admin: elenco utenti ──────────────────────────────────────
   Solo l'admin vede questa roba: testi in italiano, niente t().          */
.adm-tot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 12px;}
.adm-tot > div{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 3px;text-align:center;}
.adm-tot b{display:block;font-size:1.15rem;line-height:1.1;}
.adm-tot span{display:block;font-size:0.58rem;color:var(--muted);margin-top:3px;letter-spacing:0.04em;line-height:1.25;}
.adm-search{width:100%;font-size:0.85rem;padding:8px 10px;margin-bottom:8px;}
.adm-filtri{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.adm-f{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:0.74rem;font-weight:700;cursor:pointer;white-space:nowrap;}
.adm-f.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.adm-row{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg-panel-2);}
.adm-row.open{border-color:var(--accent-soft);}
.adm-head{display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;}
.adm-ini{flex:0 0 34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.78rem;}
.adm-who{flex:1;min-width:0;}
.adm-name{font-weight:700;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.adm-sub{font-size:0.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.adm-badge{font-size:0.58rem;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;margin-left:4px;letter-spacing:0.03em;}
.adm-chev{color:var(--muted);font-size:0.95rem;margin-left:6px;transition:transform .18s;}
.adm-row.open .adm-chev{transform:rotate(90deg);}
.adm-body{display:none;padding:0 10px 10px;}
.adm-row.open .adm-body{display:block;}
.adm-grp{font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 0 2px;}
.adm-dl{display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line);}
.adm-dl > div{padding:6px 0;border-bottom:1px solid var(--line);min-width:0;font-size:0.8rem;line-height:1.4;}
.adm-dl .k{color:var(--muted);padding-right:12px;white-space:nowrap;font-size:0.74rem;}
.adm-dl .v{word-break:break-word;}
.adm-si{color:var(--accent-soft);font-weight:700;}
.adm-no{color:var(--bark);font-weight:700;}
.adm-nd{color:var(--text-3);}
.adm-note{width:100%;font-size:0.8rem;padding:7px 9px;}
.adm-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.adm-act .btn{flex:1;min-width:96px;}
@media(min-width:700px){.adm-dl{grid-template-columns:180px 1fr;}}
@media(prefers-reduced-motion:reduce){.adm-chev{transition:none;}}
/* ══════════════ RIFINITURA, NATA DAL TEMA CHIARO (15/08/2026) ══════════════
   ATTENZIONE, IL COMMENTO DI PRIMA MENTIVA. Diceva «vale solo con
   body.theme-light: lo scuro non lo tocca nemmeno di striscio», e i selettori
   qui sotto non sono qualificati per tema (`h2.section-title{…}`): valgono
   dappertutto. Non fa danno — usano ruoli, quindi il valore giusto lo prende
   ogni tema da solo — ma un commento che mente e' peggio di nessun commento,
   perche' chi lo legge decide sulla base di quello che c'e' scritto. Corretto
   il commento, non il codice: il codice era giusto, era la descrizione a
   essere sbagliata *(16/08/2026)*.
   Queste regole sono NATE guardando il tema chiaro; restano valide in tutti e
   due. Per tornare indietro basta cancellare fino a
   "FINE RIFINITURA CHIARO". */

/* Pagina #ECEDE6 contro riquadro bianco: prima ballavano il 6% di luminanza,
   al sole erano la stessa cosa. L'ombra e' quasi solo un velo sotto. */
/* Era troppo tenue per fare da titolo di sezione. */
h2.section-title{ color:var(--text-2); }

/* I "fantasma" (Il mio diario, Scrivi una segnalazione...) erano bianco su
   bianco con un filo di bordo: si leggevano come disattivati. */

/* Il marchio si tiene il verde pieno: e' l'unico blocco di colore forte
   della testata, e da lontano basta quello per riconoscere l'app. */
/* Il marchio si tiene il verde pieno in tutti i temi: e' l'unico blocco di
   colore forte dell'insegna, e da lontano basta quello per riconoscere l'app.
   Era scritto solo per il chiaro, quindi sullo scuro spariva. */
header.top .brandblock{
background:linear-gradient(140deg,var(--green-700) 0%,var(--green-900) 100%);
padding:var(--s-1) 14px var(--s-1) var(--s-1); border-radius:var(--r-lg);
}
header.top .brand-title{ color:#FFFFFF; }

/* ── LE CINQUE SEZIONI ────────────────────────────────────────────────────
   Tutto in CSS, niente stile in linea, zero !important. La voce attiva ha
   una pastiglia PIENA: al sole il solo cambio di colore del testo non si
   vede. L'inchiostro della pastiglia e' un token (--navbar-pill-ink), quindi
   il caso "verde su verde" — la sezione aperta che era l'unica illeggibile —
   non e' piu' nemmeno esprimibile. */
.tabbar{ display:flex; z-index:60; }
.tabbar-bottom{ position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
border-top:2px solid var(--navbar-on); background:var(--navbar-bg);
box-shadow:0 -10px 26px var(--navbar-shadow); padding-bottom:env(safe-area-inset-bottom); }
.tabbar button{ background:none; border:1px solid transparent; cursor:pointer;
font-family:inherit; color:var(--navbar-fg);
transition:color var(--dur-2) var(--ease), background var(--dur-2) var(--ease); }
.tabbar .tab-lbl{ line-height:1.1; }
/* in fondo, sul telefono: icona sopra, parola sotto */
.tabn{ flex:1; min-height:var(--hit); padding:7px var(--s-1) 9px;
display:flex; flex-direction:column; align-items:center; gap:3px; }
.tabn .tab-pill{ display:flex; align-items:center; justify-content:center;
width:46px; height:29px; border-radius:15px; border:1px solid transparent; }
.tabn .tab-lbl{ font-size:var(--t-xs); font-weight:600; text-align:center; }
.tabn.on{ color:var(--navbar-pill-ink); }
.tabn.on .tab-pill{ background:var(--navbar-pill); border-color:var(--navbar-on); }
.tabn.on .tab-lbl{ font-weight:800; color:var(--navbar-on); }
/* in riga, dentro l'insegna: la pastiglia E' il pulsante intero */
.tabw{ flex:0 1 auto; min-width:0; min-height:var(--hit); padding:6px 11px;
border-radius:var(--r-md); display:flex; align-items:center; gap:7px; }
.tabw .tab-lbl{ font-size:var(--t-sm); font-weight:600; white-space:nowrap; }
.tabw.on{ background:var(--navbar-pill); border-color:var(--navbar-on); color:var(--navbar-pill-ink); }
.tabw.on .tab-lbl{ font-weight:800; }
@media (hover:hover) and (pointer:fine){
.tabbar button:not(.on):hover{ background:var(--navbar-hover); color:var(--text-1); }
}

/* ══════════════ FINE RIFINITURA CHIARO ══════════════ */

/* ═══════════════ TRANSIZIONI DI SCHERMATA ═══════════════
   L'insegna in cima ha un nome suo: il browser la riconosce come LA STESSA
   COSA prima e dopo, quindi resta ferma mentre sotto cambia il contenuto.
   E' la differenza fra una pagina che si ricarica e un oggetto che risponde:
   la cornice non deve mai sfarfallare. */
header.top{ view-transition-name:app-header; }
::view-transition-old(root),
::view-transition-new(root){ animation-duration:var(--dur-3); animation-timing-function:var(--ease); }
::view-transition-old(app-header),
::view-transition-new(app-header){ animation:none; mix-blend-mode:normal; }

/* ═══════════════ IL TESTO GRANDE NON DEVE ROMPERE NIENTE ═══════════════
   Chi ha ingrandito il testo nelle impostazioni del telefono (e sul percorso
   e' la norma, non l'eccezione) trovava i tasti alti 92px con dentro due
   righe che non ci stavano. L'altezza diventa un minimo, non una gabbia. */
.quick-btn{ height:auto; min-height:92px; }
.menu-btn{ min-height:var(--hit); }

/* ═══════════════ QUALITA' DI LETTURA ═══════════════ */
h2.section-title, .onboard-title, .editorial-title, .empty-state-title{ text-wrap:balance; }
.menu-sub, .editorial-body, .empty-state-body, .rules-panel{ text-wrap:pretty; }
/* La barra di scorrimento che appare e sparisce faceva saltare la colonna
   di qualche pixel a ogni cambio di schermata. */
html{ scrollbar-gutter:stable; }

/* ═══════════════ RIDUCI MOVIMENTO ═══════════════
   Vale anche per le transizioni di schermata, che il blocco storico piu'
   sopra non poteva conoscere. */
@media (prefers-reduced-motion:reduce){
::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*){ animation:none !important; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   LA PISTA — la schermata del percorso, rifatta
   ───────────────────────────────────────────────────────────────────────────
   La regola che tiene in piedi tutto: QUESTA SCHERMATA NON SCORRE.
   Il gesto che si ripete 288 volte in un percorso da 24 piazzole in quattro
   non puo' stare in fondo a una pagina lunga: i tasti sono l'ultima cosa in
   basso, e sopra di loro non c'e' niente da scorrere. Sagoma e classifica
   diventano pannelli che occupano lo spazio centrale — quando sono aperti i
   tasti restano dove sono, quindi la loro posizione e' un contratto.

   Il respiro in mezzo (.pista-spazio) non e' decorazione: assorbe i nomi
   lunghi, il quinto e sesto arciere e la riga in piu' delle modalita' a tre
   frecce senza spostare niente. E' cio' che rende il contratto mantenibile.
   ═══════════════════════════════════════════════════════════════════════════ */
/* ── "non scorre" era una speranza, adesso e' una struttura (15/08/2026) ──
   min-height:100dvh vuol dire: se il contenuto cresce, io cresco. E c'era un
   caso che lo innescava SEMPRE: header.top ha margin-top:env(safe-area-inset-top),
   che in PWA su iPhone vale ~47px, mentre 100dvh la safe area la contiene gia'.
   La colonna misurava 100dvh + 47px, quindi la tastiera usciva dallo schermo e
   compariva la barra di scorrimento — sulla schermata che esiste per non averla.

   height (non min-height) + overflow:hidden. La safe area passa nel padding di
   #app invece che nel margine della testata, cosi' sta DENTRO i 100dvh.
   E una sola regione puo' cedere: la scena. Se il testo di sistema e'
   ingrandito, si comprime quella — non la tastiera, che e' il contratto. */
body.schermo-percorso{ height:100dvh; overflow:hidden; }
body.schermo-percorso #app{
display:flex; flex-direction:column; height:100%;
/* solo in alto: quella in basso ce l'ha gia' il body, e contarla due volte
   e' esattamente il bug che questo blocco serve a chiudere. */
padding-top:calc(var(--s-3) + env(safe-area-inset-top));
padding-bottom:var(--s-3); }
body.schermo-percorso header.top{ margin-top:0; }
.pista{ flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
/* Lo spazio che avanza adesso ospita l'andamento. Ancorato in basso e
   ritagliato: quando lo spazio si stringe sparisce dall'alto, cioe' prima le
   piazzole vecchie e per ultimo il totale, che e' quello che conta. */
.pista-spazio{ flex:1 1 auto; min-height:var(--s-3); display:flex;
flex-direction:column; justify-content:flex-end; overflow:hidden; }

/* ── LA FILIGRANA NON C'E' PIU' (15/08/2026) ──
   Due prove sul campo, due bocciature, e la seconda dopo una correzione fatta
   apposta. La prima volta il bersaglio finiva al centro geometrico dello
   schermo ed era l'elemento piu' grande della pagina. E' stato spostato
   nell'angolo e ingrandito perche' due bordi lo tagliassero sempre: alla
   seconda prova era di nuovo la cosa piu' grande, solo storta.

   La ragione e' strutturale e va scritta, altrimenti fra due mesi qualcuno la
   rimette. .pista-spazio E' LA REGIONE PIU' GRANDE DELLO SCHERMO per
   costruzione: assorbe tutto l'avanzo perche' la tastiera resti in fondo. Un
   disegno messo li' dentro non puo' essere piccolo, qualunque siano le sue
   misure, perche' e' l'unica cosa dentro il rettangolo piu' grande. Nessun
   valore di opacita' o di posizione risolve un problema di gerarchia.

   E la prova del nove e' quella che le note usano gia' altrove: si scriva
   cosa fa. Non dice il punteggio, non dice il turno, non dice dove sei. Era
   decorazione — la sola cosa nell'app senza un mestiere — su una schermata
   che si guarda per due ore. Toccava a lei andarsene per prima.

   Lo spazio resta vuoto, e vuoto e' quello che deve essere: e' il respiro fra
   il dato in alto e il comando in basso. */


/* ── testata: il passo del giro, piccolo, dove serve ──
   La cifra della piazzola era l'elemento piu' grande dello schermo. E' l'unica
   informazione che l'arciere gia' possiede: e' dipinta sul paletto davanti a
   lui. Qui torna a essere quello che e', un contatore. */
.pista-testa{ flex:0 0 auto; margin-bottom:var(--s-3); }
.pista-passo-riga{ display:flex; align-items:center; justify-content:space-between;
gap:var(--s-2); margin-bottom:var(--s-2); }
.pista-passo{ font-size:var(--t-xs); font-weight:600; letter-spacing:.09em;
text-transform:uppercase; color:var(--text-3); }
.pista-testa .progress-track{ margin-bottom:0; }

/* ── il timer: una pastiglia, non una scatola da 140px ──
   Da fermo e' un comando che si apre. Mentre corre e' un numero che cambia
   colore. In nessuno dei due casi merita il terzo migliore dello schermo. */
.chip-timer{ display:inline-flex; align-items:center; gap:var(--s-1);
min-height:32px; padding:0 var(--s-3); border-radius:var(--r-pill);
background:var(--surface-2); border:1.5px solid var(--border-strong);
color:var(--text-2); font-family:var(--font-ui); font-size:var(--t-xs);
font-weight:700; cursor:pointer; flex:0 0 auto;
transition:background var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease); }
.chip-timer .chip-num{ font-family:var(--font-num); font-variant-numeric:tabular-nums; }
.chip-timer.corre{ background:var(--timer-run-bg); border-color:var(--timer-run-bd); color:var(--timer-run-fg); }
.chip-timer.timer-warn{ background:var(--timer-warn-bg); border-color:var(--timer-warn-bd); color:var(--timer-warn-fg); }
.chip-timer.timer-danger{ background:var(--timer-dgr-bg); border-color:var(--timer-dgr-bd); color:var(--timer-dgr-fg); }
.timer-regola{ display:flex; align-items:center; gap:var(--s-2); margin-top:var(--s-2); }
.timer-regola .timer-dur{ flex:1 1 auto; min-width:0; font-size:var(--t-lg); }

/* ── la scena: comanda quello che cambia ──
   La regola vecchia diceva: il nome e' il piu' grande, perche' e' il dato che
   cambia in continuazione ed e' l'unico che si sbaglia; il numero della
   piazzola lo sai gia', e' dipinto sul paletto. Vero — QUANDO CI SONO ALTRI.
   Da soli il nome non cambia mai, la fila dei turni non viene nemmeno
   disegnata, e l'elemento piu' grande dello schermo diventa l'unica
   informazione con valore zero: se tiri da solo sai come ti chiami. E il
   paletto non c'e' sempre: in allenamento a formato libero le piazzole le hai
   decise tu, non sono dipinte da nessuna parte.
   Quindi il protagonista dipende: da solo la PIAZZOLA, in gruppo il NOME. Il
   posto sullo schermo resta lo stesso, cambia chi lo occupa, e cambia una
   volta sola a inizio giro: la memoria muscolare non ne soffre. */
/* L'unica regione che puo' cedere. flex:0 1 auto + min-height:0 = tiene la sua
   misura naturale finche' c'e' posto, si comprime quando non ce n'e'. Cede la
   scena, mai la tastiera. */
.pista-scena{ flex:0 1 auto; min-height:0; overflow-y:auto; text-align:left; margin-bottom:0; }
.pista-arciere{ font-size:var(--t-xl); font-weight:800; line-height:1.1;
color:var(--text-1); margin:0; text-wrap:balance; }
/* Fraunces e' un carattere da titoli, con grazie e contrasto forte. Un nome
   proprio lo regge; uno username con trattino basso e cifre — "Ale_01Verb" —
   diventa la copertina di un libro. Qui il nome sta nel carattere d'interfaccia,
   e Fraunces
   resta al mestiere che queste note gli hanno dato: marchio e titoli. */
.pista-piazzola{ margin:0; }
.pista-piazzola .eti{ display:block; font-family:var(--font-ui);
font-size:var(--t-xs); font-weight:600; letter-spacing:.09em;
text-transform:uppercase; color:var(--text-3); margin-bottom:var(--s-1); }
.pista-piazzola .cifre{ display:flex; align-items:baseline; gap:var(--s-2);
font-family:var(--font-display); font-weight:700; font-size:var(--t-2xl);
line-height:1; color:var(--text-1); font-variant-numeric:tabular-nums; }
.pista-piazzola .su{ font-family:var(--font-num); font-size:var(--t-lg);
font-weight:600; color:var(--text-3); }
.pista-freccia{ font-size:var(--t-sm); color:var(--text-3); margin-top:var(--s-1); }
.pista-nota{ font-size:var(--t-xs); color:var(--danger-role); margin-top:var(--s-2); }

/* ── l'andamento: il totale e le piazzole gia' chiuse ──
   Il posto dove stava la filigrana. La differenza e' che questo si puo'
   scrivere: dice a quanto sei e come ci sei arrivato. */
.pista-andamento{ flex:0 0 auto; padding:var(--s-3) 0 var(--s-2); }
.pista-tot{ display:flex; align-items:baseline; justify-content:space-between;
gap:var(--s-3); padding-top:var(--s-2); border-top:1px solid var(--border); }
.pista-tot .eti{ font-size:var(--t-xs); font-weight:600; letter-spacing:.09em;
text-transform:uppercase; color:var(--text-3); }
.pista-tot .num{ font-family:var(--font-display); font-weight:700;
font-size:var(--t-xl); line-height:1; color:var(--gold-role); }
/* Le piazzole chiuse: numero piccolo sopra, punteggio sotto. UNA RIGA SOLA,
   le piu' recenti a destra. Andare a capo la farebbe crescere senza limite e
   tornerebbe a rubare spazio alla scena: e' l'errore appena corretto. Quello
   che non ci sta esce da sinistra, cioe' le piazzole piu' vecchie, che sono
   anche le meno interessanti. La vista completa resta la Classifica. */
.pista-fatte{ display:flex; flex-wrap:nowrap; justify-content:flex-end;
gap:var(--s-1); margin-bottom:var(--s-2); overflow:hidden; }
.pista-fatte .fatta{ flex:0 0 auto; }
.fatta{ display:inline-flex; flex-direction:column; align-items:center;
min-width:32px; padding:var(--s-1); border-radius:var(--r-sm);
background:var(--surface-2); }
.fatta i{ font-style:normal; font-size:var(--t-xs); color:var(--text-3); line-height:1; }
.fatta b{ font-size:var(--t-sm); font-weight:700; color:var(--text-1); line-height:1.3; }

/* ── i turni della piazzola: sostituiscono 95 schermate di passaggio ──
   Il cerchio tratteggiato dice "poi tocca a Sara" senza fermare nessuno. */
.pista-turni{ display:flex; gap:var(--s-2); margin-top:var(--s-3);
padding-top:var(--s-3); border-top:1px solid var(--border); }
.turno{ flex:1 1 0; min-width:0; display:flex; flex-direction:column;
align-items:center; gap:var(--s-1); }
.turno-badge{ width:var(--hit); height:var(--hit); border-radius:50%;
display:flex; align-items:center; justify-content:center;
font-family:var(--font-num); font-variant-numeric:tabular-nums;
font-weight:800; font-size:var(--t-sm);
background:var(--surface-2); border:1.5px solid var(--border); color:var(--text-3); }
.turno-badge.fatto{ background:var(--gold-200); border-color:var(--gold-400); color:var(--gold-800); }
.turno-badge.ora{ background:var(--surface-1); border:2.5px solid var(--brand); color:var(--brand); }
.turno-badge.attesa{ border-style:dashed; }
.turno-nome{ font-size:var(--t-xs); color:var(--text-3); max-width:100%;
overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.turno.ora .turno-nome{ color:var(--text-1); font-weight:700; }

/* ── le due scorciatoie ── */
/* Finche' erano due si bilanciavano. Rimasto solo, largo tutta la riga e con
   il fondo dorato, il tasto Classifica leggeva come un quinto tasto punteggio
   — e stava esattamente dove il pollice arriva per sbaglio. E' un'azione
   secondaria: torna a occupare lo spazio di un'azione secondaria, allineato a
   destra e senza fondo pieno. */
.pista-scorciatoie{ flex:0 0 auto; display:flex; justify-content:space-between;
align-items:center; gap:var(--s-2); margin-bottom:var(--s-2); }
/* Prima era largo tutta la riga col fondo dorato e leggeva come un quinto
   tasto punteggio. La correzione era andata troppo in la': senza fondo e in
   grigio chiaro spariva. PICCOLO NON VUOL DIRE INVISIBILE — un'azione
   secondaria deve avere il peso di un'azione secondaria, non di nessuna. */
.pista-scorciatoie .btn{ flex:0 0 auto; padding:var(--s-2) var(--s-3);
font-size:var(--t-sm); min-height:var(--hit); box-shadow:none;
background:color-mix(in srgb, var(--gold-role) 12%, var(--surface-1));
border:1.5px solid color-mix(in srgb, var(--gold-role) 50%, transparent);
color:var(--gold-role); font-weight:700; }
/* ── L'INTERRUTTORE DEL SOLE ───────────────────────────────────────────────
   Spento e' NEUTRO, non giallo. Accanto alla Classifica, che e' gia' dorata,
   due tinte d'oro affiancate sarebbero due etichette e nessuna notizia — la
   stessa regola per cui "Segnala" a riposo non e' rosso.
   Ma neutro non vuol dire spento: porta la parola e il bordo pieno, perche'
   e' l'unico comando dell'app che va TROVATO quando lo schermo non si legge.
   Acceso e' pieno: al sole diretto bordi e tinte tenui sono le prime cose a
   sparire, quindi lo stato deve reggere proprio nella condizione in cui lo
   accendi. */
.pista-scorciatoie .btn-sole{ background:var(--surface-1);
border:1.5px solid var(--border-strong); color:var(--text-1); }
.pista-scorciatoie .btn-sole.acceso{ background:var(--sun-on-bg);
border-color:var(--sun-on-bg); color:var(--sun-on-fg); }

/* ── la striscia dell'annulla: il rimedio accanto all'errore ──
   Prima l'annulla stava in fondo a 1150px di pagina, mentre l'errore era in
   cima. Un controllo sta accanto alla cosa che controlla. */
.striscia-annulla{ flex:0 0 auto; display:flex; align-items:center;
justify-content:space-between; gap:var(--s-2); min-height:var(--hit);
padding:0 var(--s-3); margin-bottom:var(--s-2);
background:var(--gold-200); border:1px solid var(--gold-400);
border-radius:var(--r-md); color:var(--gold-800);
font-size:var(--t-sm); font-weight:600; }
body.theme-dark .striscia-annulla{ background:color-mix(in srgb, var(--gold-400) 16%, var(--surface-1));
border-color:var(--gold-400); color:var(--gold-400); }
.striscia-annulla .num{ font-weight:800; }
.striscia-annulla > span{ min-width:0; }
/* Il rimedio non va a capo. Sul telefono vero "Annulla freccia" si spezzava in
   due righe e la striscia diventava alta il doppio del tasto che la contiene:
   un comando spezzato sembra due comandi. Il testo a sinistra puo' accorciarsi
   quanto serve, il comando no. */
.striscia-annulla button{ display:inline-flex; align-items:center; gap:var(--s-1);
flex:0 0 auto; white-space:nowrap; min-height:36px; padding:0 var(--s-2);
background:none; border:none; color:var(--clay); font-family:inherit;
font-size:var(--t-sm); font-weight:700; cursor:pointer; border-radius:var(--r-sm); }

/* ── la tastiera ──
   Mai piu' di tre per riga: su un telefono da 390px un tasto passa da 54 a
   ~90px di larghezza, ed e' per questo che l'etichetta puo' tornare dentro
   la scala tipografica invece di scendere a 8px come faceva la riga unica. */
.tastiera{ flex:0 0 auto; display:flex; flex-direction:column; gap:var(--s-2);
padding-bottom:env(safe-area-inset-bottom); }
.tastiera-riga{ display:grid; gap:var(--s-2); }
.tastiera-riga[data-n="1"]{ grid-template-columns:1fr; }
.tastiera-riga[data-n="2"]{ grid-template-columns:repeat(2,1fr); }
.tastiera-riga[data-n="3"]{ grid-template-columns:repeat(3,1fr); }
.tastiera .quick-btn{ height:auto; min-height:64px; gap:2px; }
/* La misura ora e' quella base (vedi .quick-lbl): qui resta solo cio' che
   e' davvero specifico del percorso. */
.tastiera .quick-btn .quick-lbl{ letter-spacing:.03em; }
.tastiera .quick-btn .quick-pts{ font-size:var(--t-xl); }

/* In orizzontale la tastiera si mangerebbe lo schermo: si abbassa. */
@media (max-height:560px){
.tastiera .quick-btn{ min-height:52px; }
.tastiera .quick-btn .quick-pts{ font-size:var(--t-lg); }
.pista-turni{ margin-top:var(--s-2); padding-top:var(--s-2); }
}

/* ── i pannelli: sagoma e classifica ──
   Occupano lo spazio centrale, mai quello dei tasti. */
.pannello{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
background:var(--surface-1); border:1px solid var(--border);
border-radius:var(--r-xl); padding:var(--s-3) var(--s-4) var(--s-4);
margin-bottom:var(--s-2); box-shadow:var(--elev-2); overflow-y:auto; }
.pannello-testa{ display:flex; align-items:center; gap:var(--s-2);
margin-bottom:var(--s-3); flex:0 0 auto; }
.pannello-titolo{ font-size:var(--t-md); font-weight:700; color:var(--text-1); }
.pannello-chiudi{ margin-left:auto; width:36px; height:36px; flex:0 0 auto;
display:inline-flex; align-items:center; justify-content:center;
background:none; border:1.5px solid var(--border-strong); border-radius:var(--r-sm);
color:var(--text-2); font-size:1.1rem; line-height:1; cursor:pointer; }
.pannello-sotto{ margin-top:auto; padding-top:var(--s-3); flex:0 0 auto; }
</style>
</head>

<div style="max-width:720px;margin:0 auto;padding:32px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;line-height:1.65;color:#10201D">

<script>
(function(){
"use strict";

// ── REGISTRAZIONE ERRORI ───────────────────────────────────────
// I catch dell'app riabilitano il pulsante ma non lasciano traccia: un errore
// sul telefono di un collaudatore in mezzo al bosco non si scopre mai. Qui ogni
// eccezione non gestita (e ogni promise andata male) finisce nella collezione
// errors, che l'admin legge dal pannello Approvazioni.
// Due freni obbligatori: mai due volte lo stesso errore nella stessa sessione e
// mai piu' di ERR_MAX scritture, altrimenti un errore dentro render() che si
// ripete a ogni ridisegno riempirebbe il database da solo.
var ERR_MAX   = 12;
var errSent   = 0;
var errSeen   = {};
var errQueue  = [];   // errori avvenuti prima del login: le regole vogliono un utente

function errContext(){
var scr = "?", lng = "?";
try{ if(typeof state === "object" && state){ scr = state.screen || "?"; lng = state.lang || "?"; } }catch(e){}
return {
screen: scr,
build: (typeof BUILD_STAMP === "string") ? BUILD_STAMP : "?",
lang: lng,
ua: String(navigator.userAgent || "").slice(0, 180),
online: navigator.onLine !== false,
at: Date.now()
};
}

function logError(dove, err, extra){
try{
var msg = "";
if(err && err.message) msg = String(err.message);
else if(typeof err === "string") msg = err;
else if(err){ try{ msg = JSON.stringify(err).slice(0, 200); }catch(e){ msg = String(err); } }
msg = msg.slice(0, 300);
var key = "k:" + String(dove || "?") + "|" + msg;
if(errSeen[key]) return;
errSeen[key] = true;
if(errSent >= ERR_MAX) return;
errSent++;
var rec = errContext();
rec.dove  = String(dove || "?").slice(0, 60);
rec.msg   = msg || "errore senza messaggio";
rec.stack = (err && err.stack) ? String(err.stack).slice(0, 700) : "";
if(extra){ try{ rec.extra = String(extra).slice(0, 200); }catch(e){} }
if(!db || !currentUser){ if(errQueue.length < 10) errQueue.push(rec); return; }
rec.uid = currentUser.uid;
db.collection("errors").add(rec).catch(function(){});
}catch(ignored){}
}

// Chiamata da onAuthReady: svuota quello che era successo prima dell'accesso.
function flushErrorQueue(){
try{
if(!db || !currentUser || !errQueue.length) return;
var pend = errQueue; errQueue = [];
pend.forEach(function(rec){
rec.uid = currentUser.uid;
db.collection("errors").add(rec).catch(function(){});
});
}catch(e){}
}

window.addEventListener("error", function(ev){

// ── PROFILI PUBBLICI ──────────────────────────────────────────
// users/{uid} contiene email e fcmToken: non puo' restare leggibile a chiunque
// sia loggato. L'elenco arcieri (inviti, chat privata, ricerca in Prepara gara)
// legge public_profiles/{uid}, che contiene SOLO nome mostrato e compagnia.
// L'ESISTENZA del documento significa "utente approvato": niente campo
// approved, niente where, quindi nessun rischio di where+orderBy.
// Chi lo scrive: l'utente stesso al login e al salvataggio del profilo,
// l'admin al momento dell'approvazione (e lo cancella alla revoca).
var publicProfilesCache = null;

// Chi sceglie di nascondere nome e cognome non deve solo vederli spariti
// dall'interfaccia: public_profiles e' leggibile da QUALUNQUE utente
// registrato, quindi il campo non va proprio scritto. Se c'era gia' lo si
// cancella con FieldValue.delete(), altrimenti il merge lo lascerebbe li'
// per sempre. Nome e cognome restano in users/{uid}, che legge solo
// l'interessato (e l'admin). Le regole usano hasOnly, che ammette un
// sottoinsieme: nessuna modifica a firestore.rules.
function publicProfileData(d){
d = d || {};
var nascondi = (d.nomeNascosto === true);
return {
username: d.username || "",
nomeCognome: nascondi ? firebase.firestore.FieldValue.delete() : (d.nomeCognome || ""),
compagnia: d.compagnia || null,
compagniaNome: d.compagniaNome || "",
updatedAt: firebase.firestore.FieldValue.serverTimestamp()
};
}

function writePublicProfile(uid, d){
if(!db || !uid) return Promise.resolve();
var data = publicProfileData(d);
// Senza nome mostrato il documento non servirebbe a niente e sporcherebbe
// l'elenco con una voce vuota.
if(!data.username) return Promise.resolve();
return db.collection("public_profiles").doc(uid).set(data, { merge:true });
}

function deletePublicProfile(uid){
if(!db || !uid) return Promise.resolve();
return db.collection("public_profiles").doc(uid).delete();
}

// Allinea il PROPRIO profilo pubblico. Silenziosa per scelta: se fallisce non
// deve impedire il login ne' il salvataggio del profilo.
function syncMyPublicProfile(d){
if(!db || !currentUser) return;
writePublicProfile(currentUser.uid, d).then(function(){
publicProfilesCache = null;
archersDirectory = null;
}).catch(function(e){ console.error("profilo pubblico:", e); });
}

// Unico punto di lettura dell'elenco pubblico, con cache condivisa: prima le
// stesse righe erano ripetute in quattro schermate diverse.
function loadPublicProfiles(cb){
if(publicProfilesCache){ cb(publicProfilesCache); return; }
if(!db){ cb([]); return; }
db.collection("public_profiles").get().then(function(snap){
var list = [];
snap.forEach(function(doc){
var d = doc.data() || {};
if(d.username){
list.push({
uid: doc.id, username: d.username, nomeCognome: d.nomeCognome || "",
compagnia: d.compagnia || null, compagniaNome: d.compagniaNome || ""
});
}
});
publicProfilesCache = list;
cb(list);
}).catch(function(e){ console.error("elenco arcieri:", e); cb([]); });
}

function onAuthReady(user){
currentUser = user;
flushErrorQueue();
db.collection("users").doc(user.uid).get().then(function(doc){
if(!doc.exists){
var pendingProfileRaw = null;
try{ pendingProfileRaw = window.localStorage.getItem(PENDING_PROFILE_KEY); }catch(e){}
var pendingProfile = null;
if(pendingProfileRaw){ try{ pendingProfile = JSON.parse(pendingProfileRaw); }catch(e){ pendingProfile = null; } }
var newDoc = {
// Dal 14/08 le registrazioni sono aperte: l'account nasce gia' attivo.
// Il filtro non e' piu' l'approvazione a mano ma la conferma dell'email.
email: user.email,
approved: true,
createdAt: firebase.firestore.FieldValue.serverTimestamp()
};
if(pendingProfile){
newDoc.nomeCognome = pendingProfile.nomeCognome;
newDoc.nomeNascosto = (pendingProfile.nomeNascosto === true);
newDoc.username = pendingProfile.username;
newDoc.federazioni = pendingProfile.federazioni;
newDoc.arco = pendingProfile.arco;
newDoc.privacy = true;
}
db.collection("users").doc(user.uid).set(newDoc);
if(pendingProfile && pendingProfile.nomeCognome){
state.profile = {
nomeCognome: newDoc.nomeCognome || "", nomeNascosto: (newDoc.nomeNascosto === true), username: newDoc.username || "",
email: user.email, federazioni: newDoc.federazioni || [], arco: newDoc.arco || null, privacy: true
};
}
try{ window.localStorage.removeItem(PENDING_PROFILE_KEY); }catch(e){}
authState = "ready";
if(newDoc.nomeCognome && !needsEmailVerification(user)) syncMyPublicProfile(newDoc);
} else {
var data = doc.data();
IS_BETA_TESTER = (data.betaTester === true);
IS_PREMIUM = (data.premium === true);
blockedUsers = data.blockedUsers || {};
if(!state.profile && data.nomeCognome){
state.profile = {
nomeCognome: data.nomeCognome, nomeNascosto: (data.nomeNascosto === true), username: data.username || "",
email: data.email || user.email, federazioni: data.federazioni || [], arco: data.arco || null, privacy: true,
compagnia: data.compagnia || null, compagniaNome: data.compagniaNome || ""
};
}
authState = data.approved ? "ready" : "pendingApproval";
// Il profilo pubblico si riallinea a ogni apertura: cosi' un cambio di nome
// o di compagnia fatto altrove non lascia l'elenco arcieri indietro.
if(data.approved) syncMyPublicProfile(data);
}
if(authState === "ready" && needsEmailVerification(user)){ authState = "verifyEmail"; }
if(authState === "ready"){
startIncomingSessionsListener();
loadOpenTrainings();
startNotificationsListener();
refreshPushToken();
startDirectChatsListener();
// Admin app: assegna automaticamente 01VERB se non ancora assegnato
if(currentUser && currentUser.email === ADMIN_EMAIL && db){
// L'app dell'admin lascia scritto il proprio uid: serve a chi si registra per
// avvisarlo, visto che nessun altro puo' cercare l'admin nella collezione users.
db.collection("app_config").doc("admin").set({ uid: currentUser.uid, email: currentUser.email }, { merge:true }).catch(function(){});
db.collection("compagnie_admin").doc("01VERB").get().then(function(doc){
if(!doc.exists || !doc.data().adminUid){
db.collection("compagnie_admin").doc("01VERB").set({ adminUid: currentUser.uid }, { merge: true })
.then(function(){ compagnieAdminCache = null; }).catch(function(){});
}
}).catch(function(){});
}
}
save();
render();
}).catch(function(){
authState = "authError";
authErrorMsg = "Non sono riuscito a leggere il tuo profilo. Riprova.";
render();
});
}

function initAuthFlow(){
if(!firebaseReady){ render(); return; }
try{
if(auth.isSignInWithEmailLink(window.location.href)){
var email = window.localStorage.getItem(PENDING_EMAIL_KEY);
if(!email){ email = window.prompt("Conferma la tua email per completare l'accesso:") || ""; }
auth.signInWithEmailLink(email, window.location.href).then(function(result){
window.localStorage.removeItem(PENDING_EMAIL_KEY);
window.history.replaceState({}, document.title, window.location.pathname);
onAuthReady(result.user);
}).catch(function(err){
authState = "authError";
authErrorMsg = err && err.message ? err.message : "Link non valido o scaduto.";
render();
});
} else {
auth.onAuthStateChanged(function(user){
if(user){ onAuthReady(user); }
else { authState = "needLogin"; render(); }
});
}
} catch(flowErr){
authState = "firebaseError";
render();
}
}

/* ══════════════════════════════════════════════════════════════════════════
   LE DIVISIONI: CHI VINCE CONTRO CHI

   Non e' una terna (stile + eta' + sesso): e' una COPPIA, Classe e Categoria.
   Il sesso e' gia' dentro la classe, e la prova che la coppia e' giusta e la
   terna no e' che DA - Diversamente Abili - non ha sesso: con tre assi
   indipendenti quella classe non si puo' scrivere. Un modello che non sa
   rappresentare una classe del regolamento e' sbagliato, per elegante che sia.

   La SIGLA e' la chiave, non un nostro codice. La federazione ha gia' deciso
   come si chiamano, "al fine di unificare la codifica informatica per la
   compilazione delle classifiche": se l'app inventasse `arco_ricurvo` invece
   di `RI`, la classifica che consegna andrebbe tradotta da qualcuno prima di
   essere usata. Si salvano le due sigle; i nomi restano in italiano in tutte
   e nove le lingue, perche' Cacciatori Maschile e Longbow sono nomi propri
   del regolamento, come Percorso, Tracciato e Battuta.

   OSP non e' un ripiego: e' nel regolamento, ed e' insieme classe e categoria
   perche' non ha ne' l'una ne' l'altra. Quindi il "fuori classifica" non va
   inventato - chi non dichiara e' Ospite, che in gara esiste e ha un nome.

   E queste sono le sigle FIARC, non "le sigle". Una federazione senza tabella
   qui non rompe niente: divisioniPer() restituisce null, i due menu non
   compaiono e la schermata resta quella di prima. Aggiungere una federazione
   e' aggiungere una voce, non toccare codice.
   ══════════════════════════════════════════════════════════════════════════ */

// ---------- CANCELLAZIONE DEI GIRI (con "lapide") ----------
// Cancellare un giro non basta a farlo sparire: se un altro dispositivo ha ancora
// la copia vecchia in memoria, al primo salvataggio sul cloud la rimanda su e il giro
// riappare nel diario. Per questo al posto del giro cancellato resta sul cloud un
// documento minimo con deleted:true (la "lapide"), e l'elenco delle lapidi e' tenuto
// anche in locale: nessun dispositivo puo' piu' resuscitare un giro cancellato.
// Il riepilogo permanente (record e medie) NON viene toccato: e' il conteggio
// di quello che hai davvero tirato, non l'elenco dei giri.
function loadDeletedRounds(){
try{ var raw = localStorage.getItem(DELETED_KEY); var o = raw ? JSON.parse(raw) : {}; return (o && typeof o === "object") ? o : {}; }catch(e){ return {}; }
}
function saveDeletedRounds(o){ try{ localStorage.setItem(DELETED_KEY, JSON.stringify(o)); }catch(e){} }

// Segna come cancellati uno o piu' giri (in locale subito, sul cloud in un'unica scrittura).
function markRoundsDeleted(dates){
var del = loadDeletedRounds();
var ids = [];
(dates || []).forEach(function(d){
if(!d) return;
var id = roundDocId(d);
del[id] = d;
ids.push(id);
});
if(!ids.length) return;
saveDeletedRounds(del);
try{
var ref = cloudHistoryRef();
if(!ref) return; // offline o non loggato: la lapide locale parte al prossimo salvataggio
var batch = db.batch();
ids.slice(0, 400).forEach(function(id){
batch.set(ref.doc(id), { date: del[id], deleted: true, deletedAt: firebase.firestore.FieldValue.serverTimestamp() });
});
batch.commit().catch(function(err){ cloudSyncState.lastError = describeFirebaseError(err); });
}catch(e){ cloudSyncState.lastError = describeFirebaseError(e); }
}
function markRoundDeleted(dateISO){ markRoundsDeleted([dateISO]); }

// Toglie da questo dispositivo i giri cancellati altrove. Restituisce quanti ne ha tolti.
function purgeDeletedFromLocal(goneMap){
if(!goneMap) return 0;
var hist = loadHistory();
var out = hist.filter(function(h){ return !(h && h.date && goneMap[roundDocId(h.date)] === true); });
var removed = hist.length - out.length;
if(!removed) return 0;
saveHistoryList(out);
try{
if(state && state.screen !== "round" && state.screen !== "summary"){
setTimeout(function(){ try{ render(); }catch(e){} }, 0);
}
}catch(e){}
return removed;
}

function deleteHistoryRound(idx){
var hist = loadHistory();
var h = hist[idx];
if(!h) return;
hist.splice(idx, 1);
saveHistoryList(hist);
if(h.date) markRoundDeleted(h.date);
}

// ---------- RIEPILOGO PERMANENTE ----------
// Lo storico viene tagliato a HISTORY_MAX giri: questo riepilogo no, cos\u00ec record e totali
// restano corretti anche quando i giri pi\u00f9 vecchi spariscono dallo storico.
function loadLifetime(){
try{ var raw = localStorage.getItem(LIFETIME_KEY); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
function saveLifetime(obj){ try{ localStorage.setItem(LIFETIME_KEY, JSON.stringify(obj)); }catch(e){} }

// Registra un giro nel riepilogo permanente. Chiave = nome arciere + modalit\u00e0.
function recordLifetime(name, modeKey, modeLabel, total, dateISO, format, ownerUid, isSelf){
if(!name || typeof total !== "number") return;
var lt = loadLifetime();
var k = name + "|" + (modeKey || modeLabel || "?");
var e = lt[k];
if(!e){
e = { name:name, modeKey:modeKey||null, modeLabel:modeLabel||"", rounds:0, sum:0, best:0, bestDate:null, bestFormat:null, firstDate:dateISO, lastDate:dateISO, ownerUid:ownerUid||null, isSelf:(isSelf===true) };
lt[k] = e;
}
if(ownerUid && !e.ownerUid) e.ownerUid = ownerUid;
if(isSelf === true) e.isSelf = true;
e.rounds += 1;
e.sum += total;
e.lastDate = dateISO;
if(total > e.best){ e.best = total; e.bestDate = dateISO; e.bestFormat = format || null; }
saveLifetime(lt);
return e;
}

// Ricostruisce il riepilogo dallo storico presente: serve una sola volta per chi
// aggiorna l'app avendo gi\u00e0 dei giri salvati da prima.
function backfillLifetimeOnce(){
try{
if(localStorage.getItem(LIFETIME_KEY)) return;
var hist = loadHistory();
if(!hist.length){ saveLifetime({}); return; }
var lt = {};
for(var i = hist.length - 1; i >= 0; i--){
var h = hist[i];
(h.results || []).forEach(function(r){
if(!r || typeof r.total !== "number") return;
var k = r.name + "|" + (h.modeKey || h.modeLabel || "?");
var e = lt[k];
if(!e){
e = { name:r.name, modeKey:h.modeKey||null, modeLabel:h.modeLabel||"", rounds:0, sum:0, best:0, bestDate:null, bestFormat:null, firstDate:h.date, lastDate:h.date, ownerUid:r.ownerUid||null, isSelf:(r.isSelf===true) };
lt[k] = e;
}
if(r.ownerUid && !e.ownerUid) e.ownerUid = r.ownerUid;
if(r.isSelf === true) e.isSelf = true;
e.rounds += 1;
e.sum += r.total;
e.lastDate = h.date;
if(r.total > e.best){ e.best = r.total; e.bestDate = h.date; e.bestFormat = h.format || null; }
});
}
saveLifetime(lt);
}catch(e){}
}
backfillLifetimeOnce();

// ---------- COPIA DELLO STORICO SUL CLOUD ----------
// Principio: il telefono resta la fonte primaria. Il cloud \u00e8 una copia di sicurezza.
// Al ripristino i giri vengono UNITI a quelli locali usando la data come identificativo:
// niente viene mai sovrascritto o cancellato.
var cloudSyncState = { running:false, lastError:"" };
var lastCloudRestoreMsg = ""; // messaggio da mostrare dopo il ridisegno seguente a un ripristino

// Trasforma un errore Firebase in un testo comprensibile, cos\u00ec si capisce
// cosa correggere senza dover aprire la console del browser.
function describeFirebaseError(err){
if(!err) return "errore sconosciuto";
var code = err.code || "";
var msg = err.message || String(err);
if(code.indexOf("permission-denied") !== -1 || /insufficient permissions/i.test(msg)){
return "permessi negati: vanno aggiornate le regole di Firestore per la sottocollezione storico";
}
if(code.indexOf("unauthenticated") !== -1) return "non autenticato: rifai l'accesso";
if(code.indexOf("unavailable") !== -1 || /offline|network/i.test(msg)) return "nessuna connessione al server";
if(code.indexOf("failed-precondition") !== -1) return "manca un indice su Firestore (campo date)";
if(code.indexOf("resource-exhausted") !== -1) return "quota Firestore esaurita";
if(code.indexOf("invalid-argument") !== -1) return "dati non validi inviati al server";
return (code ? code + " \u2014 " : "") + msg;
}

function cloudHistoryRef(){
if(DEV_MODE || !db || !currentUser) return null;
return db.collection("users").doc(currentUser.uid).collection("storico");
}

// Un giro = un documento, id derivato dalla data: se lo stesso giro viene inviato
// due volte non si duplica.
// Firestore non accetta array dentro array: il campo "arrows" \u00e8 un array che per ogni
// piazzola contiene l'array delle frecce. Prima di inviare lo si incapsula in oggetti,
// al ritorno si rimette com'era. Nessuna perdita di dati.
function packRound(r){
if(!r) return r;
var out = { name: r.name || "", total: (typeof r.total === "number" ? r.total : 0), isSelf: (r.isSelf === true), ownerUid: r.ownerUid || null };
out.perTarget = Array.isArray(r.perTarget) ? r.perTarget.slice() : [];
out.arrows = Array.isArray(r.arrows) ? r.arrows.map(function(a){
return { v: Array.isArray(a) ? a.slice() : (a == null ? [] : [a]) };
}) : [];
return out;
}
function unpackRound(r){
if(!r) return r;
var out = { name: r.name || "", total: (typeof r.total === "number" ? r.total : 0), isSelf: (r.isSelf === true), ownerUid: r.ownerUid || null };
out.perTarget = Array.isArray(r.perTarget) ? r.perTarget.slice() : [];
out.arrows = Array.isArray(r.arrows) ? r.arrows.map(function(a){
if(a && Array.isArray(a.v)) return a.v.slice();
return Array.isArray(a) ? a.slice() : [];
}) : [];
return out;
}
function packResults(list){ return (Array.isArray(list) ? list : []).map(packRound); }
function unpackResults(list){ return (Array.isArray(list) ? list : []).map(unpackRound); }

function roundDocId(dateISO){
return String(dateISO || "").replace(/[^0-9]/g, "").slice(0, 17) || String(Date.now());
}

function backupRoundToCloud(roundEntry){
var ref = cloudHistoryRef();
if(!ref || !roundEntry) return;
try{
ref.doc(roundDocId(roundEntry.date)).set({
date: roundEntry.date,
deleted: false,
format: roundEntry.format || null,
modeKey: roundEntry.modeKey || null,
modeLabel: roundEntry.modeLabel || "",
results: packResults(roundEntry.results),
consegna: roundEntry.consegna || null,
savedAt: firebase.firestore.FieldValue.serverTimestamp()
}, { merge: true }).catch(function(err){
cloudSyncState.lastError = describeFirebaseError(err);
});
}catch(e){ cloudSyncState.lastError = describeFirebaseError(e); }
}

// Invia sul cloud i giri locali che non ci sono ancora (per chi aveva gi\u00e0 storico
// prima di questo aggiornamento). Non tocca nulla in locale.
function pushLocalHistoryToCloud(cb){
var ref = cloudHistoryRef();
if(!ref){ if(cb) cb(null, 0); return; }
var hist = loadHistory();
if(!hist.length){ if(cb) cb(null, 0); return; }
ref.get().then(function(snap){
var have = {}, gone = {};
snap.forEach(function(d){
have[d.id] = true;
var dd = d.data();
if(dd && dd.deleted === true) gone[d.id] = true;
});
// lapidi note a questo dispositivo + lapidi trovate sul cloud
var del = loadDeletedRounds();
var k;
for(k in gone){ if(!del[k]) del[k] = true; }
for(k in del){ gone[k] = true; }
saveDeletedRounds(del);
// se un altro dispositivo ha cancellato dei giri, spariscono anche da qui
purgeDeletedFromLocal(gone);
var local = loadHistory();
var todo = local.filter(function(h){
if(!h || !h.date) return false;
var id = roundDocId(h.date);
return !have[id] && !gone[id];
});
// lapidi locali non ancora arrivate sul cloud (cancellazioni fatte offline)
var tomb = [];
for(k in del){ if(!have[k]) tomb.push(k); }
if(!todo.length && !tomb.length){ if(cb) cb(null, 0); return; }
var batch = db.batch();
todo.slice(0, 400).forEach(function(h){
batch.set(ref.doc(roundDocId(h.date)), {
date: h.date, deleted: false, format: h.format || null, modeKey: h.modeKey || null,
modeLabel: h.modeLabel || "", results: packResults(h.results),
savedAt: firebase.firestore.FieldValue.serverTimestamp()
}, { merge: true });
});
tomb.slice(0, 200).forEach(function(id){
batch.set(ref.doc(id), {
date: (typeof del[id] === "string" ? del[id] : null),
deleted: true,
deletedAt: firebase.firestore.FieldValue.serverTimestamp()
}, { merge: true });
});
return batch.commit().then(function(){ if(cb) cb(null, todo.length); });
}).catch(function(err){
cloudSyncState.lastError = describeFirebaseError(err);
if(cb) cb(err, 0);
});
}

// Scarica dal cloud i giri mancanti in locale e li UNISCE. Non cancella nulla.
function restoreHistoryFromCloud(cb){
var ref = cloudHistoryRef();
if(!ref){ if(cb) cb(null, 0); return; }
ref.orderBy("date", "desc").limit(HISTORY_MAX * 2).get().then(function(snap){
// prima le lapidi: cio' che e' stato cancellato non deve rientrare, e va tolto
// anche da questo dispositivo se ce l'ha ancora
var del = loadDeletedRounds();
var gone = {}, k;
for(k in del){ gone[k] = true; }
snap.forEach(function(doc){
var dd = doc.data();
if(dd && dd.deleted === true){
gone[doc.id] = true;
if(!del[doc.id]) del[doc.id] = dd.date || true;
}
});
saveDeletedRounds(del);
purgeDeletedFromLocal(gone);
var local = loadHistory();
var haveLocal = {};
local.forEach(function(h){ if(h && h.date) haveLocal[roundDocId(h.date)] = true; });
var added = 0;
snap.forEach(function(doc){
if(haveLocal[doc.id] || gone[doc.id]) return;
var d = doc.data();
if(!d || !d.date || d.deleted === true) return;
local.push({ date:d.date, format:d.format, modeKey:d.modeKey, modeLabel:d.modeLabel, results:unpackResults(d.results) });
added++;
});
if(added){
local.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
if(local.length > HISTORY_MAX) local.length = HISTORY_MAX;
saveHistoryList(local);
try{ localStorage.removeItem(LIFETIME_KEY); }catch(e){}
backfillLifetimeOnce();
}
if(cb) cb(null, added);
}).catch(function(err){
cloudSyncState.lastError = describeFirebaseError(err);
if(cb) cb(err, 0);
});
}

// ── TEMA ────────────────────────────────────────────────────────────────
// Il CHIARO e' il predefinito (15/08): all'aperto, con la luce forte, il nero
// riflette il cielo e il contrasto crolla. Chi un tema lo ha gia' scelto NON
// viene toccato: la scelta e' in state, salvata.
// Prima il predefinito era "elegante" ed era scritto in tre punti diversi.
// Dal 15/08/2026 i temi sono DUE: "dark" (la vecchia Soft) e "light".
// "satura" ed "elegante" restavano salvati addosso a chi li aveva scelti:
// vengono ricondotti allo scuro una volta sola, e riscritti.
// I temi sono TRE: chiaro (predefinito), scuro, e "automatica" — che segue
// l'impostazione del telefono e cambia da sola all'imbrunire.
// E soprattutto: la scelta vale SEMPRE. Prima, da 760px in su, il foglio di
// stile riscriveva la tavolozza e imponeva il chiaro anche a chi aveva scelto
// lo scuro. Adesso il tema e' uno solo, quello scelto, su ogni schermo.
/* NIENTE PIU' TEMA AUTOMATICO. *(16/08/2026, sera, ed e' una sottrazione.)*
   Seguiva l'impostazione scura/chiara del telefono. Chi lo sceglieva si
   aspettava un'altra cosa — che l'app si accorgesse della LUCE — e non
   vedendola succedere concludeva, tre volte di fila, che fosse rotto.
   Non lo era, e non poteva fare quello che gli si chiedeva: il sensore di
   luce ambientale non c'e' su iOS ne' su Safari, e su Android sta dietro un
   permesso sperimentale. Un'automazione che funziona su meta' dei telefoni e'
   peggio di una scelta manuale che funziona su tutti.
   Prima e' stato spiegato sotto, poi rinominato; alla terza volta la risposta
   giusta era togliere. **Una funzione che va spiegata due volte e' una
   funzione di troppo.** Restano tre temi, tutti e tre scelti a mano, e l'app
   parte da chiara.
   `normalizeTheme` continua ad accettare "auto" per un motivo solo: c'e' gente
   che ce l'ha salvato sul telefono, e va portata a chiara senza accorgersene.
   E' una migrazione, non un residuo — come "elegante" e "satura" qui sotto. */
function normalizeTheme(th){
if(th === "light" || th === "dark" || th === "sole") return th;
if(th === "elegante" || th === "satura") return "dark";
return "light";
}
function resolvedTheme(th){ return normalizeTheme(th); }

// ── IL SOLE SI ACCENDE DOVE SERVE ────────────────────────────────────────
// Il problema si presenta SUL PERCORSO: in piedi, col guanto, con lo schermo
// che non si legge piu'. Mandare a cercare il rimedio dentro il profilo, con
// lo schermo che non si legge, e' il disegno che fallisce nel momento in cui
// serve — la stessa regola per cui la striscia dell'annulla sta ATTACCATA
// all'errore e non in fondo a un riepilogo.
// NON sono tre pastiglie in testata: Chiara e Scura sono una preferenza e si
// scelgono una volta, nel profilo. Sole non e' una preferenza, e' il tempo che
// cambia. Quindi UN interruttore, DUE stati, nessuna scelta da fare — e
// spegnendolo si torna al tema che avevi, non a un predefinito.
function soleAcceso(){ return currentTheme() === "sole"; }
function toggleSole(){
if(soleAcceso()){
// Chi ha scelto Sole dal profilo non ha nessun tema "di prima": torna a
// chiara, che e' il predefinito dichiarato dell'app.
state.theme = normalizeTheme(state.themeAvantiSole || "light");
state.themeAvantiSole = null;
} else {
state.themeAvantiSole = currentTheme();
state.theme = "sole";
}
applyTheme(state.theme);
try{ save(); }catch(e){}
render();
}
function currentTheme(){
var raw = state.theme;
// Un tema che non esiste piu' — "auto", "elegante", "satura" — non si tiene
// in memoria: si converte una volta e si riscrive. Altrimenti la conversione
// riparte ad ogni apertura, e il giorno che qualcuno legge state.theme senza
// passare di qui trova un valore che il foglio di stile non conosce.
if(raw !== "light" && raw !== "dark" && raw !== "sole"){
state.theme = normalizeTheme(raw);
try{ save(); }catch(e){}
return state.theme;
}
return raw;
}
function applyTheme(th){
var eff = resolvedTheme(normalizeTheme(th));
document.body.classList.toggle("theme-light", eff === "light");
document.body.classList.toggle("theme-dark", eff === "dark");
document.body.classList.toggle("theme-sole", eff === "sole");
// La barra dell'indirizzo del browser deve seguire il tema, altrimenti resta
// una striscia nera sopra l'app bianca.
// Il colore della barra era un elenco di tre esadecimali scritti a mano
